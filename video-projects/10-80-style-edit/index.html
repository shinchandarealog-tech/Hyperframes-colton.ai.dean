<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --orange: #ff7a1a;
        --amber: #ffc066;
        --ember: #6b2a10;
        --night: #120806;
        --ink: #ffffff;
        --font-small: "Inter", sans-serif;
        --font-key: "Montserrat", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      /* ---------- face-cam ---------- */
      #face-fx {
        position: absolute;
        inset: 0;
        transform-origin: 50% 40%;
      }
      #face-wrap {
        position: absolute;
        inset: 0;
        transform-origin: 50% 18%;
      }
      #face-kb {
        position: absolute;
        inset: 0;
        transform-origin: 50% 25%;
      }
      #face {
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        filter: contrast(1.06) saturate(1.06) brightness(0.97);
      }
      #face-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 80% 70% at 50% 40%, transparent 55%, rgba(10, 4, 2, 0.45) 100%);
        pointer-events: none;
      }

      /* ---------- overlay layer ---------- */
      #overlay {
        position: absolute;
        inset: 0;
      }
      #spill {
        position: absolute;
        left: -200px;
        top: 700px;
        width: 1480px;
        height: 900px;
        background: radial-gradient(ellipse at 50% 50%, rgba(255, 122, 26, 0.55) 0%, rgba(255, 110, 20, 0.22) 38%, transparent 70%);
        mix-blend-mode: screen;
        opacity: 0;
      }

      #scrim {
        position: absolute;
        left: -100px;
        top: 900px;
        width: 1280px;
        height: 560px;
        background: radial-gradient(ellipse at 50% 50%, rgba(25, 9, 2, 0.5) 0%, rgba(25, 9, 2, 0.25) 45%, transparent 70%);
        opacity: 0;
      }
      /* captions */
      .cap {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 1030px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        opacity: 0;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      .sm,
      .quote {
        font-family: var(--font-key);
        font-weight: 800;
        font-style: italic;
        text-transform: uppercase;
        font-size: 72px;
        line-height: 1.04;
        color: var(--ink);
        letter-spacing: -0.01em;
        text-shadow: 0 0 16px rgba(255, 255, 255, 0.55), 0 0 34px rgba(255, 255, 255, 0.25), 0 3px 10px rgba(0, 0, 0, 0.55);
        white-space: nowrap;
      }
      .pill {
        border: 3px solid rgba(255, 255, 255, 0.95);
        border-radius: 999px;
        padding: 0 30px 4px 24px;
        box-shadow: 0 0 14px rgba(0, 0, 0, 0.25);
      }
      .kw,
      .kwu {
        font-family: var(--font-key);
        font-weight: 900;
        text-transform: uppercase;
        line-height: 1.02;
        white-space: nowrap;
        padding: 0 14px;
        background: linear-gradient(180deg, #fff3cc 0%, #ffc35a 30%, var(--orange) 62%, #f0560a 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 3px 0 rgba(80, 26, 0, 0.6)) drop-shadow(0 0 12px rgba(255, 110, 20, 0.95)) drop-shadow(0 0 38px rgba(255, 90, 10, 0.6));
      }
      .kw {
        font-style: italic;
        font-size: 128px;
        letter-spacing: -0.02em;
      }
      .kwu {
        font-style: normal;
        font-size: 104px;
        letter-spacing: -0.01em;
      }
      .words {
        display: flex;
        align-items: baseline;
        justify-content: center;
        flex-wrap: nowrap;
        gap: 0 14px;
      }
      .words.quote-row {
        flex-wrap: wrap;
        max-width: 820px;
        gap: 0 18px;
      }
      .w {
        display: inline-block;
        will-change: transform, opacity, filter;
      }
      .w .kw,
      .w .kwu {
        display: inline-block;
        padding: 0 4px;
      }
      .quote span {
        display: inline-block;
      }
      .icons {
        display: flex;
        gap: 34px;
        margin-bottom: 6px;
      }
      .icons svg {
        width: 78px;
        height: 78px;
        filter: drop-shadow(0 0 10px rgba(255, 120, 30, 0.9));
      }

      /* ---------- diagram cutaways ---------- */
      .gfx {
        position: absolute;
        inset: 0;
        opacity: 0;
        background: radial-gradient(ellipse 75% 45% at 50% 50%, var(--ember) 0%, #3a1608 38%, var(--night) 78%);
        overflow: hidden;
      }
      .gfx .glow {
        position: absolute;
        left: 140px;
        top: 760px;
        width: 800px;
        height: 400px;
        background: radial-gradient(ellipse at 50% 50%, rgba(255, 140, 50, 0.35), transparent 70%);
      }
      .bar {
        position: absolute;
        left: 100px;
        top: 920px;
        width: 880px;
        height: 84px;
        border-radius: 42px;
        border: 3px solid rgba(255, 232, 205, 0.9);
        box-shadow: 0 0 22px rgba(255, 130, 40, 0.55), inset 0 0 18px rgba(0, 0, 0, 0.35);
        background: rgba(60, 22, 8, 0.55);
        overflow: hidden;
      }
      .fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 100%;
        background: linear-gradient(180deg, #ffb066 0%, var(--orange) 55%, #d9520f 100%);
        transform-origin: 0 50%;
      }
      .flare {
        position: absolute;
        top: 880px;
        left: 0;
        width: 260px;
        height: 164px;
        background: radial-gradient(ellipse at 50% 50%, rgba(255, 255, 240, 0.95) 0%, rgba(255, 210, 140, 0.6) 22%, transparent 65%);
        mix-blend-mode: screen;
        opacity: 0;
      }
      .tick {
        position: absolute;
        top: 896px;
        width: 4px;
        height: 132px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
        transform-origin: 50% 50%;
      }
      .blabel {
        position: absolute;
        top: 920px;
        height: 84px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-small);
        font-weight: 700;
        font-size: 50px;
        color: #fff4e6;
        text-shadow: 0 0 10px rgba(255, 150, 60, 0.9), 0 2px 4px rgba(0, 0, 0, 0.5);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .note {
        position: absolute;
        font-family: var(--font-small);
        font-weight: 800;
        font-size: 72px;
        color: var(--orange);
        text-shadow: 0 0 16px rgba(255, 120, 30, 0.75);
        white-space: nowrap;
      }
      .note.white {
        color: #fff;
        font-weight: 600;
        font-size: 54px;
        text-shadow: 0 0 10px rgba(255, 150, 60, 0.5);
      }
      .arrows {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: visible;
      }
      .arrows path {
        fill: none;
        stroke: #fff;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.5));
        opacity: 0;
      }

      /* light leak */
      .leak {
        position: absolute;
        opacity: 0;
        mix-blend-mode: screen;
        pointer-events: none;
      }
      #flash {
        inset: 0;
        background: radial-gradient(ellipse at 50% 50%, #fff6e8 0%, #ffc070 45%, #ff7a1a 100%);
        mix-blend-mode: normal;
      }
      #leak-warm {
        inset: 0;
        background: #ff7a1a;
      }
      #leak-ring {
        left: 40px;
        top: 460px;
        width: 1000px;
        height: 1000px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(255, 150, 50, 0.95) 52%, rgba(255, 110, 20, 0.6) 60%, transparent 72%);
        filter: blur(18px);
      }
      #leak-blob {
        left: -500px;
        top: 200px;
        width: 1400px;
        height: 1500px;
        background: radial-gradient(ellipse at 50% 50%, rgba(255, 210, 140, 1) 0%, rgba(255, 130, 40, 0.8) 30%, transparent 65%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="37.6"
      data-width="1080"
      data-height="1920"
    >
      <div id="face-fx">
      <div id="face-wrap">
        <div id="face-kb">
          <video
            id="face"
            data-start="0"
            data-duration="37.6"
            data-track-index="0"
            src="assets/raw.mp4"
            muted
            playsinline
          ></video>
        </div>
        <div id="face-vignette"></div>
      </div>
      </div>

      <audio id="voice" data-start="0" data-duration="37.6" data-track-index="1" src="assets/raw.mp4" data-volume="1"></audio>
      <audio id="sfx-open" data-start="0.0" data-duration="1.1" data-track-index="3" src="assets/bass-drop.mp3" data-volume="0.25"></audio>
      <audio id="sfx-pop1" data-start="0.32" data-duration="0.72" data-track-index="4" src="assets/pop.mp3" data-volume="0.28"></audio>
      <audio id="sfx-pop2" data-start="0.8" data-duration="0.72" data-track-index="5" src="assets/pop.mp3" data-volume="0.28"></audio>
      <audio id="sfx-pop3" data-start="1.44" data-duration="0.72" data-track-index="6" src="assets/pop.mp3" data-volume="0.28"></audio>
      <audio id="sfx-k1" data-start="2.89" data-duration="0.2" data-track-index="7" src="assets/hard-cut.mp3" data-volume="0.45"></audio>
      <audio id="sfx-k2" data-start="5.69" data-duration="0.2" data-track-index="8" src="assets/hard-cut.mp3" data-volume="0.45"></audio>
      <audio id="sfx-k3" data-start="9.07" data-duration="0.2" data-track-index="9" src="assets/hard-cut.mp3" data-volume="0.45"></audio>
      <audio id="sfx-t1" data-start="10.35" data-duration="0.57" data-track-index="10" src="assets/whoosh.mp3" data-volume="0.6"></audio>
      <audio id="sfx-60" data-start="11.25" data-duration="0.46" data-track-index="11" src="assets/click.wav" data-volume="0.45"></audio>
      <audio id="sfx-t2" data-start="13.05" data-duration="1.06" data-track-index="12" src="assets/swipe.mp3" data-volume="0.65"></audio>
      <audio id="sfx-k4" data-start="15.23" data-duration="0.2" data-track-index="13" src="assets/hard-cut.mp3" data-volume="0.45"></audio>
      <audio id="sfx-k5" data-start="19.6" data-duration="0.2" data-track-index="14" src="assets/hard-cut.mp3" data-volume="0.45"></audio>
      <audio id="sfx-t3" data-start="19.95" data-duration="2.0" data-track-index="15" src="assets/power-up.mp3" data-volume="0.5"></audio>
      <audio id="sfx-500" data-start="22.55" data-duration="0.93" data-track-index="16" src="assets/zap.mp3" data-volume="0.7"></audio>
      <audio id="sfx-t4" data-start="25.05" data-duration="2.04" data-track-index="17" src="assets/sparkle.mp3" data-volume="0.4"></audio>
      <audio id="sfx-k6" data-start="25.32" data-duration="0.57" data-track-index="18" src="assets/whoosh.mp3" data-volume="0.4"></audio>
      <audio id="sfx-k7" data-start="30.3" data-duration="0.2" data-track-index="19" src="assets/hard-cut.mp3" data-volume="0.45"></audio>
      <audio id="sfx-z1" data-start="32.47" data-duration="0.57" data-track-index="20" src="assets/whoosh.mp3" data-volume="0.38"></audio>
      <audio id="sfx-k8" data-start="34.24" data-duration="0.2" data-track-index="21" src="assets/hard-cut.mp3" data-volume="0.45"></audio>
      <audio id="sfx-end" data-start="36.05" data-duration="1.1" data-track-index="22" src="assets/bass-drop.mp3" data-volume="0.32"></audio>

      <div id="overlay" class="clip" data-start="0" data-duration="37.6" data-track-index="2">
        <div id="scrim"></div>
        <div id="spill"></div>
        <svg id="mb-defs-svg" width="0" height="0" style="position:absolute"><defs id="mb-defs"></defs></svg>
        <div id="caps"></div>

        <!-- cutaway 1: latency -->
        <div id="g1" class="gfx">
          <div class="glow"></div>
          <div class="bar"><div class="fill" id="g1-fill"></div></div>
          <div class="flare" id="g1-flare"></div>
          <div class="tick" id="g1-tick" style="left: 268px"></div>
          <div class="blabel" id="g1-num" style="left: 100px; width: 168px">0ms</div>
          <div class="note" id="g1-ultra" style="left: 330px; top: 676px">Ultra-low</div>
          <div class="note white" id="g1-lat" style="left: 104px; top: 1030px">latency</div>
          <div class="note" id="g1-game" style="left: 0; width: 1080px; text-align: center; top: 1172px">Smooth gaming</div>
          <svg class="arrows" viewBox="0 0 1080 1920">
            <path id="g1-arc" d="M 318 724 C 230 724, 196 790, 186 892" />
            <path id="g1-arc-h" d="M 168 868 L 186 896 L 206 870" />
            <path id="g1-up" d="M 540 1160 L 540 1032 M 518 1056 L 540 1030 L 562 1056" />
          </svg>
        </div>

        <!-- cutaway 2: battery -->
        <div id="g2" class="gfx">
          <div class="glow"></div>
          <div class="bar"><div class="fill" id="g2-fill"></div></div>
          <div id="g2-nub" style="position:absolute;left:986px;top:938px;width:18px;height:48px;border-radius:0 10px 10px 0;background:rgba(255,232,205,.9);box-shadow:0 0 12px rgba(255,130,40,.6)"></div>
          <div class="flare" id="g2-flare"></div>
          <div class="blabel" id="g2-num" style="left: 100px; width: 880px">0 hrs</div>
          <div class="note" id="g2-charge" style="left: 90px; top: 676px">1 charge</div>
          <div class="note" id="g2-standby" style="left: 0; width: 1080px; text-align: center; top: 1172px">Standby time</div>
          <svg class="arrows" viewBox="0 0 1080 1920">
            <path id="g2-arc" d="M 400 724 C 560 690, 830 720, 900 892" />
            <path id="g2-arc-h" d="M 874 874 L 902 896 L 914 864" />
            <path id="g2-up" d="M 540 1160 L 540 1032 M 518 1056 L 540 1030 L 562 1056" />
          </svg>
        </div>

        <div id="flash" class="leak"></div>
        <div id="leak-warm" class="leak"></div>
        <div id="leak-blob" class="leak"></div>
        <div id="leak-ring" class="leak"></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const D = 37.6;
      const tl = gsap.timeline({ paused: true });

      // ---------- icons ----------
      const ICON = {
        game:
          '<svg viewBox="0 0 64 64"><path fill="#ff8a2a" d="M18 18h28c8 0 14 7 15 16l1 10c1 7-6 10-10 5l-6-7H18l-6 7c-4 5-11 2-10-5l1-10c1-9 7-16 15-16z"/><path fill="#3a1608" d="M20 26h4v5h5v4h-5v5h-4v-5h-5v-4h5zM44 27a3 3 0 1 1 0 .1zM40 34a3 3 0 1 1 0 .1z"/></svg>',
        music:
          '<svg viewBox="0 0 64 64"><path fill="#ff8a2a" d="M26 10l26-6v38a8 8 0 1 1-6-7.7V16l-14 3.4V48a8 8 0 1 1-6-7.7z"/></svg>',
        call:
          '<svg viewBox="0 0 64 64"><path fill="#ff8a2a" d="M18 6c2-1 4 0 5 2l5 11c1 2 0 4-1 5l-5 4c3 7 8 12 15 15l4-5c1-1 3-2 5-1l11 5c2 1 3 3 2 5l-3 9c-1 2-3 3-5 3C28 58 6 36 6 13c0-2 1-4 3-5z"/></svg>',
      };

      // ---------- caption script (times in source seconds) ----------
      // Each group: [start, end, items]. item: {k: kind, x: text, w: per-word fly-in times, r: row}
      // kinds: sm (small white), pill (small in outline pill, flies in as one unit),
      //        kw (italic glow keyword), kwu (upright glow keyword), quote, icons (uses t)
      const CAPS = [
        [0.02, 4.75, [
          { k: "icons", x: ["game", "music", "call"], t: [0.52, 1.0, 1.64], r: 0 },
          { k: "sm", x: "Gaming, music", w: [0.45, 1.0], r: 1 },
          { k: "sm", x: "& calling", w: [1.46, 1.64], r: 1 },
          { k: "kw", x: "All-rounder", w: [2.89], r: 2 },
          { k: "pill", x: "earbuds", w: [3.34], r: 3 },
        ]],
        [4.8, 6.5, [
          { k: "sm", x: "this is", w: [4.85, 5.1], r: 0 },
          { k: "kw", x: "Perfect", w: [5.69], r: 1 },
          { k: "sm", x: "for you", w: [5.95, 6.1], r: 2 },
        ]],
        [6.59, 7.9, [{ k: "sm", x: "True wireless", w: [7.46, 7.71], r: 0 }]],
        [7.94, 9.0, [{ k: "sm", x: "earbuds", w: [8.0], r: 0 }]],
        [9.05, 10.5, [{ k: "kwu", x: "Powerful bass", w: [9.2, 9.98], r: 0, s: 100 }]],
        // 10.5 – 13.62 : cutaway 1
        [13.62, 14.8, [{ k: "sm", x: "and quad silicon mic", w: [13.62, 13.86, 14.1, 14.65], r: 0 }]],
        [14.82, 16.45, [
          { k: "sm", x: "that cuts", w: [14.83, 15.0], r: 0 },
          { k: "kw", x: "Noise", w: [15.23], r: 1 },
        ]],
        [16.47, 17.5, [{ k: "sm", x: "just open the lid", w: [16.55, 16.8, 16.95, 17.08], r: 0 }]],
        [17.52, 18.8, [{ k: "sm", x: "& instantly connect", w: [17.55, 17.66, 18.16], r: 0 }]],
        [18.82, 20.1, [
          { k: "sm", x: "No delay,", w: [18.84, 19.01], r: 0 },
          { k: "kwu", x: "No hassle", w: [19.6, 19.87], r: 1 },
        ]],
        // 20.1 – 25.45 : cutaway 2
        [25.45, 26.45, [
          { k: "kw", x: "Tension-free", w: [25.47], r: 0 },
          { k: "sm", x: "use", w: [26.02], r: 1 },
        ]],
        [26.47, 27.36, [{ k: "sm", x: "touch control", w: [26.48, 26.79], r: 0 }]],
        [27.38, 28.62, [{ k: "pill", x: "Type-C charging", w: [27.38], r: 0 }]],
        [28.62, 29.62, [{ k: "sm", x: "& stylish look", w: [28.64, 28.85, 29.33], r: 0 }]],
        [29.65, 31.4, [
          { k: "sm", x: "all of it in", w: [29.68, 29.8, 29.92, 30.04], r: 0 },
          { k: "kw", x: "One pair", w: [30.3, 30.55], r: 1 },
        ]],
        [31.43, 32.6, [{ k: "quote", x: "So don't wait.", w: [31.43, 32.04, 32.18], r: 0 }]],
        [32.62, 35.36, [
          { k: "sm", x: "get your earbuds", w: [32.63, 33.0, 33.83], r: 0 },
          { k: "kw", x: "Order today", w: [34.24, 34.6], r: 1 },
        ]],
        [35.38, D, [
          { k: "sm", x: "& feel the sound's", w: [35.39, 35.6, 35.75, 35.9], r: 0 },
          { k: "kw", x: "Real power", w: [36.1, 36.52], r: 1 },
        ]],
      ];

      // Word fly-in (from the rayyan-visions reference): each word starts faded, blurred,
      // ~1.25x and offset above / to the side, then lands in ~0.2s. Direction rotates per word.
      // Reference timing: a word appears as a faint grey ghost ~230px above its slot (1080 scale),
      // drops in with vertical motion blur and lands in ~5 frames on a flat baseline.
      const FLY = [[24, -230], [-18, -210], [40, -250], [6, -220], [-30, -240], [52, -215]];
      const svgNS = "http://www.w3.org/2000/svg";
      const mbDefs = document.getElementById("mb-defs");
      let flyN = 0;
      function flyIn(el, t) {
        const n = flyN++;
        const [dx, dy] = FLY[n % FLY.length];
        const f = document.createElementNS(svgNS, "filter");
        f.setAttribute("id", "mb" + n);
        f.setAttribute("x", "-20%");
        f.setAttribute("y", "-80%");
        f.setAttribute("width", "140%");
        f.setAttribute("height", "260%");
        const blur = document.createElementNS(svgNS, "feGaussianBlur");
        blur.setAttribute("stdDeviation", "0 0");
        f.appendChild(blur);
        mbDefs.appendChild(f);
        el.style.filter = "url(#mb" + n + ")";
        tl.fromTo(el, { x: dx, y: dy, scale: 1.06 }, { x: 0, y: 0, scale: 1, duration: 0.17, ease: "power2.out" }, t);
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.17, ease: "power1.out" }, t);
        tl.fromTo(blur, { attr: { stdDeviation: "1.5 16" } }, { attr: { stdDeviation: "0 0" }, duration: 0.17, ease: "power2.out" }, t);
      }

      const capsEl = document.getElementById("caps");
      const MAXW = 930;
      const KEYS = ["kw", "kwu"];
      CAPS.forEach(([start, end, items], gi) => {
        const g = document.createElement("div");
        g.className = "cap";
        g.id = "cap" + gi;
        const rows = [];
        items.forEach((it, ii) => {
          if (!rows[it.r]) {
            rows[it.r] = document.createElement("div");
            rows[it.r].className = "row";
            g.appendChild(rows[it.r]);
          }
          const row = rows[it.r];
          let el;
          it.words = [];
          if (it.k === "icons") {
            el = document.createElement("div");
            el.className = "icons";
            el.innerHTML = it.x.map((n) => ICON[n]).join("");
          } else {
            // outer .w span carries the fly-in (incl. blur); inner span carries the look (glow filter)
            el = document.createElement("div");
            el.className = "words" + (it.k === "quote" ? " quote-row" : "");
            const parts = it.k === "pill" ? [it.x] : it.x.split(" ");
            const base = KEYS.includes(it.k) ? 104 : 72;
            const fs = Math.min(base, Math.floor(MAXW / (it.x.length * (KEYS.includes(it.k) ? 0.8 : 0.74))));
            el.style.columnGap = Math.round(fs * 0.24) + "px";
            parts.forEach((txt) => {
              const w = document.createElement("span");
              w.className = "w";
              const inner = document.createElement("span");
              inner.className = it.k === "pill" ? "sm pill" : it.k === "kwu" ? "kw" : it.k;
              inner.textContent = txt;
              inner.style.fontSize = fs + "px";
              w.appendChild(inner);
              el.appendChild(w);
              it.words.push(w);
            });
          }
          el.id = g.id + "-" + ii;
          row.appendChild(el);
          it.el = el;
        });
        capsEl.appendChild(g);

        tl.set(g, { opacity: 1 }, start);
        tl.set(g, { opacity: 0 }, end);
        items.forEach((it) => {
          if (it.k === "icons") {
            [...it.el.children].forEach((ic, n) => {
              tl.fromTo(ic, { opacity: 0, scale: 0.4, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "back.out(2.4)" }, it.t[n]);
            });
            tl.to(it.el, { y: -8, duration: end - it.t[2], ease: "sine.inOut" }, it.t[2]);
            return;
          }
          it.words.forEach((w, n) => flyIn(w, it.w[n]));
          if (KEYS.includes(it.k)) {
            const last = it.w[it.w.length - 1] + 0.22;
            tl.fromTo(it.el, { scale: 1 }, { scale: 1.04, duration: Math.max(0.3, end - last), ease: "sine.out" }, last);
          }
        });
        // keyword glow spills onto the footage
        const key = items.find((it) => KEYS.includes(it.k));
        if (key) {
          const kt = key.w[0];
          tl.fromTo("#spill", { opacity: 0 }, { opacity: 0.4, duration: 0.25, ease: "power2.out", immediateRender: false }, kt);
          tl.to("#spill", { opacity: 0, duration: 0.15, ease: "power1.in" }, end - 0.12);
          tl.fromTo("#scrim", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out", immediateRender: false }, kt - 0.05);
          tl.to("#scrim", { opacity: 0, duration: 0.15, ease: "power1.in" }, end - 0.12);
        }
      });

      // ---------- face-cam: Ken Burns + punch-in jump cuts ----------
      tl.fromTo("#face-kb", { scale: 1 }, { scale: 1.035, duration: D, ease: "none" }, 0);
      [
        [0, 1], [4.8, 1.13], [6.59, 1], [9.05, 1.13],
        [13.62, 1], [16.43, 1.13], [19.05, 1],
        [25.45, 1.12], [27.38, 1], [29.65, 1.15], [31.43, 1], [32.62, 1.12], [35.38, 1],
      ].forEach(([t, s], i) => {
        if (i % 2 === 1 && t > 1) {
          // zoom-snap: fast scale with a touch of motion blur
          tl.to("#face-wrap", { scale: s, duration: 0.14, ease: "expo.out" }, t - 0.04);
          tl.fromTo("#face", { filter: "contrast(1.06) saturate(1.06) brightness(0.97) blur(5px)" },
            { filter: "contrast(1.06) saturate(1.06) brightness(0.97) blur(0px)", duration: 0.16, ease: "power2.out", immediateRender: false }, t - 0.04);
        } else {
          tl.set("#face-wrap", { scale: s }, t);
        }
      });

      // ---------- cutaway 1: ultra-low latency (10.5 – 13.62) ----------
      const C1 = 10.5, C1E = 13.62;
      tl.set("#g1", { opacity: 1 }, C1);
      tl.set("#g1", { opacity: 0, x: 0, filter: "blur(0px)" }, C1E + 0.2);
      tl.fromTo("#g1 .bar", { scaleX: 0.04, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.42, ease: "expo.out" }, C1 + 0.04);
      tl.fromTo("#g1-fill", { scaleX: 0 }, { scaleX: 0.19, duration: 0.5, ease: "power3.out" }, C1 + 0.3);
      tl.fromTo("#g1-flare", { x: -60, opacity: 0 }, { x: 860, opacity: 1, duration: 0.7, ease: "power2.inOut" }, C1 + 0.1);
      tl.to("#g1-flare", { opacity: 0, duration: 0.2 }, C1 + 0.8);
      tl.fromTo("#g1-tick", { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.25, ease: "back.out(2)" }, C1 + 0.55);
      tl.fromTo("#g1-ultra", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, C1 + 0.45);
      const cnt1 = { v: 0 };
      tl.fromTo(cnt1, { v: 0 }, {
        v: 60, duration: 0.45, ease: "power2.out",
        onUpdate: () => (document.getElementById("g1-num").textContent = Math.round(cnt1.v) + "ms"),
      }, 11.25);
      tl.fromTo("#g1-num", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, 11.25);
      tl.fromTo("#g1-lat", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" }, 11.8);
      tl.fromTo("#g1-game", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 12.53);
      tl.fromTo("#g1 .glow", { opacity: 0.6, scale: 0.9 }, { opacity: 1, scale: 1.08, duration: C1E - C1, ease: "sine.inOut" }, C1);

      // ---------- cutaway 2: 500 hrs standby (20.1 – 25.45) ----------
      const C2 = 20.1, C2E = 25.45;
      tl.set("#g2", { opacity: 1 }, C2);
      tl.set("#g2", { opacity: 0 }, C2E);
      tl.fromTo(["#g2 .bar", "#g2-nub"], { scaleX: 0.04, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.42, ease: "expo.out" }, C2 + 0.04);
      tl.fromTo("#g2-charge", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 20.5);
      tl.fromTo("#g2-fill", { scaleX: 0 }, { scaleX: 1, duration: 1.7, ease: "power2.inOut" }, 21.6);
      tl.fromTo("#g2-flare", { x: -60, opacity: 0 }, { x: 860, opacity: 1, duration: 1.7, ease: "power2.inOut" }, 21.6);
      tl.to("#g2-flare", { opacity: 0, duration: 0.25 }, 23.3);
      const cnt2 = { v: 0 };
      tl.fromTo("#g2-num", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 21.6);
      tl.fromTo(cnt2, { v: 0 }, {
        v: 500, duration: 1.0, ease: "power2.out", immediateRender: false,
        onUpdate: () => (document.getElementById("g2-num").textContent = Math.round(cnt2.v) + " hrs"),
      }, 21.6);
      tl.fromTo("#g2-num", { scale: 1 }, { scale: 1.18, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, 22.6);
      tl.fromTo("#g2-standby", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 23.8);
      tl.fromTo("#g2 .glow", { opacity: 0.6, scale: 0.9 }, { opacity: 1, scale: 1.08, duration: C2E - C2, ease: "sine.inOut" }, C2);

      // hand-drawn arrows: stroke-dash draw-on
      function draw(sel, t, dur) {
        document.querySelectorAll(sel).forEach((p) => {
          const L = p.getTotalLength();
          p.style.strokeDasharray = L;
          tl.set(p, { opacity: 1 }, t);
          tl.fromTo(p, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t);
        });
      }
      draw("#g1-arc", 10.75, 0.4);
      draw("#g1-arc-h", 11.12, 0.14);
      draw("#g1-up", 12.62, 0.3);
      draw("#g2-arc", 20.7, 0.45);
      draw("#g2-arc-h", 21.12, 0.14);
      draw("#g2-up", 23.92, 0.3);

      // ---------- light leak: cutaway 2 -> face ----------
      const L = 25.1;
      tl.to("#leak-warm", { opacity: 0.35, duration: 0.3, ease: "power1.in" }, L);
      tl.fromTo("#leak-blob", { opacity: 0, x: 0 }, { opacity: 0.9, x: 380, duration: 0.4, ease: "sine.inOut" }, L + 0.05);
      tl.fromTo("#leak-ring", { opacity: 0, scale: 0.6, rotation: 0 }, { opacity: 1, scale: 1.25, rotation: 40, duration: 0.4, ease: "power2.out" }, L + 0.05);
      tl.to("#leak-warm", { opacity: 0.55, duration: 0.12, ease: "power2.in" }, L + 0.3);
      tl.to("#leak-warm", { opacity: 0, duration: 0.45, ease: "power2.out" }, C2E + 0.11);
      tl.to("#leak-blob", { opacity: 0, x: 700, duration: 0.45, ease: "power1.out" }, C2E + 0.11);
      tl.to("#leak-ring", { opacity: 0, scale: 1.6, duration: 0.45, ease: "power1.out" }, C2E + 0.11);

      // ---------- transitions ----------
      // T0 opening: settle into focus from a zoomed blur
      tl.fromTo("#face-fx", { scale: 1.22, filter: "blur(14px) brightness(1.3)" },
        { scale: 1, filter: "blur(0px) brightness(1)", duration: 0.5, ease: "expo.out" }, 0);

      // T1 face -> latency diagram: zoom-through
      tl.to("#face-fx", { scale: 1.6, filter: "blur(16px) brightness(1.7)", duration: 0.3, ease: "power2.in" }, 10.2);
      tl.set("#face-fx", { scale: 1, filter: "blur(0px) brightness(1)" }, C1 + 0.02);
      tl.fromTo("#g1", { scale: 1.3, filter: "blur(14px)" }, { scale: 1, filter: "blur(0px)", duration: 0.38, ease: "expo.out", immediateRender: false }, C1);

      // T2 latency diagram -> face: whip pan left
      tl.to("#g1", { x: -1080, filter: "blur(24px)", duration: 0.24, ease: "power4.in" }, 13.44);
      tl.fromTo("#face-fx", { x: 1080, filter: "blur(24px) brightness(1)" }, { x: 0, filter: "blur(0px) brightness(1)", duration: 0.3, ease: "power4.out", immediateRender: false }, 13.56);

      // T3 face -> battery diagram: orange overexposure flash
      tl.to("#face-fx", { filter: "blur(4px) brightness(2.4)", scale: 1.06, duration: 0.2, ease: "power2.in" }, 19.92);
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power2.in" }, 20.0);
      tl.set("#face-fx", { filter: "blur(0px) brightness(1)", scale: 1 }, C2 + 0.02);
      tl.to("#flash", { opacity: 0, duration: 0.35, ease: "power2.out" }, C2 + 0.04);

      // T5 accent zoom-blurs into the closing beats
      [[29.65, 1.1], [32.62, 1.08]].forEach(([t, k]) => {
        tl.fromTo("#face-fx", { scale: k, filter: "blur(10px) brightness(1.15)" }, { scale: 1, filter: "blur(0px) brightness(1)", duration: 0.32, ease: "expo.out", immediateRender: false }, t);
      });

      tl.set({}, {}, D);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
