<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Instrument Serif";
        font-style: italic;
        font-weight: 400;
        src: url("assets/fonts/InstrumentSerif-Italic.ttf") format("truetype");
      }
      :root {
        --orange: #ff7a1a;
        --amber: #ffc066;
        --ember: #6b2a10;
        --night: #120806;
        --ink: #ffffff;
        --font-small: "Inter", sans-serif;
        --font-key: "Montserrat", sans-serif;
        --font-serif: "Instrument Serif", "Playfair Display", serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      /* ---------- face-cam ---------- */
      #face-fx {
        position: absolute;
        inset: 0;
        transform-origin: 50% 40%;
      }
      #face-wrap {
        position: absolute;
        inset: 0;
        transform-origin: 50% 18%;
      }
      #face-kb {
        position: absolute;
        inset: 0;
        transform-origin: 50% 25%;
      }
      #face {
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        filter: contrast(1.06) saturate(1.06) brightness(0.97);
      }
      #fg {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        filter: contrast(1.06) saturate(1.06) brightness(0.97);
      }
      #face-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 80% 70% at 50% 40%, transparent 55%, rgba(10, 4, 2, 0.45) 100%);
        pointer-events: none;
      }

      /* ---------- overlay layer ---------- */
      #overlay {
        position: absolute;
        inset: 0;
      }
      /* ---------- captions (joshua-esca style) ---------- */
      .layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .persp {
        perspective: 1500px;
        perspective-origin: 50% 40%;
        transform-style: preserve-3d;
      }
      .giant,
      .sm,
      .serif,
      .sub,
      .orb {
        transform: translate(-50%, -50%);
        position: absolute;
        left: 0;
        top: 0;
        white-space: nowrap;
        opacity: 0;
      }
      /* giant word: sits BEHIND the speaker (between the video and her cutout) */
      .giant {
        width: 1080px;
        text-align: center;
        font-family: var(--font-small);
        font-weight: 900;
        letter-spacing: -0.055em;
        line-height: 0.82;
        color: #fff;
        text-shadow: 0 0 40px rgba(255, 255, 255, 0.15);
      }
      /* small bold sans words, popped in one by one */
      .sm {
        font-family: var(--font-small);
        font-weight: 700;
        font-size: 66px;
        letter-spacing: -0.02em;
        color: #fff;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.55);
      }
      /* elegant italic serif accent word, in front of the speaker, warm orange glow */
      .serif {
        font-family: var(--font-serif);
        font-style: italic;
        font-weight: 400;
        font-size: 190px;
        letter-spacing: -0.02em;
        line-height: 1;
        color: #fff7ee;
        text-shadow: 0 0 22px rgba(255, 130, 40, 0.55), 0 0 60px rgba(255, 110, 20, 0.35), 0 4px 14px rgba(0, 0, 0, 0.45);
      }
      .sm .it {
        font-family: var(--font-serif);
        font-style: italic;
        font-weight: 400;
        font-size: 1.12em;
      }
      /* subtitle line: small words revealed one by one from blur */
      .sub {
        width: 1080px;
        text-align: center;
        font-family: var(--font-small);
        font-weight: 600;
        font-size: 54px;
        letter-spacing: -0.01em;
        color: #fff;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
      }
      .sub span {
        display: inline-block;
        margin: 0 0.16em;
      }
      /* 3D word ring */
      .ring {
        position: absolute;
        left: 575px;
        top: 860px;
        width: 0;
        height: 0;
        transform-style: preserve-3d;
      }
      .slot {
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        transform-style: preserve-3d;
      }
      .orb {
        font-family: var(--font-small);
        font-weight: 800;
        font-size: 118px;
        letter-spacing: -0.03em;
        color: #fff;
        text-shadow: 0 0 18px rgba(255, 255, 255, 0.35);
        backface-visibility: visible;
        left: 0;
        top: 0;
        translate: -50% -50%;
      }

      /* ---------- diagram cutaways ---------- */
      .gfx {
        position: absolute;
        inset: 0;
        opacity: 0;
        background: radial-gradient(ellipse 75% 45% at 50% 50%, var(--ember) 0%, #3a1608 38%, var(--night) 78%);
        overflow: hidden;
      }
      .gfx .glow {
        position: absolute;
        left: 140px;
        top: 760px;
        width: 800px;
        height: 400px;
        background: radial-gradient(ellipse at 50% 50%, rgba(255, 140, 50, 0.35), transparent 70%);
      }
      .bar {
        position: absolute;
        left: 100px;
        top: 920px;
        width: 880px;
        height: 84px;
        border-radius: 42px;
        border: 3px solid rgba(255, 232, 205, 0.9);
        box-shadow: 0 0 22px rgba(255, 130, 40, 0.55), inset 0 0 18px rgba(0, 0, 0, 0.35);
        background: rgba(60, 22, 8, 0.55);
        overflow: hidden;
      }
      .fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 100%;
        background: linear-gradient(180deg, #ffb066 0%, var(--orange) 55%, #d9520f 100%);
        transform-origin: 0 50%;
      }
      .flare {
        position: absolute;
        top: 880px;
        left: 0;
        width: 260px;
        height: 164px;
        background: radial-gradient(ellipse at 50% 50%, rgba(255, 255, 240, 0.95) 0%, rgba(255, 210, 140, 0.6) 22%, transparent 65%);
        mix-blend-mode: screen;
        opacity: 0;
      }
      .tick {
        position: absolute;
        top: 896px;
        width: 4px;
        height: 132px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
        transform-origin: 50% 50%;
      }
      .blabel {
        position: absolute;
        top: 920px;
        height: 84px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-small);
        font-weight: 700;
        font-size: 50px;
        color: #fff4e6;
        text-shadow: 0 0 10px rgba(255, 150, 60, 0.9), 0 2px 4px rgba(0, 0, 0, 0.5);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .note {
        position: absolute;
        font-family: var(--font-small);
        font-weight: 800;
        font-size: 72px;
        color: var(--orange);
        text-shadow: 0 0 16px rgba(255, 120, 30, 0.75);
        white-space: nowrap;
      }
      .note.white {
        color: #fff;
        font-weight: 600;
        font-size: 54px;
        text-shadow: 0 0 10px rgba(255, 150, 60, 0.5);
      }
      .arrows {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: visible;
      }
      .arrows path {
        fill: none;
        stroke: #fff;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.5));
        opacity: 0;
      }

      /* light leak */
      .leak {
        position: absolute;
        opacity: 0;
        mix-blend-mode: screen;
        pointer-events: none;
      }
      /* red circle glitch transition (from the joshua-esca reference) */
      #redwipe,
      #redring {
        left: -660px;
        top: -240px;
        width: 2400px;
        height: 2400px;
        border-radius: 50%;
      }
      #redwipe {
        background: #d9232d;
        mix-blend-mode: multiply;
      }
      #redring {
        border: 22px solid #5ff2e6;
        box-shadow: 0 0 0 14px rgba(217, 35, 45, 0.9), 0 0 40px rgba(95, 242, 230, 0.8);
        mix-blend-mode: screen;
      }
      #wflash {
        inset: 0;
        background: radial-gradient(circle at 50% 50%, #ffffff 0%, #fff2f2 55%, #ffd9dc 100%);
        mix-blend-mode: normal;
      }
      #leak-warm {
        inset: 0;
        background: #ff7a1a;
      }
      #leak-ring {
        left: 40px;
        top: 460px;
        width: 1000px;
        height: 1000px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(255, 150, 50, 0.95) 52%, rgba(255, 110, 20, 0.6) 60%, transparent 72%);
        filter: blur(18px);
      }
      #leak-blob {
        left: -500px;
        top: 200px;
        width: 1400px;
        height: 1500px;
        background: radial-gradient(ellipse at 50% 50%, rgba(255, 210, 140, 1) 0%, rgba(255, 130, 40, 0.8) 30%, transparent 65%);
      }
    </style>
  </head>

      function motionBlur(el) {

      }
      function place(el, x, y) {
        // x,y = visual centre in frame px; xPercent/yPercent keep it centred while GSAP animates x/y
        gsap.set(el, { left: x, top: y, xPercent: -50, yPercent: -50 });
      }
      const capsEl = document.getElementById("caps");
      const behindEl = document.getElementById("behind");
      function make(cls, html, parent) {
        const el = document.createElement("div");
        el.className = cls;
        el.innerHTML = html;
        parent.appendChild(el);
        return el;
      }
      function show(el, t, end) {
        tl.set(el, { opacity: 1 }, t);
        tl.set(el, { opacity: 0 }, end);
      }

      BEATS.forEach(({ s, e, items }) => {
        items.forEach((it) => {
          const end = it.e || e;
          if (it.k === "giant") {
            const fs = Math.min(380, Math.floor(980 / (it.x.length * 0.8)));
            const el = make("giant", it.x, behindEl);
            el.style.fontSize = fs + "px";
            gsap.set(el, { top: GIANT_Y, yPercent: -50 });
            const blur = motionBlur(el);
            show(el, it.t, end);
            if (it.m === "pop") {
              tl.fromTo(el, { scale: 1.22 }, { scale: 1, duration: 0.2, ease: "power3.out" }, it.t);
              tl.fromTo(blur, { attr: { stdDeviation: "16 16" } }, { attr: { stdDeviation: "0 0" }, duration: 0.2, ease: "power2.out" }, it.t);
            } else {
              const dx = it.m === "sweepL" ? -460 : 460;
              tl.fromTo(el, { x: dx }, { x: 0, duration: 0.22, ease: "power3.out" }, it.t);
              tl.fromTo(blur, { attr: { stdDeviation: "46 0" } }, { attr: { stdDeviation: "0 0" }, duration: 0.22, ease: "power2.out" }, it.t);
            }
            // slow push so the giant word keeps living while it holds
            tl.fromTo(el, { scale: 1 }, { scale: 1.04, duration: Math.max(0.3, end - it.t - 0.22), ease: "none", immediateRender: false }, it.t + 0.22);
          } else if (it.k === "serif") {
            const el = make("serif", it.x, capsEl);
            const fs = Math.min(190, Math.floor(980 / (it.x.length * 0.42)));
            el.style.fontSize = fs + "px";
            place(el, 540, SERIF_Y);
            const blur = motionBlur(el);
            show(el, it.t, end);
            tl.fromTo(el, { y: 70, scaleY: 1.18 }, { y: 0, scaleY: 1, duration: 0.24, ease: "power3.out" }, it.t);
            tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power1.out", immediateRender: false }, it.t);
            tl.fromTo(blur, { attr: { stdDeviation: "0 18" } }, { attr: { stdDeviation: "0 0" }, duration: 0.24, ease: "power2.out" }, it.t);
          } else if (it.k === "sm") {
            const el = make("sm", it.x, capsEl);
            place(el, it.at[0], it.at[1]);
            show(el, it.t, end);
            tl.fromTo(el, { scale: 0.82, filter: "blur(10px)" }, { scale: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out" }, it.t);
            tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out", immediateRender: false }, it.t);
          } else if (it.k === "sub") {
            const el = make("sub", it.x.split(" ").map((w) => "<span>" + w + "</span>").join(""), capsEl);
            gsap.set(el, { top: SUB_Y, yPercent: -50 });
            show(el, it.w[0], end);
            [...el.children].forEach((sp, n) => {
              tl.fromTo(sp, { opacity: 0, filter: "blur(9px)", x: -10 }, { opacity: 1, filter: "blur(0px)", x: 0, duration: 0.18, ease: "power2.out" }, it.w[n]);
            });
          } else if (it.k === "spiral") {
            buildSpiral(it.w, s, e);
          }
        });
      });

      // Word ring (joshua-esca "how do you do that text effect"): the sentence is laid clockwise along
      // one tilted 3D ring around her — first word at 12 o'clock, then down the right side, upside-down
      // across the bottom, up the left. The radius grows as it goes, so the second lap sits outside the
      // first (a spiral). Each word flies in from the camera, big and blurred, and settles onto the ring;
      // meanwhile the whole ring slowly turns and tilts.
      function buildSpiral(words, s, e) {
        const front = document.getElementById("orb-front");
        const ring = make("ring", "", front);
        const FS = 86, R0 = 290, GROW = 35, GAP = 0.1, CHAR = 0.52;
        let ang = -0.32; // radians, clockwise from 12 o'clock; start just left of top like the reference
        words.forEach(([txt, t]) => {
          const arc = (txt.length * CHAR * FS) / (R0 + GROW * Math.max(0, ang) / (2 * Math.PI));
          const mid = ang + arc / 2;
          const r = R0 + GROW * Math.max(0, mid) / (2 * Math.PI);
          ang += arc + GAP;
          const slot = make("slot", "", ring);
          slot.style.transform = `rotate(${(mid * 180 / Math.PI).toFixed(2)}deg) translateY(${-r}px)`;
          const w = make("orb", txt, slot);
          w.style.fontSize = FS + "px";
          tl.fromTo(w, { z: 520, scale: 1.25, opacity: 0, filter: "blur(16px)" },
            { z: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, t);
        });
        show(front, s, e);
        tl.fromTo(ring, { rotationX: 22, rotationY: -3, rotationZ: -6, scale: 0.96 },
          { rotationX: 32, rotationY: 3, rotationZ: 12, scale: 1.04, duration: e - s, ease: "sine.inOut" }, s);
      }

      // ---------- face-cam: Ken Burns + punch-in jump cuts ----------
      tl.fromTo("#face-kb", { scale: 1 }, { scale: 1.035, duration: D, ease: "none" }, 0);
      [
        [0, 1], [4.8, 1.13], [6.59, 1], [9.05, 1.13],
        [13.62, 1], [16.43, 1.13], [19.05, 1],
        [25.45, 1.12], [27.38, 1], [29.65, 1.15], [31.43, 1], [32.62, 1.12], [35.38, 1],
      ].forEach(([t, s], i) => {
        if (i % 2 === 1 && t > 1) {
          // zoom-snap: fast scale with a touch of motion blur
          tl.to("#face-wrap", { scale: s, duration: 0.14, ease: "expo.out" }, t - 0.04);
          tl.fromTo("#face, #fg", { filter: "contrast(1.06) saturate(1.06) brightness(0.97) blur(5px)" },
            { filter: "contrast(1.06) saturate(1.06) brightness(0.97) blur(0px)", duration: 0.16, ease: "power2.out", immediateRender: false }, t - 0.04);
        } else {
          tl.set("#face-wrap", { scale: s }, t);
        }
      });

      // ---------- cutaway 1: ultra-low latency (10.5 – 13.62) ----------
      const C1 = 10.5, C1E = 13.62;
      tl.set("#g1", { opacity: 1 }, C1);
      tl.set("#g1", { opacity: 0, x: 0, filter: "blur(0px)" }, C1E + 0.2);
      tl.fromTo("#g1 .bar", { scaleX: 0.04, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.42, ease: "expo.out" }, C1 + 0.04);
      tl.fromTo("#g1-fill", { scaleX: 0 }, { scaleX: 0.19, duration: 0.5, ease: "power3.out" }, C1 + 0.3);
      tl.fromTo("#g1-flare", { x: -60, opacity: 0 }, { x: 860, opacity: 1, duration: 0.7, ease: "power2.inOut" }, C1 + 0.1);
      tl.to("#g1-flare", { opacity: 0, duration: 0.2 }, C1 + 0.8);
      tl.fromTo("#g1-tick", { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.25, ease: "back.out(2)" }, C1 + 0.55);
      tl.fromTo("#g1-ultra", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, C1 + 0.45);
      const cnt1 = { v: 0 };
      tl.fromTo(cnt1, { v: 0 }, {
        v: 60, duration: 0.45, ease: "power2.out",
        onUpdate: () => (document.getElementById("g1-num").textContent = Math.round(cnt1.v) + "ms"),
      }, 11.25);
      tl.fromTo("#g1-num", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, 11.25);
      tl.fromTo("#g1-lat", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" }, 11.8);
      tl.fromTo("#g1-game", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 12.53);
      tl.fromTo("#g1 .glow", { opacity: 0.6, scale: 0.9 }, { opacity: 1, scale: 1.08, duration: C1E - C1, ease: "sine.inOut" }, C1);

      // ---------- cutaway 2: 500 hrs standby (20.1 – 25.45) ----------
      const C2 = 20.1, C2E = 25.45;
      tl.set("#g2", { opacity: 1 }, C2);
      tl.set("#g2", { opacity: 0 }, C2E);
      tl.fromTo(["#g2 .bar", "#g2-nub"], { scaleX: 0.04, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.42, ease: "expo.out" }, C2 + 0.04);
      tl.fromTo("#g2-charge", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 20.5);
      tl.fromTo("#g2-fill", { scaleX: 0 }, { scaleX: 1, duration: 1.7, ease: "power2.inOut" }, 21.6);
      tl.fromTo("#g2-flare", { x: -60, opacity: 0 }, { x: 860, opacity: 1, duration: 1.7, ease: "power2.inOut" }, 21.6);
      tl.to("#g2-flare", { opacity: 0, duration: 0.25 }, 23.3);
      const cnt2 = { v: 0 };
      tl.fromTo("#g2-num", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 21.6);
      tl.fromTo(cnt2, { v: 0 }, {
        v: 500, duration: 1.0, ease: "power2.out", immediateRender: false,
        onUpdate: () => (document.getElementById("g2-num").textContent = Math.round(cnt2.v) + " hrs"),
      }, 21.6);
      tl.fromTo("#g2-num", { scale: 1 }, { scale: 1.18, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, 22.6);
      tl.fromTo("#g2-standby", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 23.8);
      tl.fromTo("#g2 .glow", { opacity: 0.6, scale: 0.9 }, { opacity: 1, scale: 1.08, duration: C2E - C2, ease: "sine.inOut" }, C2);

      // hand-drawn arrows: stroke-dash draw-on
      function draw(sel, t, dur) {
        document.querySelectorAll(sel).forEach((p) => {
          const L = p.getTotalLength();
          p.style.strokeDasharray = L;
          tl.set(p, { opacity: 1 }, t);
          tl.fromTo(p, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t);
        });
      }
      draw("#g1-arc", 10.75, 0.4);
      draw("#g1-arc-h", 11.12, 0.14);
      draw("#g1-up", 12.62, 0.3);
      draw("#g2-arc", 20.7, 0.45);
      draw("#g2-arc-h", 21.12, 0.14);
      draw("#g2-up", 23.92, 0.3);

      // ---------- light leak: cutaway 2 -> face ----------
      const L = 25.1;
      tl.to("#leak-warm", { opacity: 0.35, duration: 0.3, ease: "power1.in" }, L);
      tl.fromTo("#leak-blob", { opacity: 0, x: 0 }, { opacity: 0.9, x: 380, duration: 0.4, ease: "sine.inOut" }, L + 0.05);
      tl.fromTo("#leak-ring", { opacity: 0, scale: 0.6, rotation: 0 }, { opacity: 1, scale: 1.25, rotation: 40, duration: 0.4, ease: "power2.out" }, L + 0.05);
      tl.to("#leak-warm", { opacity: 0.55, duration: 0.12, ease: "power2.in" }, L + 0.3);
      tl.to("#leak-warm", { opacity: 0, duration: 0.45, ease: "power2.out" }, C2E + 0.11);
      tl.to("#leak-blob", { opacity: 0, x: 700, duration: 0.45, ease: "power1.out" }, C2E + 0.11);
      tl.to("#leak-ring", { opacity: 0, scale: 1.6, duration: 0.45, ease: "power1.out" }, C2E + 0.11);

      // ---------- transitions ----------
      // T0 opening: settle into focus from a zoomed blur
      tl.fromTo("#face-fx", { scale: 1.22, filter: "blur(14px) brightness(1.3)" },
        { scale: 1, filter: "blur(0px) brightness(1)", duration: 0.5, ease: "expo.out" }, 0);

      // T1 face -> latency diagram: zoom-through
      tl.to("#face-fx", { scale: 1.6, filter: "blur(16px) brightness(1.7)", duration: 0.3, ease: "power2.in" }, 10.2);
      tl.set("#face-fx", { scale: 1, filter: "blur(0px) brightness(1)" }, C1 + 0.02);
      tl.fromTo("#g1", { scale: 1.3, filter: "blur(14px)" }, { scale: 1, filter: "blur(0px)", duration: 0.38, ease: "expo.out", immediateRender: false }, C1);

      // T2 latency diagram -> face: whip pan left
      tl.to("#g1", { x: -1080, filter: "blur(24px)", duration: 0.24, ease: "power4.in" }, 13.44);
      tl.fromTo("#face-fx", { x: 1080, filter: "blur(24px) brightness(1)" }, { x: 0, filter: "blur(0px) brightness(1)", duration: 0.3, ease: "power4.out", immediateRender: false }, 13.56);

      // T3 face -> battery diagram: red circle glitch (joshua-esca reference) — a red disc with a
      // cyan/red chromatic rim sweeps across, the frame blows out to white, cut, white recedes.
      tl.fromTo("#redwipe", { opacity: 0.92, scale: 0.05, x: 520 }, { scale: 1, x: 0, duration: 0.17, ease: "power2.in", immediateRender: false }, 19.86);
      tl.fromTo("#redring", { opacity: 1, scale: 0.06, x: 540 }, { scale: 1.02, x: -14, duration: 0.17, ease: "power2.in", immediateRender: false }, 19.86);
      tl.to("#face-fx", { x: -18, duration: 0.05, ease: "none", yoyo: true, repeat: 3 }, 19.86);
      tl.fromTo("#wflash", { opacity: 0 }, { opacity: 1, duration: 0.07, ease: "power2.in", immediateRender: false }, 20.03);
      tl.set(["#redwipe", "#redring"], { opacity: 0 }, C2);
      tl.set("#face-fx", { x: 0 }, C2);
      tl.to("#wflash", { opacity: 0, duration: 0.3, ease: "power2.out" }, C2 + 0.02);

      // T5 accent zoom-blurs into the closing beats
      [[29.65, 1.1], [32.62, 1.08]].forEach(([t, k]) => {
        tl.fromTo("#face-fx", { scale: k, filter: "blur(10px) brightness(1.15)" }, { scale: 1, filter: "blur(0px) brightness(1)", duration: 0.32, ease: "expo.out", immediateRender: false }, t);
      });

      tl.set({}, {}, D);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
