<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <title>Abhira Green Energy</title>
  <style>
    @font-face { font-family: "PoppinsHF"; font-weight: 600; src: url("assets/fonts/poppins-devanagari-600-normal.woff2") format("woff2"); unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+25CC, U+A830-A839, U+A8E0-A8FF; }
    @font-face { font-family: "PoppinsHF"; font-weight: 800; src: url("assets/fonts/poppins-devanagari-800-normal.woff2") format("woff2"); unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+25CC, U+A830-A839, U+A8E0-A8FF; }
    @font-face { font-family: "PoppinsHF"; font-weight: 600; src: url("assets/fonts/poppins-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
    @font-face { font-family: "PoppinsHF"; font-weight: 800; src: url("assets/fonts/poppins-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }

    html, body { margin: 0; background: #000; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #04140A; font-family: "PoppinsHF", sans-serif; }

    .vwrap { position: absolute; inset: 0; z-index: 1; transform-origin: 50% 45%; }
    .vwrap video { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* text-only kinetic stage */
    .stage { position: absolute; inset: 0; z-index: 2; background: #04140A; overflow: hidden; }
    .stage .glow { position: absolute; inset: 0; background:
        radial-gradient(ellipse 70% 40% at 50% 46%, rgba(126,211,33,.30), transparent 70%),
        radial-gradient(ellipse 60% 30% at 50% 100%, rgba(255,181,46,.18), transparent 70%); }
    .stage .grid { position: absolute; left: -40%; right: -40%; top: 52%; height: 120%;
        transform: perspective(700px) rotateX(62deg); transform-origin: 50% 0;
        background-image:
          repeating-linear-gradient(0deg, rgba(126,211,33,.22) 0 2px, transparent 2px 80px),
          repeating-linear-gradient(90deg, rgba(126,211,33,.22) 0 2px, transparent 2px 80px);
        -webkit-mask-image: linear-gradient(to bottom, transparent, #000 25%, #000 60%, transparent);
                mask-image: linear-gradient(to bottom, transparent, #000 25%, #000 60%, transparent); }

    .logo-disc { position: absolute; left: 50%; top: 40%; width: 980px; height: 980px; margin: -490px 0 0 -490px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,252,236,.92) 0%, rgba(240,250,225,.75) 32%, rgba(200,235,170,.25) 52%, transparent 68%); }
    .outro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; padding: 0 70px 140px; box-sizing: border-box; }
    #outro-logo { position: relative; width: 720px; height: auto; filter: drop-shadow(0 0 40px rgba(126,211,33,.35)); }
    .outro-tag { position: relative; filter: drop-shadow(0 4px 12px rgba(0,0,0,.6)); font-weight: 800; font-size: 62px; text-align: center; line-height: 1.3; }
    .outro-phone { position: relative; font-weight: 600; font-size: 50px; color: #fff; letter-spacing: 0.02em; padding: 14px 40px; border: 2px solid rgba(126,211,33,.7); border-radius: 60px; background: rgba(15,90,30,.45); }

    /* readability scrim under the lower text band */
    #scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 1000px; z-index: 3; pointer-events: none;
      background: radial-gradient(ellipse 90% 55% at 50% 72%, rgba(0,0,0,.55), transparent 75%); }
    #scrim-top { position: absolute; left: 0; right: 0; top: 0; height: 700px; z-index: 3; pointer-events: none;
      background: radial-gradient(ellipse 85% 50% at 50% 30%, rgba(0,0,0,.28), transparent 75%); }

    /* kinetic text */
    .txt { position: absolute; left: 0; right: 0; z-index: 5; display: flex; justify-content: center; padding: 0 70px; box-sizing: border-box; }
    .txt.low { top: 1120px; }
    .txt.top { top: 300px; }
    .txt.mid { top: 0; bottom: 0; align-items: center; padding-bottom: 120px; }
    .stack { position: relative; display: flex; flex-direction: column; align-items: center; gap: 0; max-width: 940px;
      filter: drop-shadow(0 0 22px rgba(126,211,33,.45)) drop-shadow(0 6px 14px rgba(0,0,0,.75)); }
    .ln { line-height: 1.22; text-align: center; }
    .k { display: inline-block; font-weight: 800; letter-spacing: -0.01em; padding: 0 6px;
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
    .w { background-image: linear-gradient(180deg, #FFFFFF 0%, #FFFFFF 45%, #E2F5D2 75%, #B9E68F 100%); }
    .g { background-image: linear-gradient(180deg, #FFF2B8 0%, #FFD261 40%, #FFB52E 70%, #F08A00 100%); }
    .l { background-image: linear-gradient(180deg, #E9FFD0 0%, #A8EC5B 45%, #7ED321 75%, #4FA312 100%); }
    .strike { position: absolute; left: 4%; right: 4%; top: 46%; height: 14px; border-radius: 7px; background: #FF5A3C; transform-origin: 0 50%; box-shadow: 0 0 18px rgba(255,90,60,.7); }

    /* unifying texture */
    #vignette { position: absolute; inset: 0; z-index: 6; pointer-events: none;
      background: radial-gradient(ellipse 80% 70% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%); }
    #grain { position: absolute; inset: -60px; z-index: 7; pointer-events: none; opacity: .9;
      background-image:
        radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
        radial-gradient(rgba(0,0,0,.06) 1px, transparent 1px),
        radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 3px 3px, 5px 5px, 7px 7px; background-position: 0 0, 1px 2px, 3px 1px; }
    #flash { position: absolute; inset: 0; z-index: 8; pointer-events: none; opacity: 0;
      background: radial-gradient(ellipse 75% 60% at 50% 50%, rgba(255,250,225,1) 0%, rgba(255,214,120,.9) 45%, rgba(126,211,33,.35) 100%); }

    /* corner logo */
    #logo-glow { position: absolute; top: 8px; right: 4px; width: 272px; height: 272px; z-index: 9; pointer-events: none; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.55) 0%, rgba(255,255,255,.25) 40%, transparent 68%); }
    #logo { position: absolute; top: 44px; right: 40px; width: 200px; height: auto; z-index: 9;
      filter: drop-shadow(0 2px 10px rgba(0,0,0,.55)) drop-shadow(0 0 14px rgba(255,255,255,.15)); transform-origin: 80% 20%; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="/*TOTAL*/" data-width="1080" data-height="1920">
    <!--VIDEOS-->
    <!--STAGES-->
    <div id="scrim"></div>
    <div id="scrim-top"></div>
    <!--TEXTS-->
    <div id="vignette"></div>
    <div id="grain"></div>
    <div id="flash"></div>
    <div id="logo-glow"></div>
    <img id="logo" src="assets/logo.png" alt="Abhira Green Energy">

    <audio id="vo" src="assets/vo.m4a" data-start="0" data-duration="73.48" data-track-index="10" data-volume="1"></audio>
    <audio id="bgm" src="assets/bgm.m4a" data-start="0" data-duration="/*TOTAL*/" data-track-index="11" data-volume="1"></audio>

    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      /*JS*/
      window.__timelines["main"] = tl;
    </script>
  </div>
</body>
</html>
