<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1a0f08; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #1a0f08; }

      /* ---------- footage ---------- */
      .shot { position: absolute; inset: 0; overflow: hidden; will-change: transform, filter; }
      .push { position: absolute; inset: 0; transform-origin: 50% 50%; }
      .shot video { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }

      .gold {
        font-family: "Bebas Neue", sans-serif; color: #e8b54a;
        background: linear-gradient(180deg, #fff4dc 0%, #f1cf7a 38%, #e8b54a 55%, #a8721f 100%);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 18px rgba(232, 181, 74, 0.45)) drop-shadow(0 4px 10px rgba(0, 0, 0, 0.6));
      }

      /* ---------- overlay type ---------- */
      .ov { position: absolute; z-index: 30; left: 0; width: 1080px; text-align: center; }
      .cream {
        font-family: "Bebas Neue", sans-serif; color: #f3e6cf;
        text-shadow: 0 4px 18px rgba(0, 0, 0, 0.75), 0 0 3px rgba(0, 0, 0, 0.6);
      }
      #hook { top: 290px; padding: 0 80px; }
      #hook div { font-size: 116px; line-height: 0.98; letter-spacing: 0.02em; }

      #symptoms { top: 1190px; display: flex; flex-direction: column; align-items: center; gap: 0; }
      #symptoms div { font-size: 168px; line-height: 0.95; letter-spacing: 0.04em; }

      #ring-wrap { top: 0; height: 1920px; pointer-events: none; }
      #ring {
        position: absolute; left: 160px; top: 580px; width: 760px; height: 760px; border-radius: 50%;
        border: 3px solid rgba(232, 181, 74, 0.9);
        box-shadow: 0 0 30px rgba(232, 181, 74, 0.55), inset 0 0 30px rgba(232, 181, 74, 0.3);
      }
      #ring::after {
        content: ""; position: absolute; width: 22px; height: 22px; border-radius: 50%;
        top: -12px; left: 369px; background: #fff4dc; box-shadow: 0 0 22px 6px #e8b54a;
      }
      .ing { top: 1470px; }
      #ing-scrim { position: absolute; z-index: 29; left: 0; top: 1240px; width: 1080px; height: 680px; background: linear-gradient(180deg, rgba(26,15,8,0) 0%, rgba(26,15,8,0.82) 45%, rgba(26,15,8,0.92) 100%); }
      .ing .name {
        font-family: "Playfair Display", serif; font-style: italic; font-weight: 600; font-size: 104px;
      }
      .ing .idx {
        margin-top: 14px; font-family: Inter, sans-serif; font-weight: 600; font-size: 30px;
        letter-spacing: 0.32em; color: #f3e6cf; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      }

      #rootline { top: 250px; display: flex; flex-direction: column; align-items: center; }
      #rootline div { font-size: 150px; line-height: 0.95; letter-spacing: 0.03em; }
      #feeds { top: 300px; }
      #feeds div { font-size: 132px; letter-spacing: 0.03em; line-height: 1; }

      #tagline { top: 1260px; display: flex; flex-direction: column; align-items: center; }
      #tagline div { font-size: 156px; line-height: 0.95; letter-spacing: 0.03em; }

      #cta { top: 1430px; display: flex; flex-direction: column; align-items: center; gap: 26px; }
      #cta .pill {
        font-family: Inter, sans-serif; font-weight: 800; font-size: 46px; letter-spacing: 0.14em;
        color: #1a0f08; padding: 22px 64px; border-radius: 999px;
        background: linear-gradient(180deg, #fff4dc 0%, #f1cf7a 45%, #e8b54a 100%);
        box-shadow: 0 0 34px rgba(232, 181, 74, 0.55), 0 8px 20px rgba(0, 0, 0, 0.5);
      }
      #cta .url {
        font-family: "Playfair Display", serif; font-style: italic; font-weight: 600; font-size: 66px;
        color: #f3e6cf; text-shadow: 0 3px 14px rgba(0, 0, 0, 0.85);
      }

      /* ---------- finishing layers ---------- */
      #flash {
        position: absolute; inset: 0; z-index: 40; opacity: 0; pointer-events: none;
        background: radial-gradient(circle at 50% 50%, #fffaf0 0%, #f1cf7a 45%, #e8b54a 100%);
      }
      #vignette {
        position: absolute; inset: 0; z-index: 35; pointer-events: none;
        background: radial-gradient(ellipse 85% 70% at 50% 48%, rgba(0, 0, 0, 0) 55%, rgba(10, 5, 2, 0.55) 100%);
      }
      #grain {
        position: absolute; inset: -40px; z-index: 36; pointer-events: none; opacity: 0.08; mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      }
    </style>
  </head>

      <div class="shot" id="w-s09" style="z-index:9"><div class="push" style="transform-origin:50% 50%"><video id="s09" data-start="9.6" data-duration="0.95" data-media-start="3.0" data-track-index="1" src="assets/c04.mp4" muted playsinline></video></div></div>

      <div class="shot" id="w-s17" style="z-index:17"><div class="push" style="transform-origin:40% 70%"><video id="s17" data-start="18.5" data-duration="1.4" data-media-start="4.3" data-track-index="1" src="assets/c10.mp4" muted playsinline></video></div></div>
      <div class="shot" id="w-s18" style="z-index:18"><div class="push" style="transform-origin:50% 50%"><video id="s18" data-start="19.9" data-duration="1.35" data-media-start="4.0" data-track-index="1" src="assets/c11.mp4" muted playsinline></video></div></div>
      <div class="shot" id="w-s19" style="z-index:19"><div class="push" style="transform-origin:50% 50%"><video id="s19" data-start="21.25" data-duration="1.2" data-media-start="3.6" data-track-index="1" src="assets/c12.mp4" muted playsinline></video></div></div>
      <div class="shot" id="w-s20" style="z-index:20"><div class="push" style="transform-origin:50% 50%"><video id="s20" data-start="22.45" data-duration="1.55" data-media-start="0.0" data-track-index="1" src="assets/c13x.mp4" muted playsinline></video></div></div>
      <div class="shot" id="w-s21" style="z-index:21"><div class="push" style="transform-origin:50% 55%"><video id="s21" data-start="24.0" data-duration="0.9" data-media-start="4.6" data-track-index="1" src="assets/c03.mp4" muted playsinline></video></div></div>
      <div class="shot" id="w-s22" style="z-index:22"><div class="push" style="transform-origin:50% 50%"><video id="s22" data-start="24.9" data-duration="5.1" data-media-start="2.5" data-track-index="1" src="assets/c13x.mp4" muted playsinline></video></div></div>

      <!-- ================= OVERLAY TYPE ================= -->

      </div>

        <div class="cream" id="sy-1">THIN.</div>
        <div class="cream" id="sy-2">WEAK.</div>
        <div class="cream" id="sy-3">FALLING.</div>

      <div id="rootline" class="ov clip" data-start="6.4" data-duration="1.1" data-track-index="3">
        <div class="gold" id="rl-1">IT STARTS</div>

      <div id="ing-scrim" class="clip" data-start="13.2" data-duration="3.65" data-track-index="5"></div>

      <div id="ing-4" class="ov ing clip" data-start="15.85" data-duration="1.0" data-track-index="4"><div class="name gold">Procapil</div><div class="idx">04 / 04</div></div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // ---------- slow push-in on every shot (from its framing scale) ----------
        const shots = [
          ["s01", 0.0, 2.2, 1.0],
          ["s02", 2.2, 0.98, 1.0],
          ["s03", 3.18, 0.94, 1.25],
          ["s04", 4.12, 1.03, 1.45],
          ["s05", 5.15, 1.25, 1.3],
          ["s06", 6.4, 1.1, 1.0],
          ["s07", 7.5, 0.84, 1.0],
          ["s08", 8.34, 1.26, 1.35],
          ["s09", 9.6, 0.95, 1.0],
          ["s10", 10.55, 1.35, 1.0],
          ["s11", 11.9, 1.3, 1.2],
          ["s12", 13.2, 1.05, 1.0],
          ["s13", 14.25, 0.85, 1.0],
          ["s14", 15.1, 0.75, 1.0],
          ["s15", 15.85, 1.0, 1.0],
          ["s16", 16.85, 1.65, 1.0],
          ["s17", 18.5, 1.4, 1.3],
          ["s18", 19.9, 1.35, 1.0],
          ["s19", 21.25, 1.2, 1.0],
          ["s20", 22.45, 1.55, 1.0],
          ["s21", 24.0, 0.9, 1.15],
          ["s22", 24.9, 5.1, 1.0],
        ];
        shots.forEach(([id, s, d, b]) => {
          tl.fromTo("#w-" + id + " .push", { scale: b }, { scale: b * 1.07, duration: d, ease: "none" }, s);
        });

        // ---------- transition library (motion masks every cut) ----------
        const W = (id) => "#w-" + id;
        function flashAt(T, peak, up = 0.1, down = 0.35) {
          tl.fromTo("#flash", { opacity: 0 }, { opacity: peak, duration: up, ease: "power2.in", immediateRender: false }, T - up);
          tl.to("#flash", { opacity: 0, duration: down, ease: "power2.out" }, T);
        }
        function zoom(o, i, T) {
          tl.to(o, { scale: 1.28, filter: "blur(16px)", duration: 0.16, ease: "power2.in" }, T - 0.16);
          tl.fromTo(i, { scale: 1.22, filter: "blur(16px)" }, { scale: 1, filter: "blur(0px)", duration: 0.26, ease: "expo.out" }, T);
        }
        function zoomthru(o, i, T) {
          tl.to(o, { scale: 2.4, filter: "blur(26px)", duration: 0.22, ease: "power3.in" }, T - 0.22);
          tl.fromTo(i, { scale: 1.5, filter: "blur(22px)" }, { scale: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, T);
          flashAt(T, 0.35, 0.08, 0.25);
        }
        function punch(o, i, T) {
          tl.to(o, { scale: 1.08, duration: 0.08, ease: "power2.in" }, T - 0.08);
          tl.fromTo(i, { scale: 1.12, filter: "blur(8px)" }, { scale: 1, filter: "blur(0px)", duration: 0.2, ease: "expo.out" }, T);
          flashAt(T, 0.22, 0.04, 0.16);
        }
        function whip(o, i, T) {
          tl.to(o, { y: 300, scale: 1.25, filter: "blur(22px)", duration: 0.14, ease: "power2.in" }, T - 0.14);
          tl.fromTo(i, { y: -300, scale: 1.25, filter: "blur(22px)" }, { y: 0, scale: 1, filter: "blur(0px)", duration: 0.24, ease: "power3.out" }, T);
        }
        function whipx(o, i, T, dir = -1) {
          tl.to(o, { x: dir * 320, scale: 1.4, filter: "blur(22px)", duration: 0.14, ease: "power2.in" }, T - 0.14);
          tl.fromTo(i, { x: -dir * 320, scale: 1.4, filter: "blur(22px)" }, { x: 0, scale: 1, filter: "blur(0px)", duration: 0.24, ease: "power3.out" }, T);
        }
        const whipxr = (o, i, T) => whipx(o, i, T, 1);
        function spin(o, i, T) {
          tl.to(o, { rotation: 12, scale: 1.45, filter: "blur(20px)", duration: 0.15, ease: "power2.in" }, T - 0.15);
          tl.fromTo(i, { rotation: -12, scale: 1.45, filter: "blur(20px)" }, { rotation: 0, scale: 1, filter: "blur(0px)", duration: 0.28, ease: "power3.out" }, T);
        }
        function flash(o, i, T) {
          tl.to(o, { scale: 1.15, filter: "blur(10px)", duration: 0.12, ease: "power2.in" }, T - 0.12);
          tl.fromTo(i, { scale: 1.1 }, { scale: 1, duration: 0.4, ease: "expo.out" }, T);
          flashAt(T, 0.85, 0.12, 0.4);
        }

        zoom(W("s01"), W("s02"), 2.2);
        punch(W("s02"), W("s03"), 3.18);
        punch(W("s03"), W("s04"), 4.12);
        whip(W("s04"), W("s05"), 5.15);
        zoomthru(W("s05"), W("s06"), 6.4);
        flash(W("s06"), W("s07"), 7.5);
        punch(W("s07"), W("s08"), 8.34);
        zoom(W("s08"), W("s09"), 9.6);
        whip(W("s09"), W("s10"), 10.55);
        spin(W("s10"), W("s11"), 11.9);
        flash(W("s11"), W("s12"), 13.2);
        zoom(W("s12"), W("s13"), 14.25);
        zoom(W("s13"), W("s14"), 15.1);
        zoom(W("s14"), W("s15"), 15.85);
        whip(W("s15"), W("s16"), 16.85);
        punch(W("s16"), W("s17"), 18.5);
        flash(W("s17"), W("s18"), 19.9);
        whipx(W("s18"), W("s19"), 21.25);
        flash(W("s19"), W("s20"), 22.45);
        whipxr(W("s20"), W("s21"), 24.0);
        whipx(W("s21"), W("s22"), 24.9);

        // ---------- HOOK (problem = cream) ----------
        tl.from("#hook-1", { y: 40, opacity: 0, filter: "blur(10px)", duration: 0.45, ease: "power3.out" }, 0.15);
        tl.from("#hook-2", { y: 40, opacity: 0, filter: "blur(10px)", duration: 0.45, ease: "power2.out" }, 0.75);
        tl.to("#hook", { scale: 1.2, opacity: 0, filter: "blur(14px)", duration: 0.16, ease: "power2.in" }, 2.04);

        // ---------- THIN / WEAK / FALLING synced to VO (2.32 / 3.20 / 4.14) ----------
        tl.from("#sy-1", { scale: 1.6, opacity: 0, filter: "blur(16px)", duration: 0.28, ease: "expo.out" }, 2.3);
        tl.from("#sy-2", { scale: 1.6, opacity: 0, filter: "blur(16px)", duration: 0.28, ease: "expo.out" }, 3.18);
        tl.from("#sy-3", { y: -60, opacity: 0, filter: "blur(16px)", duration: 0.4, ease: "back.out(1.6)" }, 4.12);
        tl.to("#sy-3", { y: 26, duration: 0.6, ease: "power1.in" }, 4.52);
        tl.to("#symptoms", { y: 260, opacity: 0, filter: "blur(16px)", duration: 0.14, ease: "power2.in" }, 5.01);

        // ---------- IT STARTS AT THE ROOT (on the roots shot, synced to "Jadon mein hai" 6.54) ----------
        tl.from("#rl-1", { scale: 1.35, opacity: 0, filter: "blur(18px)", duration: 0.3, ease: "expo.out" }, 6.5);
        tl.from("#rl-2", { y: 50, opacity: 0, filter: "blur(12px)", duration: 0.32, ease: "power4.out" }, 6.8);
        tl.to("#rootline", { scale: 1.25, opacity: 0, filter: "blur(16px)", duration: 0.14, ease: "power2.in" }, 7.36);

        // ---------- INGREDIENT RING + NAMES (13.24 / 14.34 / 15.18 / 15.90) ----------
        tl.from("#ring", { scale: 0.6, opacity: 0, duration: 0.45, ease: "back.out(1.4)" }, 13.25);
        tl.fromTo("#ring", { rotation: 0 }, { rotation: 300, duration: 3.6, ease: "none" }, 13.25);
        [["#ing-1", 13.3], ["#ing-2", 14.3], ["#ing-3", 15.14], ["#ing-4", 15.88]].forEach(([sel, t], i) => {
          tl.from(sel + " .name", { y: 36, opacity: 0, filter: "blur(10px)", duration: 0.3, ease: i % 2 ? "power3.out" : "expo.out" }, t);
          tl.from(sel + " .idx", { opacity: 0, scaleX: 1.4, duration: 0.3, ease: "power2.out" }, t + 0.06);
        });
