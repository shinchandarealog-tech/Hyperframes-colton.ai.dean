<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Cormorant Garamond";
        font-style: italic;
        font-weight: 500;
        src: url("assets/fonts/cormorant-garamond-latin-500-italic.woff2") format("woff2");
      }
      @font-face {
        font-family: "Cormorant Garamond";
        font-style: italic;
        font-weight: 600;
        src: url("assets/fonts/cormorant-garamond-latin-600-italic.woff2") format("woff2");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #4a5f8f;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      /* ---------- camera rig ---------- */
      /* Each .layer sits at screen centre and carries the camera zoom (scaled by its parallax factor);
         each .pan carries the camera pan. Content inside .pan uses world coords (screen coords at zoom 1). */
      #stage {
        position: absolute;
        inset: 0;
      }
      .layer {
        position: absolute;
        left: 540px;
        top: 960px;
        width: 0;
        height: 0;
        transform-origin: 0 0;
      }
      .pan {
        position: absolute;
        left: -540px;
        top: -960px;
        width: 1080px;
        height: 1920px;
      }
      .pan > * {
        position: absolute;
      }
      #L-fg {
        opacity: 0;
      }

      /* sky: one tall gradient on the slow parallax layer, so the horizon drifts as the camera falls */
      #sky {
        left: -2600px;
        top: -3000px;
        width: 6280px;
        height: 9000px;
        background: linear-gradient(
          180deg,
          #26304f 0px,
          #3f5283 2600px,
          #5e6a98 3550px,
          #a98a9a 3930px,
          #f0903a 4110px,
          #f8c27a 4140px,
          #f6d6a8 4165px,
          #e8b8a2 4450px,
          #c7a3b8 5300px,
          #9c8db8 9000px
        );
      }
      #sun-glow {
        left: 250px;
        top: 670px;
        width: 900px;
        height: 900px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 214, 150, 0.6) 0%, rgba(255, 170, 90, 0.2) 38%, transparent 68%);
      }
      #sun {
        left: 590px;
        top: 1010px;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: radial-gradient(circle, #fff6dc 0%, #ffe0a0 55%, #ffc070 72%, rgba(255, 192, 112, 0) 74%);
        box-shadow: 0 0 110px 40px rgba(255, 180, 90, 0.45);
      }

      .cloud svg {
        width: 100%;
        height: 100%;
        overflow: visible;
        display: block;
      }
      #L-fg .cloud {
        filter: blur(12px);
      }
      #L-far .cloud {
        filter: blur(2px);
      }

      #set {
        left: 0;
        top: 0;
        width: 1080px;
        height: 2000px;
        overflow: visible;
        z-index: 2;
      }
      #envelope {
        left: 40px;
        top: -1500px;
        width: 1000px;
        height: 1620px;
        z-index: 1;
      }

      .char {
        width: 600px;
        height: 1000px;
        transform-origin: 300px 1000px;
        filter: drop-shadow(10px 6px 8px rgba(20, 14, 10, 0.35));
      }
      .char svg {
        width: 100%;
        height: 100%;
        overflow: visible;
        display: block;
      }
      #her {
        left: 480px;
        top: 880px;
        z-index: 4;
      }
      #him {
        left: 0;
        top: 880px;
        z-index: 5;
      }
      #hearts {
        left: 0;
        top: 0;
        z-index: 7;
      }
      .heart {
        position: absolute;
        width: 46px;
        height: 40px;
        opacity: 0;
      }

      /* ---------- screen-space overlays ---------- */
      #motes {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .mote {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 243, 226, 0.95), rgba(255, 210, 122, 0) 70%);
      }
      .txt {
        position: absolute;
        left: 0;
        width: 1080px;
        text-align: center;
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-weight: 500;
        color: #fff3e2;
        line-height: 1.1;
        text-shadow:
          0 0 18px rgba(255, 190, 110, 0.5),
          0 0 36px rgba(20, 24, 45, 0.8),
          0 2px 10px rgba(20, 24, 45, 0.7);
      }
      #t-ask {
        top: 300px;
        font-size: 92px;
      }
      #t-yes {
        top: 220px;
        font-size: 240px;
        font-weight: 600;
      }
      #t-end {
        top: 220px;
        font-size: 108px;
      }
      #t-sub {
        top: 360px;
        font-size: 52px;
      }
      .scrim {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(ellipse 560px 230px at 50% 345px, rgba(20, 24, 45, 0.5), rgba(20, 24, 45, 0) 72%);
      }
      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse 75% 60% at 50% 50%, transparent 45%, rgba(18, 16, 28, 0.6) 100%);
      }
      #grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image:
          radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
          radial-gradient(rgba(0, 0, 0, 0.05) 1px, transparent 1px),
          radial-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size:
          3px 3px,
          5px 5px,
          7px 7px;
        background-position:
          0 0,
          1px 2px,
          3px 1px;
      }
      #fadeout {
        position: absolute;
        inset: 0;
        background: #fff1e0;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <!-- shared gradients -->
    <svg width="0" height="0" style="position: absolute">
      <defs>
        <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff4ea" />
          <stop offset="0.55" stop-color="#f6dcd2" />
          <stop offset="1" stop-color="#c9a6bf" />
        </linearGradient>
        <linearGradient id="cgFar" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f6dccc" />
          <stop offset="1" stop-color="#b597b6" />
        </linearGradient>
        <!-- mannequin shading: light from the sun side (right) -->
        <linearGradient id="mG" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#16308a" />
          <stop offset="0.55" stop-color="#2a55d8" />
          <stop offset="1" stop-color="#5a84ff" />
        </linearGradient>
        <radialGradient id="mHead" cx="0.66" cy="0.34" r="0.75">
          <stop offset="0" stop-color="#6e94ff" />
          <stop offset="0.5" stop-color="#2a55d8" />
          <stop offset="1" stop-color="#16308a" />
        </radialGradient>
        <linearGradient id="wG" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#6e2414" />
          <stop offset="0.55" stop-color="#b3432a" />
          <stop offset="1" stop-color="#e06a44" />
        </linearGradient>
        <radialGradient id="wHead" cx="0.66" cy="0.34" r="0.75">
          <stop offset="0" stop-color="#ea7a52" />
          <stop offset="0.5" stop-color="#b3432a" />
          <stop offset="1" stop-color="#6e2414" />
        </radialGradient>
        <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6a5038" />
          <stop offset="1" stop-color="#4c3a28" />
        </linearGradient>
        <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2c261b" />
          <stop offset="1" stop-color="#3f3524" />
        </linearGradient>
        <linearGradient id="sideL" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#8a6a48" />
          <stop offset="1" stop-color="#5a4430" />
        </linearGradient>
        <linearGradient id="sideR" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#4a3826" />
          <stop offset="1" stop-color="#6e5338" />
        </linearGradient>
      </defs>
    </svg>

    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="25"
      data-width="1080"
      data-height="1920"
    >
      <div id="stage" class="clip" data-start="0" data-duration="25" data-track-index="0">
        <!-- parallax 0.15: sky + sun -->
        <div class="layer" id="L-sky">
          <div class="pan" id="P-sky">
            <div id="sky"></div>
            <div id="sun-glow"></div>
            <div id="sun"></div>
          </div>
        </div>

        <!-- parallax 0.5: cloud sea below the horizon -->
        <div class="layer" id="L-far"><div class="pan" id="P-far"></div></div>

        <!-- parallax 1: the world -->
        <div class="layer" id="L-world">
          <div class="pan" id="P-world">
            <!-- balloon envelope overhead -->
            <svg id="envelope" viewBox="0 0 1000 1620">
              <defs>
                <clipPath id="envClip">
                  <path d="M500,0 C830,0 1000,220 1000,520 C1000,820 830,1100 720,1500 L700,1620 L300,1620 L280,1500 C170,1100 0,820 0,520 C0,220 170,0 500,0Z" />
                </clipPath>
                <radialGradient id="envShade" cx="0.7" cy="0.85" r="0.9">
                  <stop offset="0" stop-color="#fff0c8" stop-opacity="0.4" />
                  <stop offset="0.45" stop-color="#fff0c8" stop-opacity="0" />
                  <stop offset="1" stop-color="#1c1830" stop-opacity="0.75" />
                </radialGradient>
              </defs>
              <g clip-path="url(#envClip)">
                <ellipse cx="500" cy="700" rx="530" ry="1200" fill="#c94a5e" />
                <ellipse cx="500" cy="700" rx="420" ry="1200" fill="#f2b06a" />
                <ellipse cx="500" cy="700" rx="320" ry="1200" fill="#e8c36a" />
                <ellipse cx="500" cy="700" rx="220" ry="1200" fill="#c94a5e" />
                <ellipse cx="500" cy="700" rx="120" ry="1200" fill="#f2b06a" />
                <ellipse cx="500" cy="700" rx="36" ry="1200" fill="#e8c36a" />
                <rect width="1000" height="1620" fill="url(#envShade)" />
              </g>
            </svg>

            <!-- the basket, drawn as a previs set seen from inside -->
            <svg id="set" viewBox="0 0 1080 2000">
              <rect x="170" y="96" width="740" height="44" rx="10" fill="#2a2420" />
              <rect x="470" y="140" width="140" height="40" rx="8" fill="#1f1b18" />
              <!-- far wall -->
              <rect x="190" y="1450" width="700" height="110" fill="url(#wallG)" />
              <!-- side walls in perspective -->
              <path d="M-40,1418 L190,1450 L190,1560 L-40,1905 Z" fill="url(#sideL)" />
              <path d="M1120,1418 L890,1450 L890,1560 L1120,1905 Z" fill="url(#sideR)" />
              <!-- floor -->
              <path d="M190,1560 L890,1560 L1120,1905 L-40,1905 Z" fill="url(#floorG)" />
              <!-- rims -->
              <path d="M-40,1408 L190,1440 L890,1440 L1120,1408 L1120,1426 L890,1458 L190,1458 L-40,1426 Z" fill="#3a2c20" />
              <!-- underside -->
              <rect x="-40" y="1905" width="1160" height="190" rx="10" fill="#2a2018" />
              <g stroke="#3d2f22" stroke-width="5"><line x1="-30" y1="1960" x2="1110" y2="1960" /><line x1="-30" y1="2020" x2="1110" y2="2020" /></g>
              <!-- corner posts -->
              <g stroke="#1f1c1a" stroke-width="16" stroke-linecap="round">
                <line x1="240" y1="140" x2="190" y2="1450" />
                <line x1="840" y1="140" x2="890" y2="1450" />
              </g>
            </svg>

            <!-- HER: red-orange mannequin, facing left -->
            <div id="her" class="char">
              <svg viewBox="0 0 600 1000">
                <path d="M222,160 Q210,340 248,525 L362,525 Q395,330 384,150 Z" fill="#8a3220" />
                <path d="M236,470 L364,470 L472,990 Q300,1012 128,990 Z" fill="url(#wG)" />
                <rect x="225" y="255" width="150" height="262" rx="75" fill="url(#wG)" />
                <rect x="280" y="232" width="40" height="40" fill="#8f3420" />
                <circle cx="300" cy="170" r="80" fill="url(#wHead)" />
                <circle cx="220" cy="184" r="14" fill="#a43c25" />
                <path d="M300,88 Q396,92 384,206 Q364,138 296,122 Z" fill="#8a3220" />
                <g id="w-armR">
                  <rect x="341" y="273" width="54" height="214" rx="27" fill="url(#wG)" />
                  <g id="w-foreR">
                    <rect x="343" y="435" width="50" height="200" rx="25" fill="url(#wG)" />
                    <circle cx="368" cy="612" r="30" fill="#c4502f" />
                  </g>
                </g>
                <g id="w-armL">
                  <rect x="205" y="273" width="54" height="214" rx="27" fill="url(#wG)" />
                  <g id="w-foreL">
                    <rect x="207" y="435" width="50" height="200" rx="25" fill="url(#wG)" />
                    <circle cx="232" cy="612" r="30" fill="#c4502f" />
                  </g>
                </g>
              </svg>
            </div>

            <!-- HIM: blue mannequin, facing right, holds the ring box -->
            <div id="him" class="char">
              <svg viewBox="0 0 600 1000">
                <g id="m-all">
                  <g id="m-armB">
                    <rect x="195" y="290" width="60" height="230" rx="30" fill="#1d3a9e" />
                    <g id="m-foreB">
                      <rect x="197" y="462" width="56" height="216" rx="28" fill="#1d3a9e" />
                      <circle cx="225" cy="652" r="34" fill="#1d3a9e" />
                    </g>
                  </g>
                  <g id="m-legB">
                    <rect x="225" y="525" width="70" height="280" rx="35" fill="#1d3a9e" />
                    <g id="m-shinB">
                      <rect x="225" y="735" width="70" height="265" rx="35" fill="#1d3a9e" />
                      <ellipse cx="282" cy="982" rx="54" ry="22" fill="#1a3390" />
                    </g>
                  </g>
                  <rect x="276" y="258" width="48" height="44" fill="#1d3a9e" />
                  <rect x="205" y="285" width="190" height="312" rx="95" fill="url(#mG)" />
                  <circle cx="300" cy="188" r="88" fill="url(#mHead)" />
                  <circle cx="386" cy="202" r="14" fill="#3561e6" />
                  <g id="m-legF">
                    <rect x="305" y="525" width="70" height="280" rx="35" fill="url(#mG)" />
                    <g id="m-shinF">
                      <rect x="305" y="735" width="70" height="265" rx="35" fill="url(#mG)" />
                      <ellipse cx="362" cy="982" rx="54" ry="22" fill="#2a55d8" />
                    </g>
                  </g>
                  <g id="m-armF">
                    <rect x="345" y="290" width="60" height="230" rx="30" fill="url(#mG)" />
                    <g id="m-foreF">
                      <rect x="347" y="462" width="56" height="216" rx="28" fill="url(#mG)" />
                      <circle cx="375" cy="652" r="34" fill="#3b66ee" />
                      <g id="rbox">
                        <rect x="343" y="668" width="64" height="46" rx="7" fill="#1c1820" stroke="#d9b25a" stroke-width="3" />
                        <g id="ring" opacity="0">
                          <circle cx="375" cy="664" r="10" fill="none" stroke="#ffd27a" stroke-width="4" />
                          <circle cx="375" cy="652" r="6" fill="#ffffff" />
                        </g>
                        <rect id="rlid" x="343" y="650" width="64" height="20" rx="6" fill="#2a2430" stroke="#d9b25a" stroke-width="3" />
                      </g>
                      <path id="glint" d="M375,622 L381,646 L405,652 L381,658 L375,682 L369,658 L345,652 L369,646 Z" fill="#fff8e8" opacity="0" />
                      <path id="star" d="M375,622 L381,646 L405,652 L381,658 L375,682 L369,658 L345,652 L369,646 Z" fill="#fff8e8" opacity="0" />
                    </g>
                  </g>
                </g>
              </svg>
            </div>

            <div id="hearts"></div>
          </div>
        </div>

        <!-- parallax 1.4: soft foreground clouds during the fall -->
        <div class="layer" id="L-fg"><div class="pan" id="P-fg"></div></div>
      </div>

      <div id="motes" class="clip" data-start="0" data-duration="25" data-track-index="1"></div>

      <div id="scrim-a" class="scrim clip" data-start="4.6" data-duration="5.0" data-track-index="2"></div>
      <div id="scrim-b" class="scrim clip" data-start="18.8" data-duration="6.2" data-track-index="3"></div>
      <div id="t-ask" class="txt clip" data-start="4.6" data-duration="2.6" data-track-index="4">will you marry me?</div>
      <div id="t-yes" class="txt clip" data-start="7.15" data-duration="2.45" data-track-index="5">yes.</div>
      <div id="t-end" class="txt clip" data-start="18.8" data-duration="6.2" data-track-index="6">she said yes.</div>
      <div id="t-sub" class="txt clip" data-start="19.5" data-duration="5.5" data-track-index="7">and i'm still falling.</div>

      <div id="vignette" class="clip" data-start="0" data-duration="25" data-track-index="8"></div>
      <div id="grain" class="clip" data-start="0" data-duration="25" data-track-index="9"></div>
      <div id="fadeout" class="clip" data-start="0" data-duration="25" data-track-index="10"></div>

      <audio id="a-pad" src="assets/dawn-pad.mp3" data-start="0" data-duration="25" data-track-index="20" data-volume="0.5"></audio>
      <audio id="a-glint1" src="assets/sparkle.mp3" data-start="4.85" data-duration="2" data-track-index="21" data-volume="0.25"></audio>
      <audio id="a-whoosh" src="assets/whoosh.mp3" data-start="10.6" data-duration="0.57" data-track-index="22" data-volume="0.35"></audio>
      <audio id="a-glint2" src="assets/sparkle.mp3" data-start="14.9" data-duration="2" data-track-index="21" data-volume="0.2"></audio>
      <audio id="a-glint3" src="assets/sparkle.mp3" data-start="19.6" data-duration="2" data-track-index="23" data-volume="0.25"></audio>
    </div>

    <script>
      (() => {
        // Deterministic pseudo-random (no Math.random)
        const hash = (i, k) => Math.abs(Math.sin(i * 12.9898 + k * 78.233) * 43758.5453) % 1;
        const NS = "http://www.w3.org/2000/svg";

        const SHAPES = [
          `<circle cx="70" cy="92" r="44"/><circle cx="128" cy="66" r="58"/><circle cx="198" cy="78" r="50"/>` +
            `<circle cx="250" cy="98" r="34"/><rect x="34" y="88" width="234" height="50" rx="25"/>`,
          `<circle cx="60" cy="100" r="38"/><circle cx="118" cy="80" r="48"/><circle cx="186" cy="62" r="60"/>` +
            `<circle cx="248" cy="96" r="40"/><rect x="26" y="96" width="250" height="42" rx="21"/>`,
          `<circle cx="78" cy="104" r="34"/><circle cx="122" cy="78" r="40"/><circle cx="176" cy="88" r="46"/>` +
            `<circle cx="232" cy="104" r="32"/><rect x="44" y="100" width="216" height="38" rx="19"/>`,
        ];
        let cloudN = 0;
        const CLOUD_SVG = (grad) => {
          const n = cloudN++;
          const flip = hash(n, 9) > 0.5 ? ' style="transform:scaleX(-1)"' : "";
          return `<svg viewBox="0 0 300 140"${flip}><g fill="url(#${grad})">${SHAPES[n % 3]}</g></svg>`;
        };

        function cloud(parentId, x, y, w, opacity, z, id, grad = "cg") {
          const el = document.createElement("div");
          el.className = "cloud";
          if (id) el.id = id;
          const h = w * 0.47;
          Object.assign(el.style, {
            left: `${x - w / 2}px`,
            top: `${y - h / 2}px`,
            width: `${w}px`,
            height: `${h}px`,
            opacity,
            zIndex: z,
            transformOrigin: "50% 100%",
          });
          el.innerHTML = CLOUD_SVG(grad);
          document.getElementById(parentId).appendChild(el);
          return el;
        }

        // far cloud sea below the horizon (parallax 0.5)
        [
          [-900, 2250, 900, 0.7], [100, 2300, 1000, 0.7], [-1500, 2450, 1000, 0.75], [-400, 2550, 1100, 0.75],
          [600, 2600, 900, 0.75], [-1100, 2800, 1200, 0.8], [0, 2900, 1200, 0.8], [-1700, 3050, 1200, 0.8],
          [-600, 3150, 1300, 0.85], [500, 3250, 1200, 0.85], [-1300, 3450, 1400, 0.85],
        ].forEach(([x, y, w, o]) => cloud("P-far", x, y, w, o, 1, null, "cgFar"));

        // world clouds
        [
          // puffs he drifts past on the way down
          [-1000, 2050, 520, 0.85, 2], [350, 2350, 600, 0.85, 2], [-1550, 2950, 600, 0.85, 2], [420, 3250, 600, 0.85, 2],
          [-1350, 3750, 560, 0.85, 2], [320, 3950, 500, 0.85, 2],
          // translucent wisps he falls through
          [-330, 2650, 900, 0.5, 8], [-220, 3450, 900, 0.5, 8],
          // the cloud sea he lands on
          [-1500, 4720, 1200, 1, 2], [250, 4740, 1200, 1, 2], [-1100, 4950, 1400, 1, 2], [-100, 4980, 1400, 1, 2],
          [-700, 5200, 1600, 1, 8], [-1600, 5300, 1400, 1, 8], [400, 5300, 1400, 1, 8], [-700, 5550, 1800, 1, 8],
        ].forEach(([x, y, w, o, z]) => cloud("P-world", x, y, w, o, z));
        cloud("P-world", -600, 4700, 1500, 1, 4, "land-cloud");
        // solid cloud floor so no sky peeks through gaps in the sea
        const floor = document.createElement("div");
        Object.assign(floor.style, {
          left: "-2600px", top: "4820px", width: "4200px", height: "1600px", zIndex: 1,
          borderRadius: "300px 300px 0 0", background: "linear-gradient(180deg, #f3d9d2 0%, #c9a6bf 100%)",
        });
        document.getElementById("P-world").appendChild(floor);

        // foreground clouds (parallax 1.4, blurred)
        [[-400, 2700, 900], [-1700, 3600, 1000], [-300, 4400, 1000], [-2000, 5600, 1200]].forEach(([x, y, w]) =>
          cloud("P-fg", x, y, w, 0.7, 1));

        // hearts above her
        const hearts = document.getElementById("hearts");
        [[700, 960], [760, 930], [660, 920], [800, 975], [740, 880]].forEach(([x, y]) => {
          const s = document.createElementNS(NS, "svg");
          s.setAttribute("viewBox", "0 0 34 30");
          s.setAttribute("class", "heart");
          s.style.left = `${x - 23}px`;
          s.style.top = `${y - 20}px`;
          s.innerHTML = `<path d="M17,29 C2,18 0,10 4,5 C8,0 14,1 17,6 C20,1 26,0 30,5 C34,10 32,18 17,29Z" fill="#e0607e"/>`;
          hearts.appendChild(s);
        });

        // drifting light motes (screen space)
        const motes = document.getElementById("motes");
        const moteEls = [];
        for (let i = 0; i < 28; i++) {
          const m = document.createElement("div");
          m.className = "mote";
          const sz = 6 + hash(i, 1) * 10;
          Object.assign(m.style, {
            left: `${hash(i, 2) * 1080}px`,
            top: `${hash(i, 3) * 1920}px`,
            width: `${sz}px`,
            height: `${sz}px`,
            opacity: 0.2 + hash(i, 4) * 0.45,
          });
          motes.appendChild(m);
          moteEls.push(m);
        }

        // ---------------- timeline ----------------
        const tl = gsap.timeline({ paused: true });

        // Camera: zoom on .layer, pan on .pan, both scaled by parallax factor
        const LAYERS = [["sky", 0.15], ["far", 0.5], ["world", 1], ["fg", 1.4]];
        const camS = (s, d, ease, at) =>
          LAYERS.forEach(([id, f]) => tl.to(`#L-${id}`, { scale: 1 + (s - 1) * f, duration: d, ease }, at));
        const camX = (cx, d, ease, at) =>
          LAYERS.forEach(([id, f]) => tl.to(`#P-${id}`, { x: -(cx - 540) * f, duration: d, ease }, at));
        const camY = (cy, d, ease, at) =>
          LAYERS.forEach(([id, f]) => tl.to(`#P-${id}`, { y: -(cy - 960) * f, duration: d, ease }, at));

        // opening camera: tight on the two of them against the sun
        LAYERS.forEach(([id, f]) => {
          gsap.set(`#L-${id}`, { scale: 1 + (1.6 - 1) * f });
          gsap.set(`#P-${id}`, { x: -(560 - 540) * f, y: -(1150 - 960) * f });
        });

        // svg joint helper
        const rot = (sel, r, origin, d, ease, at) => tl.to(sel, { rotation: r, svgOrigin: origin, duration: d, ease }, at);
        const M = { armF: "375 320", foreF: "375 490", armB: "225 320", foreB: "225 490",
          legF: "340 560", shinF: "340 770", legB: "260 560", shinB: "260 770", box: "375 690", lid: "343 670" };
        const W = { armL: "232 300", foreL: "232 460", armR: "368 300", foreR: "368 460" };

        // 1. Pull back from the sunrise to reveal the basket (0.2 - 2.6)
        camS(1.0, 2.4, "power2.inOut", 0.2);
        camX(540, 2.4, "power2.inOut", 0.2);
        camY(1100, 2.4, "power2.inOut", 0.2);
        // idle: they face each other, small weight shifts
        rot("#m-armF", -12, M.armF, 1.2, "sine.inOut", 0.3);
        rot("#w-armL", 10, W.armL, 1.2, "sine.inOut", 0.5);

        // 2. He drops to one knee and brings the box out (2.6 - 4.0)
        tl.to("#m-all", { y: 195, duration: 0.7, ease: "power2.inOut" }, 2.6);
        rot("#m-legF", -88, M.legF, 0.7, "power2.inOut", 2.6);
        rot("#m-shinF", 88, M.shinF, 0.7, "power2.inOut", 2.6);
        rot("#m-shinB", 90, M.shinB, 0.7, "power2.inOut", 2.6);
        rot("#m-armF", -95, M.armF, 0.7, "power3.out", 3.3);
        rot("#rbox", 95, M.box, 0.7, "power3.out", 3.3);
        rot("#m-armB", -80, M.armB, 0.7, "power3.out", 3.35);
        rot("#m-foreB", -10, M.foreB, 0.7, "power3.out", 3.35);
        // slow creep in on the moment
        camS(1.12, 6.0, "sine.inOut", 2.6);
        camY(1180, 6.0, "sine.inOut", 2.6);

        // 3. The box opens (4.2) — glint #1
        rot("#rlid", -115, M.lid, 0.35, "back.out(2)", 4.2);
        tl.to("#ring", { opacity: 1, duration: 0.2, ease: "power1.out" }, 4.25);
        tl.fromTo("#glint", { opacity: 0, scale: 0.2, rotation: 0, transformOrigin: "50% 50%" },
          { opacity: 1, scale: 2.2, rotation: 45, duration: 0.35, ease: "power3.out" }, 4.85);
        tl.to("#glint", { opacity: 0, scale: 0.2, rotation: 90, duration: 0.45, ease: "power2.in" }, 5.2);
        // her: one hand to her mouth, the other raised (the reference pose)
        rot("#w-armR", 25, W.armR, 0.55, "power2.out", 4.4);
        rot("#w-foreR", 150, W.foreR, 0.55, "power2.out", 4.4);
        rot("#w-armL", 60, W.armL, 0.55, "power2.out", 4.5);
        rot("#w-foreL", 120, W.foreL, 0.55, "power2.out", 4.5);
        tl.to("#her", { rotation: 3, duration: 0.6, ease: "sine.out" }, 4.4);

        tl.fromTo("#t-ask", { y: 30, opacity: 0, filter: "blur(12px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.8, ease: "expo.out" }, 4.7);
        tl.to("#t-ask", { y: -20, opacity: 0, filter: "blur(10px)", duration: 0.4, ease: "power2.in" }, 6.75);
        tl.to("#scrim-a", { opacity: 1, duration: 0.6, ease: "power1.out" }, 4.6);
        tl.to("#scrim-a", { opacity: 0, duration: 0.5, ease: "power1.in" }, 9.05);

        // 4. Yes — she hops, arms up, hearts (7.1 - 8.2)
        tl.to("#her", { y: -50, rotation: 0, duration: 0.22, ease: "power2.out" }, 7.1);
        tl.to("#her", { y: 0, duration: 0.3, ease: "power2.in" }, 7.32);
        rot("#w-armL", 160, W.armL, 0.25, "back.out(2)", 7.1);
        rot("#w-foreL", 10, W.foreL, 0.25, "back.out(2)", 7.1);
        rot("#w-armR", -160, W.armR, 0.25, "back.out(2)", 7.1);
        rot("#w-foreR", -10, W.foreR, 0.25, "back.out(2)", 7.1);
        tl.fromTo("#t-yes", { scale: 0.6, opacity: 0, filter: "blur(16px)" },
          { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "back.out(1.6)" }, 7.2);
        tl.to("#t-yes", { scale: 1.08, opacity: 0, filter: "blur(12px)", duration: 0.45, ease: "power2.in" }, 9.1);
        gsap.utils.toArray(".heart").forEach((h, i) => {
          const at = 7.3 + i * 0.15;
          tl.fromTo(h, { y: 0, scale: 0.3, opacity: 0 }, { y: -90, scale: 1, opacity: 1, duration: 0.7, ease: "power2.out" }, at);
          tl.to(h, { y: -170, opacity: 0, duration: 0.8, ease: "power1.in" }, at + 1.1);
        });

        // 5. He stands, they hug (7.8 - 9.9)
        tl.to("#m-all", { y: 0, duration: 0.6, ease: "power2.inOut" }, 7.8);
        rot("#m-legF", 0, M.legF, 0.6, "power2.inOut", 7.8);
        rot("#m-shinF", 0, M.shinF, 0.6, "power2.inOut", 7.8);
        rot("#m-shinB", 0, M.shinB, 0.6, "power2.inOut", 7.8);
        tl.to("#him", { x: 170, rotation: 4, duration: 0.6, ease: "power2.inOut" }, 8.3);
        tl.to("#her", { x: -150, rotation: -4, duration: 0.6, ease: "power2.inOut" }, 8.3);
        rot("#m-armF", -45, M.armF, 0.6, "power2.inOut", 8.3);
        rot("#m-foreF", -125, M.foreF, 0.6, "power2.inOut", 8.3);
        rot("#rbox", 170, M.box, 0.6, "power2.inOut", 8.3);
        rot("#m-armB", -60, M.armB, 0.6, "power2.inOut", 8.3);
        rot("#w-armL", 70, W.armL, 0.6, "power2.inOut", 8.3);
        rot("#w-foreL", 75, W.foreL, 0.6, "power2.inOut", 8.3);
        rot("#w-armR", 60, W.armR, 0.6, "power2.inOut", 8.3);
        rot("#w-foreR", 60, W.foreR, 0.6, "power2.inOut", 8.3);

        // 6. She steps back... and shoves (9.9 - 10.6)
        tl.to("#her", { x: -40, rotation: 4, duration: 0.35, ease: "power2.out" }, 9.9);
        tl.to("#him", { x: 120, rotation: 0, duration: 0.35, ease: "power2.out" }, 9.9);
        rot("#w-armL", 30, W.armL, 0.3, "power2.out", 9.9);
        rot("#w-foreL", 20, W.foreL, 0.3, "power2.out", 9.9);
        rot("#w-armR", 20, W.armR, 0.3, "power2.out", 9.9);
        rot("#w-foreR", 20, W.foreR, 0.3, "power2.out", 9.9);
        rot("#m-armF", -40, M.armF, 0.35, "power2.out", 9.9);
        rot("#m-foreF", 0, M.foreF, 0.35, "power2.out", 9.9);
        rot("#rbox", 40, M.box, 0.35, "power2.out", 9.9);
        rot("#m-armB", 0, M.armB, 0.35, "power2.out", 9.9);

        rot("#w-armL", 90, W.armL, 0.14, "power4.out", 10.35);
        rot("#w-foreL", 0, W.foreL, 0.14, "power4.out", 10.35);
        rot("#w-armR", 95, W.armR, 0.14, "power4.out", 10.35);
        rot("#w-foreR", 0, W.foreR, 0.14, "power4.out", 10.35);
        tl.to("#her", { x: -90, rotation: -8, duration: 0.16, ease: "power3.out" }, 10.35);
        tl.to("#him", { x: 90, rotation: -22, duration: 0.22, ease: "power3.out" }, 10.42);
        tl.to("#stage", { keyframes: { x: [0, -12, 9, -5, 3, 0], y: [0, 5, -3, 2, -1, 0] }, duration: 0.33, ease: "none" }, 10.42);

        // 7. Over the side of the basket and into slow motion
        tl.to("#him", { x: -500, y: -580, rotation: -70, duration: 1.0, ease: "power2.out" }, 10.6);
        rot("#m-armF", -180, M.armF, 0.9, "power2.inOut", 11.0);
        rot("#rbox", 180, M.box, 0.9, "power2.inOut", 11.0);
        rot("#m-armB", -150, M.armB, 0.9, "power2.inOut", 11.0);
        tl.to("#her", { x: 0, rotation: 0, duration: 0.8, ease: "sine.inOut" }, 10.7);
        rot("#w-armL", 30, W.armL, 0.8, "sine.inOut", 10.7);
        rot("#w-armR", 20, W.armR, 0.8, "sine.inOut", 10.7);
        camS(0.55, 1.1, "power2.out", 10.5);
        // follow-cam for the fall: track his body centre (he spins about his feet), damping the spin swing
        const FALL_T0 = 11.6, FALL_D = 7.0;
        const followCam = (u) => {
          const p = 1 - (1 - u) * (1 - u); // power2.out, matches his fall tweens
          const fx = -200 + 50 * p, fy = 1300 + 3030 * p;
          const r = ((-70 - 380 * u) * Math.PI) / 180; // spin is linear
          return [fx + 0.7 * 480 * Math.sin(r) - 20 * p, fy - 0.7 * 480 * Math.cos(r) - 230 * p];
        };
        const [cx0, cy0] = followCam(0);
        camX(cx0, 1.1, "power2.out", 10.5);
        camY(cy0, 1.1, "power2.out", 10.5);
        for (let i = 0; i < 28; i++) {
          const [cx, cy] = followCam((i + 1) / 28);
          camX(cx, FALL_D / 28, "none", FALL_T0 + (i * FALL_D) / 28);
          camY(cy, FALL_D / 28, "none", FALL_T0 + (i * FALL_D) / 28);
        }
        tl.to("#L-fg", { opacity: 1, duration: 1.0, ease: "power1.out" }, 11.4);

        // the slow-motion fall: one lazy spin, all the way down to a cloud
        tl.to("#him", { y: 2450, duration: 7.0, ease: "power2.out" }, 11.6);
        tl.to("#him", { x: -450, duration: 7.0, ease: "power2.out" }, 11.6);
        tl.to("#him", { rotation: -450, duration: 7.0, ease: "none" }, 11.6);
        camS(0.62, 4.0, "sine.inOut", 14.7);
        tl.to("#L-fg", { opacity: 0, duration: 1.2, ease: "power1.in" }, 17.4);
        // glint #2 mid-fall
        tl.fromTo("#glint", { opacity: 0, scale: 0.2, rotation: 0 },
          { opacity: 1, scale: 3, rotation: 45, duration: 0.4, ease: "power3.out", immediateRender: false }, 14.9);
        tl.to("#glint", { opacity: 0, scale: 0.2, rotation: 90, duration: 0.5, ease: "power2.in" }, 15.3);
        // arms settle: ring held up to the sky
        rot("#m-armF", -90, M.armF, 1.0, "sine.inOut", 17.6);
        rot("#rbox", 180, M.box, 1.0, "sine.inOut", 17.6);
        rot("#m-armB", -10, M.armB, 1.0, "sine.inOut", 17.6);

        // 8. Landing on the cloud
        tl.to("#land-cloud", { scaleY: 0.92, scaleX: 1.02, duration: 0.35, ease: "power2.out", yoyo: true, repeat: 1 }, 18.5);
        camS(0.66, 6.0, "sine.out", 18.8);

        // glint #3 -> becomes a star in the sky
        tl.fromTo("#glint", { opacity: 0, scale: 0.2, rotation: 0 },
          { opacity: 1, scale: 3.2, rotation: 45, duration: 0.4, ease: "power3.out", immediateRender: false }, 19.6);
        tl.to("#glint", { opacity: 0, scale: 0.2, rotation: 90, duration: 0.4, ease: "power2.in" }, 20.0);
        tl.fromTo("#star", { opacity: 1, scale: 1, x: 0, y: 0, transformOrigin: "50% 50%" },
          { x: 287, y: 506, scale: 2.2, rotation: 180, duration: 1.4, ease: "power2.out", immediateRender: false }, 20.0);
        tl.to("#star", { scale: 1.6, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 2 }, 21.4);

        tl.fromTo("#t-end", { y: 30, opacity: 0, filter: "blur(14px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 1.0, ease: "expo.out" }, 18.9);
        tl.fromTo("#t-sub", { y: 20, opacity: 0, filter: "blur(10px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.9, ease: "power2.out" }, 19.6);
        tl.to("#scrim-b", { opacity: 1, duration: 0.8, ease: "power1.out" }, 18.8);

        // ambient: motes, vignette breath
        moteEls.forEach((m, i) => {
          tl.to(m, { y: -(200 + hash(i, 5) * 300), x: (hash(i, 6) - 0.5) * 80, duration: 25, ease: "none" }, 0);
        });
        tl.to("#vignette", { opacity: 0.8, duration: 3, ease: "sine.inOut", yoyo: true, repeat: 7 }, 0);
        tl.to("#sun", { y: -40, duration: 25, ease: "none" }, 0);

        // final fade to dawn-white
        tl.to("#fadeout", { opacity: 1, duration: 0.8, ease: "power1.in" }, 24.2);

        tl.to({}, { duration: 25 }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
