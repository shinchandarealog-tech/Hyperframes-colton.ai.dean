    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (() => {
        const D = 45.73;
        // [text, start, end, flag]  flag: "kw" keyword (stays gold), "num" number, "" normal
        const WORDS = /*WORDS*/ [["Dussehra", 0, 0.462, "kw"], ["par", 0.462, 0.647, ""], ["sirf", 0.647, 1.109, ""], ["ghar", 1.109, 1.294, ""], ["aur", 1.294, 1.479, ""], ["naye", 1.479, 1.663, ""], ["kapde", 1.663, 2.126, ""], ["kyun?", 2.126, 2.68, ""], ["Is", 3.1, 3.267, ""], ["baar", 3.267, 3.518, ""], ["apne", 3.518, 3.852, ""], ["bike", 3.852, 4.186, ""], ["ko", 4.186, 4.353, ""], ["bhi", 4.353, 4.52, ""], ["dijiye", 4.52, 4.937, ""], ["festival", 4.937, 5.605, ""], ["wala", 5.605, 5.939, ""], ["makeover!", 5.939, 6.44, "kw"], ["Bike", 6.44, 6.799, "kw"], ["Masters", 6.799, 7.516, "kw"], ["lekar", 7.516, 7.875, ""], ["aaya", 7.875, 7.965, ""], ["hai", 7.965, 8.144, ""], ["Dussehra", 8.144, 8.593, "kw"], ["special", 8.593, 9.131, ""], ["offer", 9.131, 9.4, "kw"], ["Poore", 9.4, 9.715, ""], ["India", 9.715, 10.189, "kw"], ["ke", 10.189, 10.346, ""], ["participating", 10.346, 11.45, ""], ["stores", 11.45, 12.002, ""], ["par.", 12.002, 12.16, ""], ["Ab", 12.16, 12.365, ""], ["spare", 12.365, 12.876, ""], ["parts,", 12.876, 13.49, ""], ["body", 13.49, 13.899, ""], ["work,", 13.899, 14.41, ""], ["colour", 14.41, 14.922, ""], ["work", 14.922, 15.331, ""], ["aur", 15.331, 15.536, ""], ["labour", 15.536, 16.047, ""], ["charges", 16.047, 16.763, ""], ["par", 16.763, 16.968, ""], ["paaiye", 16.968, 17.377, ""], ["up", 17.377, 17.582, ""], ["to", 17.582, 17.786, ""], ["25%", 17.786, 18.093, "num"], ["OFF!", 18.093, 18.4, "kw"], ["Chahe", 18.4, 18.728, ""], ["aapke", 18.728, 19.057, ""], ["bike", 19.057, 19.385, ""], ["ko", 19.385, 19.549, ""], ["regular", 19.549, 20.124, ""], ["service", 20.124, 20.698, ""], ["chahiye,", 20.698, 21.191, ""], ["koi", 21.191, 21.437, ""], ["repair", 21.437, 21.929, ""], ["pending", 21.929, 22.504, ""], ["ho,", 22.504, 22.75, ""], ["body", 22.75, 23.078, ""], ["mein", 23.078, 23.325, ""], ["scratches", 23.325, 24.063, ""], ["ho,", 24.063, 24.309, ""], ["ya", 24.309, 24.638, ""], ["aap", 24.638, 24.802, ""], ["use", 24.802, 25.048, ""], ["d         const MAX_WORDS = 3;
        const GAP_BREAK = 0.32;

        const root = document.querySelector('[data-composition-id="captions"]');
        const zone = root.querySelector("#cap-zone");
        const tl = gsap.timeline({ paused: true });

        // Group into 2–3 word phrases, breaking on pauses and sentence ends
        const groups = [];
        let cur = [];
        WORDS.forEach((w, i) => {
          const prev = WORDS[i - 1];
          const brk =
            cur.length >= MAX_WORDS ||
            (prev && w[1] - prev[2] > GAP_BREAK) ||
            (prev && /[.!?,]$/.test(prev[0]));
          if (cur.length && brk) {
            groups.push(cur);
            cur = [];
          }
          cur.push(w);
        });
        if (cur.length) groups.push(cur);

        groups.forEach((g, gi) => {
          const el = document.createElement("div");
          el.className = "cg";
          el.id = "cg-" + gi;
          zone.appendChild(el);
          const start = g[0][1];
          const next = groups[gi + 1];
          const end = Math.min(next ? next[0][1] - 0.06 : D, g[g.length - 1][2] + 0.6);
          g.forEach((w) => {
            const s = document.createElement("span");
            s.className = "w" + (w[3] ? " " + w[3] : "");
            s.textContent = w[0].replace(/[,.!?]$/, "");
            el.appendChild(s);
          });
          const spans = el.querySelectorAll(".w");
          tl.set(el, { visibility: "visible" }, start - 0.06);
          tl.fromTo(el, { opacity: 0, y: 26, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.14, ease: "back.out(2)" }, start - 0.06);
          g.forEach((w, wi) => {
            const s = spans[wi];
            const isKey = !!w[3];
            tl.to(s, { scale: 1.1, color: "#ffb703", duration: 0.1, ease: "power2.out" }, w[1]);
            tl.to(s, { scale: 1, color: isKey ? "#ffb703" : "#ffffff", duration: 0.16, ease: "power1.out" }, Math.max(w[1] + 0.12, w[2] - 0.04));
          });
          // exit guarantee
          tl.to(el, { opacity: 0, scale: 0.96, duration: 0.1, ease: "power2.in" }, end - 0.1);
          tl.set(el, { opacity: 0, visibility: "hidden" }, end);
        });

        tl.to({}, { duration: D }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines["captions"] = tl;
      })();

</template>
