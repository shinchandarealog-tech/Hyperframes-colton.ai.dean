<template id="hero-behind-template">
  <div data-composition-id="hero-behind" data-width="1080" data-height="1920">
    <!-- Giant red words that sit BEHIND the presenter cutout (escapemedia depth-sandwich).
         Bottom edge of each word lands on her hairline (y≈615–780) so her head occludes it. -->
    <div class="hb-word hb-dussehra" id="hb-dussehra">DUSSEHRA</div>
    <div class="hb-word hb-dussehra" id="hb-dussehra2">DUSSEHRA</div>

    <div class="hb-word hb-bike" id="hb-bike">BIKE</div>
    <div class="hb-word hb-masters" id="hb-masters">MASTERS</div>

    <div class="hb-word hb-newlook" id="hb-newlook">NEW LOOK</div>

    <div class="hb-word hb-festive" id="hb-festive">FESTIVE</div>
    <div class="hb-word hb-season gold" id="hb-season">SEASON</div>

    <div class="hb-word hb-fresh" id="hb-fresh">FRESH</div>
    <div class="hb-word hb-start" id="hb-start">START</div>

    <div class="hb-word hb-end-bike" id="hb-end-bike">BIKE</div>
    <div class="hb-word hb-end-masters" id="hb-end-masters">MASTERS</div>

    <style>
      @font-face {
        font-family: "Anton";
        src: url("../assets/fonts/anton-latin-400.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      [data-composition-id="hero-behind"] {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: visible;
      }
      [data-composition-id="hero-behind"] .hb-word {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-family: "Anton", sans-serif;
        font-weight: 400;
        line-height: 0.86;
        letter-spacing: 0.01em;
        text-transform: uppercase;
        white-space: nowrap;
        background: linear-gradient(180deg, #ff4a3d 0%, #e3121b 48%, #a80a12 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 10px 24px rgba(110, 0, 6, 0.35));
        opacity: 0;
        will-change: transform, opacity, filter;
      }
      [data-composition-id="hero-behind"] .gold {
        background: linear-gradient(180deg, #ffe08a 0%, #ffb703 45%, #c97a00 100%);
        -webkit-background-clip: text;
        background-clip: text;
        filter: drop-shadow(0 6px 0 #7a1208) drop-shadow(0 12px 24px rgba(90, 10, 0, 0.45));
      }
      [data-composition-id="hero-behind"] .hb-dussehra {
        top: 452px;
        font-size: 252px;
      }
      [data-composition-id="hero-behind"] .hb-end-bike {
        top: 196px;
        font-size: 316px;
      }
      [data-composition-id="hero-behind"] .hb-bike {
        top: 168px;
        font-size: 340px;
      }
      [data-composition-id="hero-behind"] .hb-masters,
      [data-composition-id="hero-behind"] .hb-end-masters {
        top: 472px;
        font-size: 282px;
      }
      [data-composition-id="hero-behind"] .hb-end-masters {
        font-size: 266px;
        top: 486px;
      }
      [data-composition-id="hero-behind"] .hb-newlook {
        top: 500px;
        font-size: 262px;
      }
      [data-composition-id="hero-behind"] .hb-festive {
        top: 196px;
        font-size: 300px;
      }
      [data-composition-id="hero-behind"] .hb-season {
        top: 468px;
        font-size: 300px;
      }
      [data-composition-id="hero-behind"] .hb-fresh {
        top: 176px;
        font-size: 330px;
      }
      [data-composition-id="hero-behind"] .hb-start {
        top: 468px;
        font-size: 330px;
      }
      [data-composition-id="hero-behind"] .hb-word.split {
        background: none;
        -webkit-text-fill-color: initial;
      }
      [data-composition-id="hero-behind"] .ch {
        display: inline-block;
        background: linear-gradient(180deg, #ff4a3d 0%, #e3121b 48%, #a80a12 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (() => {
        const D = 45.73;
        const root = document.querySelector('[data-composition-id="hero-behind"]');
        const $ = (s) => root.querySelector(s);

        // Split letter-build words into per-char spans (synchronous, deterministic)
        ["#hb-bike", "#hb-masters", "#hb-end-bike", "#hb-end-masters"].forEach((sel) => {
          const el = $(sel);
          el.classList.add("split");
          el.innerHTML = el.textContent
            .split("")
            .map((c) => `<span class="ch">${c}</span>`)
            .join("");
        });

        const tl = gsap.timeline({ paused: true });

        // Generic slam-in for a whole word: scale down from big + blur clears (expo.out)
        const slam = (sel, t, from = 1.5) => {
          tl.fromTo(
            $(sel),
            { opacity: 0, scale: from, filter: "blur(18px)" },
            { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out" },
            t,
          );
        };
        // Exit rides the whip transition in fx (same 0.25s window, blur matches fx streak)
        const whipOut = (sels, t, dir = -1) => {
          tl.to(
            sels.map($),
            { opacity: 0, y: dir * 140, filter: "blur(26px)", duration: 0.25, ease: "power2.in" },
            t,
          );
        };
        // Letter-by-letter build (escapemedia "S-C-H-O-O-L")
        const letters = (sel, t, each = 0.06) => {
          tl.set($(sel), { opacity: 1 }, t);
          tl.from(
            $(sel).querySelectorAll(".ch"),
            { opacity: 0, y: 90, scale: 0.4, rotation: -8, duration: 0.32, ease: "back.out(2.2)", stagger: each },
            t,
          );
        };

        // ── H1 HOOK 0.05–2.95 · "DUSSEHRA par sirf ghar aur naye kapde kyun?" ──
        slam("#hb-dussehra", 0.05, 1.8);
        tl.to($("#hb-dussehra"), { scale: 1.06, duration: 2.6, ease: "none" }, 0.45);
        whipOut(["#hb-dussehra"], 2.78);

        // ── H2 BRAND 6.44–8.1 · "BIKE MASTERS lekar aaya hai" letter build ──
        letters("#hb-bike", 6.4, 0.05);
        letters("#hb-masters", 6.78, 0.045);
        tl.to([$("#hb-bike"), $("#hb-masters")], { scale: 1.04, duration: 1.0, ease: "none" }, 7.1);
        whipOut(["#hb-bike", "#hb-masters"], 7.92);

        // ── H3 "fresh NEW LOOK" 26.05–27.05 ─────────────────────────
        slam("#hb-newlook", 26.1, 1.5);
        tl.to($("#hb-newlook"), { scale: 1.05, duration: 0.7, ease: "none" }, 26.5);
        whipOut(["#hb-newlook"], 26.92, 1);

        // ── H4 "FESTIVE SEASON hai sahi mauka" 27.25–29.3 ───────────
        slam("#hb-festive", 27.25, 1.6);
        tl.fromTo(
          $("#hb-season"),
          { opacity: 0, x: 260, skewX: -12 },
          { opacity: 1, x: 0, skewX: 0, duration: 0.42, ease: "power4.out" },
          27.88,
        );
        tl.to([$("#hb-festive"), $("#hb-season")], { scale: 1.04, duration: 1.1, ease: "none" }, 28.1);
        whipOut(["#hb-festive", "#hb-season"], 29.12);

        // ── H5 "Is DUSSEHRA … ek FRESH START" 36.85–40.1 (callback to the hook) ──
        slam("#hb-dussehra2", 36.85, 1.4);
        tl.to($("#hb-dussehra2"), { scale: 1.05, duration: 2.1, ease: "none" }, 37.25);
        tl.to($("#hb-dussehra2"), { opacity: 0, scale: 1.25, filter: "blur(20px)", duration: 0.22, ease: "power2.in" }, 39.0);
        slam("#hb-fresh", 39.2, 1.5);
        tl.fromTo(
          $("#hb-start"),
          { opacity: 0, scale: 0.6, filter: "blur(14px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.32, ease: "back.out(1.6)" },
          39.7,
        );
        whipOut(["#hb-fresh", "#hb-start"], 40.0, 1);

        // ── H6 END CARD 40.24–45.73 · "BIKE MASTERS" letter build, held ────
        letters("#hb-end-bike", 40.24, 0.05);
        letters("#hb-end-masters", 40.62, 0.04);
        tl.to([$("#hb-end-bike"), $("#hb-end-masters")], { scale: 1.035, duration: 4.6, ease: "sine.inOut" }, 41.0);

        tl.to({}, { duration: D }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines["hero-behind"] = tl;
      })();
    </script>
  </div>
</template>
