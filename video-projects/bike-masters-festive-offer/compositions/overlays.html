        const $ = (s) => root.querySelector(s);
        const $$ = (s) => root.querySelectorAll(s);
        const tl = gsap.timeline({ paused: true });

        // Deterministic pseudo-random (harmonic hash)
        const h = (i, a, b) => Math.abs(Math.sin(i * 12.9898 + a) * Math.cos(i * 4.1414 + b));

        // Exit that rides the fx whip (power2.in, 0.25s, blur matches fx streak)
        const whipOut = (sel, t, y = -120) =>
          tl.to($(sel), { opacity: 0, y, filter: "blur(24px)", duration: 0.25, ease: "power2.in" }, t);

        const strokeDraw = (path, t, dur, ease = "power2.inOut") => {
          const len = path.getTotalLength();
          tl.set(path, { strokeDasharray: len, strokeDashoffset: len }, 0);
          tl.to(path, { strokeDashoffset: 0, duration: dur, ease }, t);
