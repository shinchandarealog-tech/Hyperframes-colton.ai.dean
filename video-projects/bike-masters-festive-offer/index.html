<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b0b0f;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b0b0f;
      }
      /* Camera rig: video + behind-words + cutout move together so the depth sandwich never drifts */
      #cam {
        position: absolute;
        inset: 0;
        transform-origin: 50% 42%;
      }
      .layer {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      #talk-video,
      #talk-cutout {
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        display: block;
      }
      #talk-video {
        filter: contrast(1.07) saturate(1.12) brightness(0.98);
      }
      #talk-cutout {
        filter: contrast(1.07) saturate(1.12) brightness(0.98);
      }
      #face-wrap {
        z-index: 1;
      }
      #behind-host {
        z-index: 2;
      }
      #cut-wrap {
        z-index: 3;
        opacity: 0;
      }
      #overlays-host {
        z-index: 4;
      }
      #captions-host {
        z-index: 5;
      }
      #fx-host {
        z-index: 6;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="45.73"
      data-width="1080"
      data-height="1920"
    >
      <div id="cam">
        <div id="face-wrap" class="layer">
          <video
            id="talk-video"
            src="assets/talk.mp4"
            data-start="0"
            data-duration="45.73"
            data-track-index="0"
            muted
            playsinline
          ></video>
        </div>

        <div
          id="behind-host"
          class="layer"
          data-composition-id="hero-behind"
          data-composition-src="compositions/hero-behind.html"
          data-start="0"
          data-duration="45.73"
          data-track-index="2"
          data-width="1080"
          data-height="1920"
        ></div>

        <div id="cut-wrap" class="layer">
          <video
            id="talk-cutout"
            src="assets/talk-cutout.webm"
            data-start="0"
            data-duration="45.73"
            data-track-index="1"
            muted
            playsinline
          ></video>
        </div>
      </div>

      <div
        id="overlays-host"
        class="layer"
        data-composition-id="overlays"
        data-composition-src="compositions/overlays.html"
        data-start="0"
        data-duration="45.73"
        data-track-index="3"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="captions-host"
        class="layer"
        data-track-kind="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="45.73"
        data-track-index="4"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="fx-host"
        class="layer"
        data-composition-id="fx"
        data-composition-src="compositions/fx.html"
        data-start="0"
        data-duration="45.73"
        data-track-index="5"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Audio: her voice is the source of truth; everything else sits well under it -->
      <audio id="voice" src="assets/talk.mp4" data-start="0" data-duration="45.73" data-track-index="10" data-volume="1"></audio>
      <audio id="music" src="assets/music-bed-cinematic-tech.mp3" data-start="0" data-duration="45.73" data-track-index="11" data-volume="0.1"></audio>

      <audio id="sfx-00-slam" src="assets/slam.mp3" data-start="0.05" data-duration="1.2" data-track-index="20" data-volume="0.22"></audio>
      <audio id="sfx-01-sparkle" src="assets/sparkle.mp3" data-start="0.4" data-duration="2" data-track-index="21" data-volume="0.12"></audio>
      <audio id="sfx-02-pop" src="assets/pop.mp3" data-start="1.08" data-duration="0.7" data-track-index="22" data-volume="0.16"></audio>
      <audio id="sfx-03-pop" src="assets/pop.mp3" data-start="1.63" data-duration="0.7" data-track-index="23" data-volume="0.16"></audio>
      <audio id="sfx-04-slam" src="assets/slam.mp3" data-start="2.12" data-duration="1.2" data-track-index="24" data-volume="0.2"></audio>
      <audio id="sfx-05-whoosh" src="assets/whoosh.mp3" data-start="2.85" data-duration="0.57" data-track-index="25" data-volume="0.2"></audio>
      <audio id="sfx-06-whoosh" src="assets/whoosh.mp3" data-start="6.28" data-duration="0.57" data-track-index="26" data-volume="0.18"></audio>
      <audio id="sfx-07-pop" src="assets/pop.mp3" data-start="6.44" data-duration="0.7" data-track-index="27" data-volume="0.14"></audio>
      <audio id="sfx-08-swipe" src="assets/swipe.mp3" data-start="8.05" data-duration="1.06" data-track-index="28" data-volume="0.12"></audio>
      <audio id="sfx-09-slam" src="assets/slam.mp3" data-start="8.62" data-duration="1.2" data-track-index="29" data-volume="0.18"></audio>
      <audio id="sfx-10-swipe" src="assets/swipe.mp3" data-start="9.28" data-duration="1.06" data-track-index="30" data-volume="0.14"></audio>
      <audio id="sfx-11-paper-flip" src="assets/paper-flip.mp3" data-start="12.12" data-duration="2.6" data-track-index="31" data-volume="0.14"></audio>
      <audio id="sfx-12-click" src="assets/click.wav" data-start="12.49" data-duration="0.46" data-track-index="32" data-volume="0.12"></audio>
      <audio id="sfx-13-click" src="assets/click.wav" data-start="13.61" data-duration="0.46" data-track-index="33" data-volume="0.12"></audio>
      <audio id="sfx-14-click" src="assets/click.wav" data-start="14.53" data-duration="0.46" data-track-index="34" data-volume="0.12"></audio>
      <audio id="sfx-15-click" src="assets/click.wav" data-start="15.66" data-duration="0.46" data-track-index="35" data-volume="0.12"></audio>
      <audio id="sfx-16-bass-drop" src="assets/bass-drop.mp3" data-start="17.3" data-duration="1.1" data-track-index="36" data-volume="0.24"></audio>
      <audio id="sfx-17-whoosh" src="assets/whoosh.mp3" data-start="18.5" data-duration="0.57" data-track-index="37" data-volume="0.18"></audio>
      <audio id="sfx-18-swipe" src="assets/swipe.mp3" data-start="22.65" data-duration="1.06" data-track-index="38" data-volume="0.14"></audio>
      <audio id="sfx-19-slam" src="assets/slam.mp3" data-start="23.32" data-duration="1.2" data-track-index="39" data-volume="0.14"></audio>
      <audio id="sfx-20-sparkle" src="assets/sparkle.mp3" data-start="26.0" data-duration="2" data-track-index="40" data-volume="0.16"></audio>
      <audio id="sfx-21-slam" src="assets/slam.mp3" data-start="27.25" data-duration="1.2" data-track-index="41" data-volume="0.18"></audio>
      <audio id="sfx-22-pop" src="assets/pop.mp3" data-start="29.55" data-duration="0.7" data-track-index="42" data-volume="0.16"></audio>
      <audio id="sfx-23-whoosh" src="assets/whoosh.mp3" data-start="32.55" data-duration="0.57" data-track-index="43" data-volume="0.16"></audio>
      <audio id="sfx-24-click" src="assets/click.wav" data-start="33.83" data-duration="0.46" data-track-index="44" data-volume="0.22"></audio>
      <audio id="sfx-25-pop" src="assets/pop.mp3" data-start="34.75" data-duration="0.7" data-track-index="45" data-volume="0.14"></audio>
      <audio id="sfx-26-whoosh" src="assets/whoosh.mp3" data-start="36.75" data-duration="0.57" data-track-index="46" data-volume="0.18"></audio>
      <audio id="sfx-27-slam" src="assets/slam.mp3" data-start="39.2" data-duration="1.2" data-track-index="47" data-volume="0.18"></audio>
      <audio id="sfx-28-slam" src="assets/slam.mp3" data-start="40.24" data-duration="1.2" data-track-index="48" data-volume="0.22"></audio>
      <audio id="sfx-29-sparkle" src="assets/sparkle.mp3" data-start="41.5" data-duration="2" data-track-index="49" data-volume="0.14"></audio>
    </div>

    <script>
      (() => {
        const D = 45.73;
        const tl = gsap.timeline({ paused: true });

        // Face is a character: slow Ken Burns across the whole piece
        tl.fromTo("#cam", { scale: 1.0 }, { scale: 1.04, duration: D, ease: "none" }, 0);

        // Punch-ins on the hero beats (scale is additive on top of the Ken Burns via a nested wrapper)
        const PUNCH = [
          { t: 3.1, s: 1.08, hold: 1.7 },
          { t: 8.62, s: 1.1, hold: 0.7 },
          { t: 17.3, s: 1.08, hold: 0.95 },
          { t: 27.25, s: 1.1, hold: 1.7 },
          { t: 39.2, s: 1.07, hold: 0.75 },
        ];
        PUNCH.forEach(({ t, s, hold }) => {
          tl.to("#face-wrap, #behind-host, #cut-wrap", { scale: s, duration: 0.3, ease: "expo.out", transformOrigin: "50% 42%" }, t);
          tl.to("#face-wrap, #behind-host, #cut-wrap", { scale: 1, duration: 0.45, ease: "power2.inOut", transformOrigin: "50% 42%" }, t + hold);
        });

        // Cutout is only shown while a word sits behind her (keeps edge halos off-screen the rest of the time)
        const BEHIND_WINDOWS = [
          [0.0, 3.05],
          [6.3, 8.2],
          [25.95, 27.05],
          [27.1, 29.4],
          [36.75, 40.15],
          [40.18, 45.73],
        ];
        BEHIND_WINDOWS.forEach(([a, b]) => {
          tl.set("#cut-wrap", { opacity: 1 }, a);
          tl.set("#cut-wrap", { opacity: 0 }, b);
        });

        tl.to({}, { duration: D }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
