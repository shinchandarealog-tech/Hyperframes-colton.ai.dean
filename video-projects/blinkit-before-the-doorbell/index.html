      /* Palette + type from DESIGN.md */
      :root {
        --yellow: #f8cb46;
        --green: #0c831f;
        --ink: #1c1a12;
        --cream: #fff7e2;
        --cold: #cfe3f5;
        --font-display: "Bricolage Grotesque", "Plus Jakarta Sans", sans-serif;
        --font-ui: "Plus Jakarta Sans", sans-serif;
        --font-hand: "Caveat", cursive;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--cream); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--font-ui); color: var(--ink); }
      .scene { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; }
      .cam { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      .abs { position: absolute; }
      svg { display: block; overflow: visible; }

      /* texture: deterministic grain + soft vignette over everything */
      #grain {
        position: absolute; inset: 0; z-index: 90; pointer-events: none; opacity: 0.55;
        background:
          radial-gradient(circle at 1px 1px, rgba(28,26,18,0.05) 1px, rgba(28,26,18,0) 1.5px) 0 0 / 3px 3px,
          radial-gradient(circle at 2px 3px, rgba(28,26,18,0.035) 1px, rgba(28,26,18,0) 1.5px) 0 0 / 5px 5px,
          radial-gradient(circle at 4px 1px, rgba(255,255,255,0.05) 1px, rgba(255,255,255,0) 1.5px) 0 0 / 7px 7px;
      }
      #vignette { position: absolute; inset: 0; z-index: 89; pointer-events: none;
        background: radial-gradient(ellipse 80% 70% at 50% 48%, rgba(28,26,18,0) 55%, rgba(28,26,18,0.16) 100%); }

      /* ---------- S1 fridge ---------- */
      #s1 { z-index: 1; background: #a9c6e0; perspective: 2200px; }
      #s1 .cam { transform-origin: 540px 1000px;
        background: radial-gradient(ellipse 90% 60% at 50% 12%, #f5f9fd 0%, #cfe3f5 55%, #a9c6e0 100%); }
      #s1-light { left: 390px; top: 0; width: 300px; height: 34px; border-radius: 0 0 20px 20px; background: #ffffff;
        box-shadow: 0 0 120px 60px rgba(255,255,255,0.75); }
      .shelf { left: 30px; width: 1020px; height: 26px; border-radius: 6px; background: rgba(255,255,255,0.55);
        border-top: 4px solid rgba(255,255,255,0.95); box-shadow: 0 18px 30px rgba(60,90,120,0.18); }
      #s1-note { left: 80px; top: 230px; width: 330px; height: 300px; background: var(--yellow); transform: rotate(-6deg);
        box-shadow: 0 16px 30px rgba(28,26,18,0.18); padding: 56px 26px 0; text-align: center; }
      #s1-note::before { content: ""; position: absolute; left: 105px; top: -22px; width: 120px; height: 46px;
        background: rgba(255,255,255,0.6); transform: rotate(4deg); }
      #s1-note p { font-family: var(--font-hand); font-weight: 700; font-size: 88px; line-height: 0.95; color: var(--ink); }
      #s1-time { left: 440px; top: 250px; width: 540px; text-align: right; font-family: var(--font-display); font-weight: 800;
        color: var(--ink); line-height: 1; letter-spacing: -0.04em; }
      #s1-time .big { font-size: 230px; }
      #s1-time .pm { font-size: 90px; letter-spacing: -0.02em; margin-left: 10px; }
      #s1-time .lbl { display: block; font-family: var(--font-ui); font-weight: 700; font-size: 38px; letter-spacing: 0.01em; margin-top: 14px; color: #3a4a5c; }
      #s1-door { left: 0; top: 0; width: 1080px; height: 1920px; background: #f3f6f9; transform-origin: 0 50%;
        box-shadow: inset -30px 0 60px rgba(60,90,120,0.18); z-index: 20; }
      #s1-door::after { content: ""; position: absolute; right: 70px; top: 760px; width: 34px; height: 400px; border-radius: 17px;
        background: #c9d6e2; box-shadow: inset 0 0 0 5px #b4c4d4; }
      #s1-flash { inset: 0; background: radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.95), rgba(255,255,255,0) 70%); z-index: 19; opacity: 0; }

      /* ---------- S2 phone ---------- */
      #s2 { z-index: 2; background: var(--cream); }
      #s2 .cam { background: radial-gradient(ellipse 70% 50% at 50% 50%, #fde9ad 0%, var(--cream) 70%); transform-origin: 540px 1000px; }
      #s2-phone { left: 160px; top: 180px; width: 760px; height: 1560px; border-radius: 96px; background: var(--ink);
        box-shadow: 0 50px 90px rgba(28,26,18,0.28); }
      #s2-screen { left: 182px; top: 202px; width: 716px; height: 1516px; border-radius: 76px; overflow: hidden;
        background: radial-gradient(ellipse 120% 80% at 30% 20%, #fff7e2 0%, #f3e4b5 100%); }
      #s2-island { left: 470px; top: 228px; width: 140px; height: 42px; border-radius: 21px; background: var(--ink); }
      .sb { top: 232px; font-weight: 700; font-size: 32px; }
      .app { width: 130px; height: 130px; border-radius: 34px; }
      .app i { position: absolute; left: 39px; top: 39px; width: 52px; height: 52px; border: 7px solid rgba(255,255,255,0.9); }
      #s2-dock { left: 212px; top: 1488px; width: 656px; height: 190px; border-radius: 56px; background: rgba(255,255,255,0.55); }
      .bk-icon { background: var(--yellow); display: flex; align-items: center; justify-content: center;
        font-family: var(--font-display); font-weight: 800; font-size: 34px; letter-spacing: -0.04em; color: var(--ink); }
      .bk-icon b { color: var(--green); font-weight: 800; }
      #s2-ripple { left: 401px; top: 1523px; width: 120px; height: 120px; border-radius: 50%; border: 8px solid var(--green); opacity: 0; }
      #s2-burst { left: 396px; top: 1518px; width: 130px; height: 130px; border-radius: 34px; background: var(--yellow); z-index: 30; opacity: 0; }
      .thumb { width: 170px; height: 440px; border-radius: 85px 85px 50px 50px; background: #f6dcb8; border: 8px solid var(--ink);
        box-shadow: 0 30px 50px rgba(28,26,18,0.25); }
      .thumb::after { content: ""; position: absolute; left: 34px; top: 26px; width: 86px; height: 100px; border-radius: 42px 42px 30px 30px;
        background: rgba(255,255,255,0.55); }

      /* ---------- S3 app search ---------- */
      #s3 { z-index: 3; background: var(--cream); }
      #s3 .cam { transform-origin: 540px 700px; }
      #s3-head { left: 0; top: 0; width: 1080px; height: 560px; background: var(--yellow); padding: 150px 70px 0; }
      #s3-head .k { font-weight: 700; font-size: 42px; }
      #s3-head .h { font-family: var(--font-display); font-weight: 800; font-size: 124px; line-height: 1; letter-spacing: -0.04em; margin-top: 6px; }
      #s3-head .a { font-weight: 600; font-size: 36px; margin-top: 18px; color: #4a3f16; }
      #s3-search { left: 60px; top: 490px; width: 960px; height: 140px; border-radius: 40px; background: #ffffff;
        box-shadow: 0 20px 40px rgba(28,26,18,0.14); border: 3px solid rgba(28,26,18,0.08); display: flex; align-items: center; padding-left: 110px; }
      #s3-search .mag { position: absolute; left: 40px; top: 44px; width: 40px; height: 40px; border-radius: 50%; border: 7px solid var(--ink); }
      #s3-search .mag::after { content: ""; position: absolute; left: 30px; top: 32px; width: 20px; height: 7px; background: var(--ink); transform: rotate(45deg); border-radius: 4px; }
      #s3-typed { font-weight: 700; font-size: 52px; white-space: nowrap; }
      .ch { display: inline-block; overflow: hidden; width: 0; vertical-align: bottom; }
      .caret { display: inline-block; width: 5px; height: 60px; background: var(--green); vertical-align: middle; margin-left: 4px; border-radius: 2px; }
      .card { width: 460px; height: 560px; border-radius: 44px; background: #ffffff; box-shadow: 0 22px 44px rgba(28,26,18,0.12);
        padding: 30px 34px; display: flex; flex-direction: column; }
      .card .art { width: 280px; height: 260px; margin: 0 auto 8px; }
      .card .nm { font-weight: 800; font-size: 40px; line-height: 1.1; }
      .card .wt { font-weight: 500; font-size: 30px; color: #6b6450; margin-top: 4px; }
      .card .row { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
      .card .pr { font-family: var(--font-display); font-weight: 800; font-size: 54px; letter-spacing: -0.02em; }
      .add { position: relative; width: 170px; height: 84px; border-radius: 22px; border: 5px solid var(--green); color: var(--green);
        font-weight: 800; font-size: 36px; display: flex; align-items: center; justify-content: center; }
      .add .fill { position: absolute; inset: -5px; border-radius: 22px; background: var(--green); color: var(--cream); display: flex;
        align-items: center; justify-content: center; opacity: 0; }

      /* ---------- S4 cart ---------- */
      #s4 { z-index: 4; background: var(--cream); }
      #s4 .cam { background: radial-gradient(ellipse 70% 45% at 50% 62%, #fde3a0 0%, var(--cream) 72%); transform-origin: 540px 1100px; }
      #s4-total { left: 0; top: 230px; width: 1080px; text-align: center; }
      #s4-total .lbl { font-weight: 700; font-size: 44px; color: #4a3f16; }
      #s4-num { position: relative; height: 230px; margin-top: 4px; font-family: var(--font-display); font-weight: 800; font-size: 230px;
        line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
      #s4-num span { position: absolute; left: 0; right: 0; top: 0; opacity: 0; }
      #s4-bagback { left: 330px; top: 990px; width: 420px; height: 90px; border-radius: 50%; background: #3a3320; }
      .item { width: 240px; height: 240px; }
      #s4-bag { left: 290px; top: 900px; width: 500px; height: 550px; transform-origin: 50% 100%; }
      #s4-btn { left: 130px; top: 1560px; width: 820px; height: 150px; border-radius: 75px; background: var(--green); color: var(--cream);
        font-weight: 800; font-size: 58px; display: flex; align-items: center; justify-content: center; box-shadow: 0 22px 40px rgba(12,131,31,0.3); }
      #s4-btn .done { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; }
      #s4-ripple { left: 725px; top: 1560px; width: 150px; height: 150px; border-radius: 50%; border: 8px solid var(--yellow); opacity: 0; }

      /* ---------- S5 map ---------- */
      #s5 { z-index: 5; background: #f6eed6; }
      #s5-zoom { position: absolute; inset: 0; transform-origin: 820px 600px; }
      #s5-map { position: absolute; inset: 0; transform-origin: 540px 1150px; perspective-origin: 50% 40%; }
      #s5-eta { left: 60px; top: 150px; width: 960px; height: 270px; border-radius: 44px; background: #ffffff;
        box-shadow: 0 24px 50px rgba(28,26,18,0.16); padding: 34px 48px; z-index: 5; }
      #s5-eta .k { font-weight: 700; font-size: 40px; color: #4a3f16; }
      #s5-eta .n { position: relative; height: 120px; font-family: var(--font-display); font-weight: 800; font-size: 120px; line-height: 1;
        letter-spacing: -0.03em; color: var(--green); }
      #s5-eta .n span { position: absolute; left: 0; top: 0; opacity: 0; white-space: nowrap; }
      #s5-bar { position: absolute; left: 48px; bottom: 34px; width: 864px; height: 18px; border-radius: 9px; background: #eee6cc; overflow: hidden; }
      #s5-bar i { position: absolute; left: 0; top: 0; height: 18px; width: 864px; border-radius: 9px; background: var(--green); transform-origin: 0 50%; }
      #s5-scooter { left: 0; top: 0; width: 120px; height: 120px; margin: -60px 0 0 -60px; z-index: 4; }

      /* ---------- S6 door ---------- */
      #s6 { z-index: 6; background: var(--cream); perspective: 2400px; }
      #s6 .cam { transform-origin: 540px 1100px;
        background: radial-gradient(ellipse 80% 55% at 50% 55%, #fff3d0 0%, #f4e6bd 100%); }
      #s6-floor { left: 0; top: 1660px; width: 1080px; height: 260px; background: #e6d6a8; }
      #s6-time { left: 0; top: 150px; width: 1080px; text-align: center; font-family: var(--font-display); font-weight: 800; line-height: 1;
        letter-spacing: -0.04em; }
      #s6-time .big { position: relative; display: inline-block; font-size: 220px; }
      #s6-time .pm { font-size: 90px; margin-left: 12px; }
      #s6-time .d { position: absolute; left: 0; top: 0; opacity: 0; }
      #s6-time .lbl { display: block; font-family: var(--font-ui); font-weight: 700; font-size: 40px; margin-top: 14px; color: #4a3f16; letter-spacing: 0.01em; }
      #s6-frame { left: 220px; top: 520px; width: 640px; height: 1150px; background: #2b2a22; border: 18px solid var(--ink); border-bottom: 0; }
      #s6-door { left: 238px; top: 538px; width: 604px; height: 1132px; background: var(--green); transform-origin: 0 50%; z-index: 3;
        box-shadow: inset 0 0 0 26px #0a6f1a; }
      #s6-door::before { content: ""; position: absolute; left: 70px; top: 90px; width: 464px; height: 400px; border-radius: 8px; box-shadow: inset 0 0 0 10px #0a6f1a; }
      #s6-door::after { content: ""; position: absolute; left: 70px; top: 600px; width: 464px; height: 440px; border-radius: 8px; box-shadow: inset 0 0 0 10px #0a6f1a; }
      #s6-knob { left: 750px; top: 1080px; width: 50px; height: 50px; border-radius: 50%; background: var(--yellow); border: 6px solid var(--ink); z-index: 4; }
      #s6-bell { left: 920px; top: 1040px; width: 90px; height: 130px; border-radius: 26px; background: #ffffff; border: 7px solid var(--ink); }
      #s6-bell::after { content: ""; position: absolute; left: 18px; top: 34px; width: 40px; height: 40px; border-radius: 50%; background: var(--yellow); border: 6px solid var(--ink); }
      .ring { left: 925px; top: 1065px; width: 80px; height: 80px; border-radius: 50%; border: 7px solid var(--green); opacity: 0; }
      #s6-doorway { left: 238px; top: 538px; width: 604px; height: 1132px; overflow: hidden; z-index: 2; }
      #s6-arm { left: 330px; top: 442px; width: 320px; height: 70px; border-radius: 35px; background: var(--yellow); border: 7px solid var(--ink); z-index: 2; transform-origin: 100% 50%; }
      #s6-bag { left: 150px; top: 392px; width: 300px; height: 330px; z-index: 2; }

      /* ---------- S7 word stack ---------- */
      #s7 { z-index: 7; background: var(--green); }
      #s7 .cam { background: radial-gradient(ellipse 70% 50% at 50% 50%, #149a2a 0%, var(--green) 70%); }
      #s7-list { left: 0; top: 0; width: 1080px; }
      #s7-list div { position: absolute; left: 0; width: 1080px; height: 220px; line-height: 220px; text-align: center;
        font-family: var(--font-display); font-weight: 800; font-size: 150px; letter-spacing: -0.04em; color: var(--cream); }
      #s7-box { left: 80px; top: 860px; width: 920px; height: 200px; border: 5px solid var(--cream); border-radius: 10px; }
      #s7-box i { position: absolute; width: 28px; height: 28px; background: var(--green); border: 5px solid var(--cream); }

      /* ---------- S8 slogan ---------- */
      #s8 { z-index: 8; background: var(--yellow); }
      #s8 .cam { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 60px 120px; text-align: center; transform-origin: 540px 960px; }
      #s8-pre { font-weight: 700; font-size: 92px; letter-spacing: -0.02em; }
      #s8-ten { font-family: var(--font-display); font-weight: 800; font-size: 600px; line-height: 0.82; letter-spacing: -0.06em; margin-top: 30px; }
      #s8-min { font-family: var(--font-display); font-weight: 800; font-size: 200px; line-height: 1; letter-spacing: -0.04em; color: var(--green); margin-top: 10px; }
      .star { width: 90px; height: 90px; }
