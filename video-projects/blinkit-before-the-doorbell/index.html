      (function () {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const $ = (s) => document.querySelector(s);
        const F = 1 / 30;

        // 3D beats: one WebGL stage per beat, driven by a proxy tween over its clip window
        const BEATS = [
          // [canvas, scene, clip start, clip end, offset] — offset maps comp time back to the scene's own clock
          ["gl2", "phone", 1.4, 3.25, 0], ["gl3", "app", 2.8, 5.15, 0], ["gl4", "cart", 4.9, 7.15, 0],
          ["gl5", "map", 6.85, 10.15, 0], ["gl9", "logo", 15.45, 18.0, 1.0],
        ];
        BEATS.forEach(([id, name, a, b, off]) => {
          const draw = SCENES[name](document.getElementById(id));
          const P = { t: a };
          draw(a - off);
          tl.fromTo(P, { t: a }, { t: b, duration: b - a, ease: "none", immediateRender: false, onUpdate: () => draw(P.t - off) }, a);
        });

        function steps(container, values, times) {
          const els = values.map((v) => { const s = document.createElement("span"); s.textContent = v; container.appendChild(s); return s; });
          els.forEach((el, i) => { tl.set(el, { opacity: 1 }, times[i]); if (i > 0) tl.set(els[i - 1], { opacity: 0 }, times[i]); });
          return els;
        }

        // B1 overlay + whip out
        tl.from("#s1-time .big", { y: 70, opacity: 0, duration: 0.4, ease: "expo.out" }, 0.45);
        tl.from("#s1-time .pm", { x: 40, opacity: 0, duration: 0.35, ease: "power3.out" }, 0.58);
        tl.set("#s1-colon", { opacity: 0 }, 1.0); tl.set("#s1-colon", { opacity: 1 }, 1.25);
        tl.from("#s1-time small", { y: 20, opacity: 0, duration: 0.35, ease: "power2.out" }, 0.7);
        tl.fromTo("#v1w", { scale: 1.0 }, { scale: 1.06, duration: 1.4, ease: "sine.out" }, 0);
        tl.to(["#s1 .cam", "#v1w"], { scale: 1.25, filter: "blur(16px)", duration: 0.32, ease: "power2.in" }, 1.38);
        // B2 whip in
        tl.fromTo("#s2 .cam", { opacity: 0, scale: 0.88, filter: "blur(18px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 1.45);
        // B3 iris out of the icon
        tl.fromTo("#s3", { clipPath: "circle(0px at 540px 960px)" }, { clipPath: "circle(1200px at 540px 960px)", duration: 0.32, ease: "power3.out" }, 2.92);
        // B4 push up + counter
        // zoom-through: app pushes past camera with blur, cart resolves from soft focus
        tl.to("#s3", { scale: 1.35, filter: "blur(16px)", duration: 0.3, ease: "power2.in" }, 4.88);
        tl.fromTo("#s4", { opacity: 0, scale: 0.88, filter: "blur(18px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.42, ease: "expo.out" }, 4.92);
        tl.from("#s4-total .lbl", { y: 30, opacity: 0, duration: 0.3, ease: "power2.out" }, 5.1);
        const vals = ["₹0"], times = [5.1];
