<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #000;
        --red: #8a0f0c;
        --orange: #ff6a1a;
        --cream: #ffe9cc;
        --yellow: #ffc83d;
        --ink: #ffffff;
        --ink-dim: rgba(255, 255, 255, 0.62);
        --font: "Inter", sans-serif;
        --glass-bg: linear-gradient(135deg, rgba(255,255,255,.13), rgba(255,255,255,.04) 45%, rgba(255,255,255,.02) 60%, rgba(255,255,255,.09));
        --glass-border: 1px solid rgba(255, 255, 255, 0.22);
        --glass-hi: inset 0 1px 0 rgba(255, 255, 255, 0.35), inset 0 -1px 0 rgba(255, 255, 255, 0.06);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ground); font-family: var(--font); color: var(--ink); }
      .layer { position: absolute; inset: 0; }
      .center { display: flex; align-items: center; justify-content: center; }

      /* ---------- GLOW (always on) ---------- */
      #glow { z-index: 1; transform-origin: 50% 50%; }
      .blob { position: absolute; left: 50%; top: 50%; border-radius: 50%; mix-blend-mode: screen; }
      #blob-red { width: 1900px; height: 1500px; background: radial-gradient(closest-side, rgba(138,15,12,.95), rgba(138,15,12,.45) 45%, rgba(138,15,12,0) 100%); }
      #blob-orange { width: 1150px; height: 900px; background: radial-gradient(closest-side, rgba(255,106,26,.85), rgba(255,106,26,.35) 50%, rgba(255,106,26,0) 100%); }
      #blob-cream { width: 560px; height: 460px; background: radial-gradient(closest-side, rgba(255,233,204,.9), rgba(255,233,204,.3) 50%, rgba(255,233,204,0) 100%); }

      /* ---------- GLASS ---------- */
      .glass {
        background: var(--glass-bg);
        border: var(--glass-border);
        box-shadow: var(--glass-hi), 0 30px 80px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(28px) saturate(1.25);
        -webkit-backdrop-filter: blur(28px) saturate(1.25);
      }
      .icon svg { display: block; width: 100%; height: 100%; }

      /* ---------- S1 HOOK ---------- */
      #s1 { z-index: 10; transform-origin: 960px 540px; }
      .hook-word { position: absolute; top: calc(50% - 70px); font-weight: 200; font-size: 128px; letter-spacing: -0.01em; line-height: 1.1; white-space: nowrap; filter: blur(0px); }
      #w-with { right: calc(50% + 125px); }
      #w-boat { left: calc(50% + 125px); }
      #tile { position: absolute; left: 50%; top: 50%; width: 168px; height: 168px; margin: -84px 0 0 -84px; border-radius: 44px; padding: 34px; }

      /* ---------- S2 GLASS UI ---------- */
      #s2 { z-index: 11; perspective: 1700px; perspective-origin: 50% 45%; }
      #s2-shine { position: absolute; left: 50%; top: 46%; width: 900px; height: 620px; margin: -310px 0 0 -450px; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(255,140,60,.55), rgba(255,90,20,.18) 55%, rgba(255,90,20,0)); mix-blend-mode: screen; }
      #panel { position: absolute; left: 50%; top: 50%; width: 1120px; height: 660px; margin: -330px 0 0 -560px; border-radius: 48px;
        padding: 64px 72px 56px; display: flex; flex-direction: column; gap: 34px; }
      .p-head { display: flex; align-items: center; gap: 30px; }
      #avatar { position: relative; width: 112px; height: 112px; flex: none; }
      #avatar-ring { position: absolute; inset: -10px; border-radius: 50%;
        background: conic-gradient(from 0deg, rgba(255,233,204,0), var(--cream), var(--orange), var(--red), rgba(255,233,204,0) 75%);
        -webkit-mask: radial-gradient(closest-side, transparent 86%, #000 88%, #000 100%); mask: radial-gradient(closest-side, transparent 86%, #000 88%, #000 100%); }
      #avatar-ring-glow { position: absolute; inset: -26px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,140,60,.55), rgba(255,140,60,0)); }
      #avatar-core { position: absolute; inset: 6px; border-radius: 50%; padding: 22px;
        background: radial-gradient(circle at 35% 30%, rgba(255,233,204,.35), rgba(255,106,26,.25) 45%, rgba(138,15,12,.35)); border: var(--glass-border); box-shadow: var(--glass-hi); }
      .p-greet { font-weight: 200; font-size: 50px; line-height: 1.15; letter-spacing: -0.01em; }
      .p-greet span { color: var(--ink-dim); }
      .chips { display: flex; gap: 20px; margin-top: 8px; }
      .chip { display: flex; align-items: center; gap: 14px; height: 72px; padding: 0 30px 0 24px; border-radius: 36px; font-weight: 300; font-size: 28px; white-space: nowrap; }
      .chip .icon { width: 30px; height: 30px; }
      .prompt { margin-top: auto; display: flex; align-items: center; gap: 18px; height: 96px; padding: 0 18px 0 36px; border-radius: 48px; }
      .prompt-text { font-weight: 200; font-size: 32px; color: var(--ink-dim); }
      #cursor { width: 2px; height: 40px; background: var(--ink); margin-left: -12px; }
      .prompt-send { margin-left: auto; width: 62px; height: 62px; border-radius: 50%; padding: 16px;
        background: radial-gradient(circle at 35% 30%, var(--cream), var(--orange) 60%, var(--red)); }

      /* ---------- S3 JUST ASK ---------- */
      #s3 { z-index: 12; }
      .big-line { font-weight: 200; font-size: 150px; letter-spacing: -0.01em; line-height: 1; white-space: nowrap; }
      .big-line .ch { display: inline-block; white-space: pre; filter: blur(0px); }
      #just-ask, #s4, #greet, #tagline, #tagline span, #logo-sub { filter: blur(0px); }

      /* ---------- S4 PHONE TUNNEL ---------- */
      #s4 { z-index: 13; perspective: 1100px; perspective-origin: 50% 50%; }
      #tunnel { position: absolute; inset: 0; transform-style: preserve-3d; }
      #magic { position: absolute; left: 0; right: 0; top: calc(50% - 80px); text-align: center; line-height: 160px; }
      .phone-slot { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
      .phone { position: absolute; width: 300px; height: 620px; left: -150px; top: -310px; border-radius: 52px; padding: 12px;
        background: linear-gradient(140deg, rgba(255,255,255,.32), rgba(255,255,255,.08) 40%, rgba(255,255,255,.04) 60%, rgba(255,255,255,.22));
        border: 1px solid rgba(255,255,255,.35); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 0 60px rgba(255,120,40,.18); }
      .screen { position: relative; width: 100%; height: 100%; border-radius: 42px; overflow: hidden; background: #0b0706; padding: 54px 26px 26px; display: flex; flex-direction: column; gap: 18px; }
      .screen::before { content: ""; position: absolute; left: 50%; top: 14px; width: 96px; height: 26px; margin-left: -48px; border-radius: 13px; background: #000; }
      .scr-title { font-weight: 300; font-size: 26px; }
      .scr-sub { font-weight: 300; font-size: 17px; color: var(--ink-dim); }
      .scr-ring { align-self: center; width: 190px; height: 190px; border-radius: 50%; margin-top: 10px;
        background: conic-gradient(var(--cream), var(--orange), var(--red), var(--orange) 92%, rgba(255,255,255,.1) 92%);
        -webkit-mask: radial-gradient(closest-side, transparent 80%, #000 82%); mask: radial-gradient(closest-side, transparent 80%, #000 82%); }
      .scr-ring-label { margin-top: -132px; align-self: center; font-weight: 200; font-size: 44px; height: 116px; }
      .seg { display: flex; border-radius: 22px; background: rgba(255,255,255,.08); padding: 5px; margin-top: auto; }
      .seg div { flex: 1; text-align: center; font-size: 15px; font-weight: 300; padding: 10px 0; border-radius: 18px; color: var(--ink-dim); }
      .seg .on { background: linear-gradient(135deg, var(--orange), var(--red)); color: #fff; }
      .row { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 20px; background: rgba(255,255,255,.06); font-size: 18px; font-weight: 300; }
      .row i { width: 12px; height: 12px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 12px var(--orange); flex: none; }
      .cushions { display: flex; justify-content: center; gap: 22px; margin: 18px 0 6px; }
      .cushions div { width: 92px; height: 132px; border-radius: 46px; background: radial-gradient(circle at 40% 35%, #4a2a20, #1c0e0a 70%); border: 1px solid rgba(255,233,204,.25); box-shadow: inset 0 0 22px rgba(255,140,60,.35); }
      .slider { height: 8px; border-radius: 4px; background: rgba(255,255,255,.12); position: relative; margin: 8px 0; }
      .slider b { position: absolute; left: 0; top: 0; bottom: 0; width: 38%; border-radius: 4px; background: linear-gradient(90deg, var(--red), var(--orange)); }
      .slider b::after { content: ""; position: absolute; right: -11px; top: -7px; width: 22px; height: 22px; border-radius: 50%; background: var(--cream); }
      .shield { align-self: center; width: 120px; height: 120px; margin: 10px 0; }
      .art { height: 250px; border-radius: 26px; background: radial-gradient(circle at 30% 30%, var(--cream), var(--orange) 35%, var(--red) 70%, #2a0503); }
      .eq { display: flex; align-items: flex-end; gap: 7px; height: 60px; }
      .eq span { flex: 1; border-radius: 3px; background: linear-gradient(0deg, var(--red), var(--orange), var(--cream)); }

      /* ---------- S5 PILL ---------- */
      #s5 { z-index: 14; }
      .s5-stack { display: flex; flex-direction: column; align-items: center; gap: 34px; }
      #count { font-weight: 100; font-size: 170px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
      #count small { font-size: 0.5em; font-weight: 200; color: var(--ink-dim); margin-left: 6px; }
      .pill-label { font-weight: 300; font-size: 30px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--ink-dim); }
      #pill { position: relative; width: 1240px; height: 124px; border-radius: 62px; padding: 14px; }
      #pill-track { position: relative; width: 100%; height: 100%; border-radius: 48px; overflow: hidden; }
      #pill-fill { position: absolute; inset: 0; border-radius: 48px; transform-origin: 0 50%;
        background: linear-gradient(90deg, var(--red), var(--orange) 55%, var(--cream)); box-shadow: 0 0 40px rgba(255,120,40,.6); }
      #pill-sheen { position: absolute; top: 0; bottom: 0; width: 260px; left: -300px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.45), rgba(255,255,255,0)); }
      #streaks { position: absolute; left: 0; right: 0; top: 520px; height: 200px; }
      .s5-stack { position: relative; z-index: 2; }
      .streak { position: absolute; left: 0; height: 10px; width: 900px; border-radius: 5px; filter: blur(6px); mix-blend-mode: screen; }

      /* ---------- S6 TAGLINE + LOGO ---------- */
      #s6 { z-index: 15; }
      #tagline { font-weight: 200; font-size: 120px; letter-spacing: -0.01em; white-space: nowrap; }
      #tagline span { display: inline-block; margin: 0 0.16em; }
      #logo { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 40px; }
      #logo-tile { width: 150px; height: 150px; border-radius: 40px; padding: 30px; }
      #logo-word { font-weight: 200; font-size: 168px; letter-spacing: -0.02em; line-height: 1; }
      #logo-word i { font-style: normal; color: var(--orange); }
      #logo-sub { position: absolute; left: 0; right: 0; text-align: center; top: calc(50% + 150px); font-weight: 300; font-size: 26px; letter-spacing: 0.42em; text-transform: uppercase; color: var(--ink-dim); white-space: nowrap; }

      /* ---------- FLASH + FINISH ---------- */
      #flash { z-index: 40; background: #000; opacity: 0; }
      #vignette { z-index: 50; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,.75) 100%); }
      #grain { z-index: 51; opacity: 0.3;
        background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px), radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px), radial-gradient(rgba(0,0,0,.25) 1px, transparent 1px);
        background-size: 3px 3px, 5px 5px, 7px 7px; background-position: 0 0, 1px 2px, 3px 1px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="13" data-width="1920" data-height="1080">

      <!-- Breathing glow: lives under every scene -->
      <div id="glow" class="layer clip" data-start="0" data-duration="13" data-track-index="0">
        <div class="blob" id="blob-red"></div>
        <div class="blob" id="blob-orange"></div>
        <div class="blob" id="blob-cream"></div>
      </div>

      <!-- S1 · Hook -->
      <div id="s1" class="layer clip" data-start="0" data-duration="2.2" data-track-index="1">
        <div class="hook-word" id="w-with">With</div>
        <div id="tile" class="glass icon" data-icon="headphones"></div>
        <div class="hook-word" id="w-boat">boat</div>
      </div>

      <!-- S2 · Frosted-glass UI panel -->
      <div id="s2" class="layer clip" data-start="1.95" data-duration="2.4" data-track-index="2">
        <div id="s2-shine"></div>
        <div id="panel" class="glass">
          <div class="p-head">
            <div id="avatar">
              <div id="avatar-ring-glow"></div>
              <div id="avatar-ring"></div>
              <div id="avatar-core" class="icon" data-icon="headphones"></div>
            </div>
            <div class="p-greet" id="greet">Hi, I'm boat.<br /><span>What do you want to hear?</span></div>
          </div>
          <div class="chips">
            <div class="chip glass"><div class="icon" data-icon="anc"></div>Noise cancellation</div>
            <div class="chip glass"><div class="icon" data-icon="comfort"></div>All-day comfort</div>
            <div class="chip glass"><div class="icon" data-icon="shield"></div>Built sturdy</div>
          </div>
          <div class="prompt glass">
            <div class="prompt-text">Ask boat anything</div>
            <div id="cursor"></div>
            <div class="prompt-send icon" data-icon="arrow"></div>
          </div>
        </div>
      </div>

      <!-- S3 · Just Ask -->
      <div id="s3" class="layer center clip" data-start="4.15" data-duration="1.95" data-track-index="3">
        <div class="big-line" id="just-ask" data-split="Just Ask"></div>
      </div>

      <!-- S4 · Phone tunnel -->
      <div id="s4" class="layer clip" data-start="5.5" data-duration="2.45" data-track-index="4">
        <div id="tunnel">
          <div class="big-line" id="magic" data-split="See The Magic"></div>
        </div>
      </div>

      <!-- S5 · Progress pill -->
      <div id="s5" class="layer center clip" data-start="7.65" data-duration="2.15" data-track-index="5">
        <div id="streaks"></div>
        <div class="s5-stack">
          <div id="count">0<small>%</small></div>
          <div id="pill" class="glass"><div id="pill-track"><div id="pill-fill"></div><div id="pill-sheen"></div></div></div>
          <div class="pill-label">Noise cancelled</div>
        </div>
      </div>

      <!-- S6 · Tagline → logo -->
      <div id="s6" class="layer center clip" data-start="9.55" data-duration="3.45" data-track-index="6">
        <div id="tagline"><span>Pro</span><span>Workflow</span><span>Unleashed</span></div>
        <div id="logo">
          <div id="logo-tile" class="glass icon" data-icon="headphones"></div>
          <div id="logo-word">boat<i>.</i></div>
        </div>
        <div id="logo-sub">Hear nothing else</div>
      </div>

      <div id="flash" class="layer clip" data-start="0" data-duration="13" data-track-index="7"></div>
      <div id="vignette" class="layer clip" data-start="0" data-duration="13" data-track-index="8"></div>
      <div id="grain" class="layer clip" data-start="0" data-duration="13" data-track-index="9"></div>
    </div>

    <script>
      // ---------- static content builders (synchronous, deterministic) ----------
      const S = 'fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"';
      const ICONS = {
        headphones: `<svg viewBox="0 0 64 64" ${S} stroke-width="2.4"><path d="M11 40v-7a21 21 0 0 1 42 0v7"/><rect x="7" y="37" width="11" height="19" rx="5"/><rect x="46" y="37" width="11" height="19" rx="5"/></svg>`,
        anc: `<svg viewBox="0 0 32 32" ${S} stroke-width="1.8"><path d="M6 16h2M11 10v12M16 6v20M21 10v12M26 16h-2"/></svg>`,
        comfort: `<svg viewBox="0 0 32 32" ${S} stroke-width="1.8"><path d="M16 27s-10-6-10-13a5.5 5.5 0 0 1 10-3 5.5 5.5 0 0 1 10 3c0 7-10 13-10 13z"/></svg>`,
        shield: `<svg viewBox="0 0 32 32" ${S} stroke-width="1.8"><path d="M16 4l10 4v7c0 7-4.5 11-10 13-5.5-2-10-6-10-13V8z"/><path d="M11.5 16l3 3 6-6"/></svg>`,
        arrow: `<svg viewBox="0 0 32 32" ${S} stroke-width="2.6"><path d="M16 25V8M9 14l7-7 7 7"/></svg>`,
      };
      document.querySelectorAll("[data-icon]").forEach((el) => (el.innerHTML = ICONS[el.dataset.icon]));
      document.querySelectorAll("[data-split]").forEach((el) => {
        el.innerHTML = [...el.dataset.split].map((c) => `<span class="ch">${c}</span>`).join("");
      });

      const SCREENS = [
        `<div class="scr-title">Noise Cancelling</div><div class="scr-sub">Adaptive · On</div><div class="scr-ring"></div><div class="scr-ring-label center">Max</div>
         <div class="seg"><div class="on">ANC</div><div>Aware</div><div>Off</div></div>`,
        `<div class="scr-title">Comfort Fit</div><div class="scr-sub">Memory-foam cushions</div><div class="cushions"><div></div><div></div></div>
         <div class="scr-sub">Clamp force</div><div class="slider"><b></b></div><div class="row"><i></i>All-day wear</div>`,
        `<div class="scr-title">Built Sturdy</div><div class="scr-sub">Made to be carried</div><div class="shield icon">${ICONS.shield}</div>
         <div class="row"><i></i>Reinforced headband</div><div class="row"><i></i>Drop tested</div><div class="row"><i></i>Sweat resistant</div>`,
        `<div class="art"></div><div class="scr-title">Now Playing</div><div class="scr-sub">Track title · Artist</div>
         <div class="eq">${[40, 70, 55, 90, 65, 80, 45, 75, 60, 85, 50].map((h) => `<span style="height:${h}%"></span>`).join("")}</div>`,
      ];
      // 8 phones: 2 per wall. [wall, depth z, along-wall offset, screen]
      const PHONES = [
        ["L", -320, -200, 0], ["L", -1150, 240, 2],
        ["R", -320, 200, 1], ["R", -1150, -240, 3],
        ["T", -500, -300, 3], ["T", -1400, 330, 1],
        ["B", -500, 300, 2], ["B", -1400, -330, 0],
      ];
      const tunnel = document.getElementById("tunnel");
      const WALL = { L: { x: -880, y: 0, ry: 62, rx: 0, rz: 0 }, R: { x: 880, y: 0, ry: -62, rx: 0, rz: 0 },
                     T: { x: 0, y: -560, ry: 0, rx: -62, rz: 90 }, B: { x: 0, y: 560, ry: 0, rx: 62, rz: 90 } };
      PHONES.forEach(([w, z, off, s], i) => {
        const slot = document.createElement("div");
        slot.className = "phone-slot";
        slot.id = "ph" + i;
        slot.innerHTML = `<div class="phone"><div class="screen">${SCREENS[s]}</div></div>`;
        tunnel.appendChild(slot);
      });
      const streakWrap = document.getElementById("streaks");
      const STREAKS = [
        { top: 20, w: 1100, h: 14, c: "rgba(255,106,26,.95)" },
        { top: 70, w: 760, h: 9, c: "rgba(255,200,61,.95)" },
        { top: 115, w: 1300, h: 18, c: "rgba(255,140,40,.75)" },
        { top: 160, w: 620, h: 6, c: "rgba(255,233,160,.9)" },
      ];
      STREAKS.forEach((d, i) => {
        const el = document.createElement("div");
        el.className = "streak";
        el.id = "streak" + i;
        el.style.cssText = `top:${d.top}px;width:${d.w}px;height:${d.h}px;background:linear-gradient(90deg, rgba(0,0,0,0), ${d.c} 70%, rgba(255,255,255,.9) 96%, rgba(0,0,0,0));`;
        streakWrap.appendChild(el);
      });

      // ---------- ONE timeline ----------
      const DUR = 13;
      const tl = gsap.timeline({ paused: true });
      const flash = (t) => {
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.94, duration: 4 / 30, ease: "power2.in", immediateRender: false }, t);
        tl.to("#flash", { opacity: 0, duration: 0.32, ease: "expo.out" }, t + 6 / 30);
      };

      // Breathing glow — never stops (finite repeats sized to the film)
      [["#blob-red", 3.2, 0.06, 30], ["#blob-orange", 2.6, 0.08, -40], ["#blob-cream", 2.1, 0.1, 24]].forEach(([sel, cyc, amp, dx], i) => {
        tl.fromTo(sel, { scale: 1 - amp / 2, opacity: 0.86, xPercent: -50, yPercent: -50, x: -dx / 2 },
          { scale: 1 + amp / 2, opacity: 1, x: dx / 2, duration: cyc / 2, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / (cyc / 2)) }, i * 0.35);
      });
      // Grain shimmer (stepped, deterministic)
      tl.to("#grain", { backgroundPosition: "3px 2px, 4px 0px, 1px 5px", duration: 2 / 30, ease: "steps(2)", repeat: Math.ceil(DUR * 15) }, 0);

      // ===== S1 · Hook (0 → 2.15) =====
      tl.fromTo("#glow", { scale: 0.25, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.6, ease: "expo.out" }, 0.1);
      tl.from("#w-with", { opacity: 0, filter: "blur(14px)", y: 24, duration: 0.8, ease: "expo.out" }, 0.45);
      tl.from("#tile", { opacity: 0, scale: 0.82, duration: 0.9, ease: "back.out(1.5)" }, 0.72);
      tl.from("#tile svg", { opacity: 0, scale: 0.7, duration: 0.7, ease: "expo.out" }, 0.82);
      tl.from("#w-boat", { opacity: 0, filter: "blur(14px)", y: 24, duration: 0.8, ease: "expo.out" }, 0.98);
      tl.fromTo("#s1", { scale: 1 }, { scale: 1.05, duration: 1.7, ease: "sine.inOut" }, 0.05);
      // push through the icon
      tl.to("#s1", { scale: 16, duration: 0.42, ease: "expo.in" }, 1.75);
      tl.set("#s1", { filter: "blur(0px)" }, 1.85);
      tl.to("#s1", { filter: "blur(18px)", duration: 0.3, ease: "power2.in" }, 1.86);
      tl.to("#s1", { opacity: 0, duration: 0.16, ease: "power1.in" }, 2.0);
      tl.to("#glow", { scale: 1.25, duration: 0.5, ease: "expo.in" }, 1.75);

      // ===== S2 · Glass UI (2.0 → 4.3) =====
      tl.to("#glow", { scale: 1, y: -30, duration: 1.2, ease: "expo.out" }, 2.25);
      tl.fromTo("#s2", { opacity: 0, filter: "blur(24px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out", immediateRender: true }, 2.02);
      tl.set("#s2", { filter: "none" }, 2.63);
      tl.fromTo("#panel", { scale: 0.62, rotationX: 26, rotationY: -34, z: -200 },
        { scale: 1, rotationX: 14, rotationY: -20, z: 0, duration: 0.9, ease: "expo.out" }, 2.02);
      tl.to("#panel", { rotationX: 9, rotationY: -6, duration: 1.08, ease: "sine.inOut" }, 2.92);
      tl.from("#avatar", { scale: 0.6, opacity: 0, duration: 0.8, ease: "back.out(1.6)" }, 2.25);
      tl.fromTo("#avatar-ring", { rotation: 0 }, { rotation: 300, duration: 2.1, ease: "none" }, 2.1);
      tl.fromTo("#avatar-ring-glow", { opacity: 0.4, scale: 0.9 }, { opacity: 1, scale: 1.08, duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut" }, 2.3);
      tl.from("#greet", { opacity: 0, x: 30, filter: "blur(10px)", duration: 0.7, ease: "power3.out" }, 2.4);
      tl.set("#greet", { filter: "none" }, 3.11);
      tl.from(".chip", { opacity: 0, y: 34, scale: 0.9, duration: 0.7, ease: "back.out(1.7)", stagger: 0.12 }, 2.55);
      tl.from(".prompt", { opacity: 0, y: 30, duration: 0.7, ease: "expo.out" }, 2.75);
      tl.fromTo("#cursor", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "steps(1)", yoyo: true, repeat: 5, repeatDelay: 0.25 }, 3.0);
      tl.fromTo("#s2-shine", { opacity: 0.6, scale: 0.9 }, { opacity: 1, scale: 1.1, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.1);
      // exit: push forward into the flash
      tl.to("#panel", { scale: 1.22, z: 160, duration: 0.3, ease: "expo.in" }, 4.0);
      flash(4.1);

      // ===== S3 · Just Ask (4.2 → 6.0) =====
      tl.to("#glow", { opacity: 0.55, scale: 0.85, y: 0, duration: 0.2, ease: "power2.out" }, 4.18);
      tl.to("#glow", { opacity: 0.68, scale: 0.92, duration: 1.2, ease: "sine.inOut" }, 4.4);
      tl.from("#just-ask .ch", { opacity: 0, filter: "blur(12px)", y: 18, duration: 0.7, ease: "expo.out", stagger: 0.045 }, 4.32);
      tl.fromTo("#just-ask", { scale: 0.98 }, { scale: 1.03, duration: 1.45, ease: "sine.inOut" }, 4.25);
      tl.to("#just-ask", { opacity: 0, filter: "blur(16px)", scale: 1.12, duration: 0.35, ease: "power2.in" }, 5.7);

      // ===== S4 · Phone tunnel (5.55 → 7.85) =====
      tl.to("#glow", { opacity: 1, scale: 1.05, duration: 0.8, ease: "expo.out" }, 5.6);
      PHONES.forEach(([w, z, off], i) => {
        const W = WALL[w];
        const along = w === "L" || w === "R" ? { y: off } : { x: off };
        const rest = { x: W.x + (along.x || 0), y: W.y + (along.y || 0), z, rotationY: W.ry, rotationX: W.rx, rotationZ: W.rz };
        const far = { L: { x: -2600 }, R: { x: 2600 }, T: { y: -1900 }, B: { y: 1900 } }[w];
        tl.fromTo("#ph" + i, { ...rest, ...far, z: z + 300, opacity: 0 },
          { ...rest, opacity: 1, duration: 0.9, ease: "expo.out", immediateRender: true }, 5.55 + [0, 4, 1, 5, 2, 6, 3, 7][i] * 0.055);
      });
      tl.from("#magic .ch", { opacity: 0, filter: "blur(12px)", y: 18, duration: 0.7, ease: "expo.out", stagger: 0.035 }, 5.95);
      tl.fromTo("#tunnel", { z: 0 }, { z: 260, duration: 1.0, ease: "sine.inOut" }, 5.9); // slow creep
      tl.to("#tunnel", { z: 2200, duration: 0.85, ease: "expo.in" }, 6.95);             // push through
      tl.to("#magic", { opacity: 0, duration: 0.25, ease: "power1.in" }, 7.45);
      tl.to("#s4", { filter: "blur(22px)", opacity: 0, duration: 0.3, ease: "power2.in" }, 7.55);

      // ===== S5 · Pill (7.7 → 9.6) =====
      tl.to("#glow", { scale: 0.95, y: 40, duration: 0.8, ease: "expo.out" }, 7.7);
      tl.fromTo("#s5", { opacity: 0, filter: "blur(28px)", scale: 0.86 }, { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.6, ease: "expo.out", immediateRender: true }, 7.7);
      tl.set("#s5", { filter: "none" }, 8.31);
      tl.from(".pill-label", { opacity: 0, y: 20, duration: 0.6, ease: "power3.out" }, 7.9);
      tl.from("#count", { opacity: 0, y: -24, duration: 0.6, ease: "expo.out" }, 7.82);
      tl.fromTo("#pill-fill", { scaleX: 0.0001 }, { scaleX: 1, duration: 1.3, ease: "power2.inOut", immediateRender: true }, 7.95);
      const counter = { v: 0 };
      const countEl = document.getElementById("count");
      tl.fromTo(counter, { v: 0 }, { v: 100, duration: 1.3, ease: "power2.inOut", immediateRender: true,
        onUpdate: () => (countEl.innerHTML = Math.round(counter.v) + "<small>%</small>") }, 7.95);
      tl.fromTo("#pill", { scale: 1 }, { scale: 1.025, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, 9.22);
      tl.fromTo("#pill-sheen", { x: 0 }, { x: 1600, duration: 0.7, ease: "power2.inOut" }, 9.12);
      STREAKS.forEach((d, i) => {
        tl.fromTo("#streak" + i, { x: -d.w - 100, opacity: 0.0 }, { x: 1920 + 100, opacity: 1, duration: [1.0, 0.75, 1.25, 0.65][i], ease: "power1.inOut" }, 7.85 + i * 0.22);
      });

      // ===== S6 · Tagline → logo (9.6 → 13.0) =====
      flash(9.5);
      tl.to("#glow", { opacity: 0.7, scale: 0.9, y: 0, duration: 0.3, ease: "power2.out" }, 9.6);
      tl.from("#tagline span", { opacity: 0, filter: "blur(14px)", y: 24, duration: 0.75, ease: "expo.out", stagger: 0.17 }, 9.72);
      tl.fromTo("#tagline", { scale: 0.98 }, { scale: 1.03, duration: 0.9, ease: "sine.inOut" }, 9.65);
      tl.to("#tagline", { opacity: 0, filter: "blur(18px)", scale: 1.08, duration: 0.4, ease: "power2.in" }, 10.55);
      // glow collapses into the centre, then blooms into the logo
      tl.to("#glow", { scale: 0.1, opacity: 1, duration: 0.5, ease: "expo.in" }, 10.48);
      tl.to("#glow", { scale: 0.5, duration: 1.0, ease: "expo.out" }, 10.98);
      tl.to("#glow", { scale: 0.42, opacity: 0.85, duration: 1.0, ease: "sine.inOut" }, 11.98);
      tl.fromTo("#logo", { opacity: 0, scale: 0.6, filter: "blur(18px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.9, ease: "expo.out", immediateRender: true }, 10.95);
      tl.set("#logo", { filter: "none" }, 11.86);
      tl.from("#logo-sub", { opacity: 0, y: 14, filter: "blur(8px)", duration: 0.8, ease: "power3.out" }, 11.35);
      tl.to("#logo", { scale: 1.025, duration: 1.14, ease: "sine.inOut" }, 11.86);

      tl.to({}, { duration: DUR }, 0); // duration anchor
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
