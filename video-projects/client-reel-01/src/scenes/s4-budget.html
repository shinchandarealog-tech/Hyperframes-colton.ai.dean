<template id="s4-budget-template">
  <div data-composition-id="s4-budget" data-width="1080" data-height="1920" id="root">
    <div class="fx-stage" id="s4-stage">
      <div class="fx-small" id="s4-a" data-split>But the winner is</div>
      <div class="fx-big" id="s4-not" data-split>NOT</div>
      <div class="s4-pillwrap" id="s4-pillwrap">
        <div class="fx-pill fx-glass" id="s4-pill">
          <span class="num">1</span><span class="lbl">Biggest budget</span><span class="cash">$$$</span>
        </div>
        <div class="s4-strike" id="s4-strike"></div>
      </div>
    </div>
    <style>
      /*@FX_CSS*/
      #s4-not { font-size: 170px; margin-top: -4px; }
      .s4-pillwrap { position: relative; margin-top: 30px; }
      #s4-pill { width: 760px; box-sizing: border-box; justify-content: flex-start; }
      #s4-pill .lbl { flex: 1; text-align: left; }
      #s4-pill .cash { font-weight: 800; color: #9be3a8; letter-spacing: 0.02em; }
      .s4-strike { position: absolute; left: -24px; right: -24px; top: 54px; height: 9px; border-radius: 6px;
        background: #ff5a6a; box-shadow: 0 0 22px rgba(255, 90, 106, 0.85); transform-origin: 0% 50%; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      /*@FX_JS*/
      (() => {
        const D = 3.2;
        const root = document.querySelector('[data-composition-id="s4-budget"]');
        FX.split(root);
        const tl = gsap.timeline({ paused: true });
        FX.blurIn(tl, FX.words(root, "#s4-a"), 0.04, { stagger: 0.1 });
        tl.from("#s4-not .fx-c", { opacity: 0, scale: 2.2, y: 30, filter: "blur(26px) brightness(2.6)", duration: 0.42, ease: "expo.out", stagger: 0.06 }, 0.86);
        FX.glowIn(tl, "#s4-pill", 1.3);
        tl.from("#s4-pill .num, #s4-pill .lbl, #s4-pill .cash", { opacity: 0, x: -20, duration: 0.4, stagger: 0.06, ease: "power3.out" }, 1.42);
        // strike lands once the pill is fully readable
        tl.fromTo("#s4-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.28, ease: "power3.inOut" }, 2.0);
        tl.to("#s4-pill", { opacity: 0.5, filter: "grayscale(1)", duration: 0.35, ease: "power1.out" }, 2.22);
        tl.to("#s4-not", { color: "#ff5a6a", textShadow: "0 0 34px rgba(255,90,106,0.5), 0 8px 30px rgba(0,0,0,0.5)", duration: 0.3 }, 2.2);
        // whip out to the left (hands off to the AI b-roll)
        tl.to("#s4-stage", { x: -420, opacity: 0, filter: "blur(22px)", duration: 0.24, ease: "expo.in" }, 2.96);
        tl.to({}, { duration: D }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines["s4-budget"] = tl;
      })();
    </script>
  </div>
</template>
