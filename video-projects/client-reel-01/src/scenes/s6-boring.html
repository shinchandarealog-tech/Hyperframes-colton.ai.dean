<template id="s6-boring-template">
  <div data-composition-id="s6-boring" data-width="1080" data-height="1920" id="root">
    <div class="fx-stage">
      <div class="fx-slot" id="s6-A">
        <div class="fx-small" id="s6-a1" data-split>If your ad is</div>
        <div class="fx-big s6-boring" id="s6-a2" data-split>boring,</div>
      </div>
    </div>
    <div class="fx-stage" id="s6-B">
      <div class="fx-small" id="s6-b1" data-split>the AI taxes you</div>
      <div class="s6-cardwrap" id="s6-cardwrap">
        <div class="s6-card fx-glass-dark" id="s6-card">
          <div class="row">
            <span class="lbl">Cost per click</span>
            <span class="tax" id="s6-tax">AI tax</span>
          </div>
          <div class="price"><span id="s6-price">$1.00</span></div>
          <svg class="spark" viewBox="0 0 700 110" preserveAspectRatio="none">
            <polyline id="s6-line" points="0,100 120,96 240,92 330,84 420,70 510,52 600,28 700,6" fill="none"
              stroke="#ff5a6a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <div class="s6-badge" id="s6-badge">5×</div>
      </div>
    </div>
    <style>
      /*@FX_CSS*/
      .s6-boring { color: #aab2c4; font-size: 170px; }
      .s6-cardwrap { position: relative; margin-top: 20px; }
      .s6-card { position: relative; width: 820px; height: 380px; border-radius: 44px; padding: 34px 44px; box-sizing: border-box; text-align: left; }
      .s6-card .row { display: flex; justify-content: flex-start; gap: 22px; align-items: center; }
      .s6-card .lbl { font-size: 38px; font-weight: 600; color: rgba(255,255,255,0.72); }
      .s6-card .tax { font-size: 30px; font-weight: 700; color: #ff7b88; padding: 10px 24px; border-radius: 999px;
        background: rgba(255,90,106,0.16); border: 1.5px solid rgba(255,90,106,0.55); }
      .s6-card .price { margin-top: 6px; font-size: 150px; font-weight: 800; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; line-height: 1; }
      .s6-card .spark { position: absolute; left: 44px; right: 44px; bottom: 26px; width: 732px; height: 70px; overflow: visible; }
      .s6-badge { position: absolute; right: -26px; top: -46px; width: 170px; height: 170px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center; font-size: 84px; font-weight: 900; letter-spacing: -0.04em;
        background: radial-gradient(circle at 35% 30%, #ff9aa5, #ff4258 55%, #b3122a 100%);
        box-shadow: 0 0 50px rgba(255,66,88,0.7), inset 0 3px 0 rgba(255,255,255,0.4); }
      .s6-cursor { position: absolute; left: 600px; top: 250px; width: 56px; height: 72px; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5)); }
      .s6-ripple { position: absolute; left: 596px; top: 238px; width: 80px; height: 80px; margin: -40px 0 0 -40px; border-radius: 50%;
        border: 4px solid rgba(255,255,255,0.9); opacity: 0; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      /*@FX_JS*/
      (() => {
        const D = 5.5;
        const root = document.querySelector('[data-composition-id="s6-boring"]');
        FX.split(root);
        const tl = gsap.timeline({ paused: true });
        const line = root.querySelector("#s6-line");
        const L = 760;
        gsap.set(line, { strokeDasharray: L, strokeDashoffset: L });

        FX.blurIn(tl, FX.words(root, "#s6-a1"), 0.04, { stagger: 0.08 });
        // "boring" — deflated, sinks in slowly
        tl.from("#s6-a2 .fx-w", { opacity: 0, y: -30, scaleY: 1.3, filter: "blur(18px)", duration: 0.7, ease: "power3.out" }, 0.58);
        tl.to("#s6-a2", { y: 18, opacity: 0.85, duration: 0.6, ease: "sine.inOut" }, 1.0);
        FX.blurOut(tl, "#s6-A", 1.36, { dur: 0.22 });

        FX.blurIn(tl, FX.words(root, "#s6-b1"), 1.45, { stagger: 0.08 });
        tl.from("#s6-card", { opacity: 0, y: 60, scale: 0.9, filter: "blur(16px)", duration: 0.6, ease: "expo.out" }, 1.55);
        tl.from("#s6-tax", { opacity: 0, scale: 0.4, duration: 0.35, ease: "back.out(2.5)" }, 1.75);
        // the click
        // five times more expensive
        FX.count(tl, root.querySelector("#s6-price"), 1, 5, 3.85, 0.9, (v) => "$" + v.toFixed(2), "power2.in");
        tl.to(line, { strokeDashoffset: 0, duration: 0.9, ease: "power2.in" }, 3.85);
        tl.to("#s6-price", { color: "#ff6b7a", textShadow: "0 0 40px rgba(255,90,106,0.55)", duration: 0.5 }, 4.1);
        tl.to("#s6-card", { borderColor: "rgba(255,90,106,0.7)", boxShadow: "inset 0 1.5px 0 rgba(255,255,255,0.16), 0 0 50px rgba(255,90,106,0.45), 0 16px 48px rgba(0,0,0,0.5)", duration: 0.5 }, 4.1);
        tl.from("#s6-badge", { opacity: 0, scale: 2.6, rotation: -30, filter: "blur(16px)", duration: 0.4, ease: "expo.out" }, 4.2);
        FX.blurOut(tl, "#s6-B", 5.24, { dur: 0.26 });
        tl.to({}, { duration: D }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines["s6-boring"] = tl;
      })();
    </script>
  </div>
</template>
