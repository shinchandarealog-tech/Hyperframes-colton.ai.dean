<template id="s7-discount-template">
  <div data-composition-id="s7-discount" data-width="1080" data-height="1920" id="root">
    <div class="fx-stage">
      <div class="fx-slot" id="s7-A">
        <div class="fx-small" id="s7-a1" data-split>If your ad holds</div>
        <div class="fx-big fx-grad" id="s7-a2" data-split>attention,</div>
      </div>
    </div>
    <div class="fx-stage" id="s7-B">
      <div class="fx-small" id="s7-b1" data-split>the platform gives you a discount</div>
      <div class="s7-cardwrap" id="s7-cardwrap">
        <div class="s7-card fx-glass" id="s7-card">
          <div class="row">
            <span class="lbl">Cost per click</span>
            <span class="bonus" id="s7-bonus">✓ Attention bonus</span>
          </div>
          <div class="prices">
            <span class="old" id="s7-old">$5.00<i id="s7-oldstrike"></i></span>
            <span class="new fx-grad"><span class="fx-w" id="s7-new">$0.80</span></span>
          </div>
          <svg class="spark" viewBox="0 0 700 110" preserveAspectRatio="none">
            <polyline id="s7-line" points="0,6 100,10 200,18 300,34 400,58 500,80 600,94 700,102" fill="none"
              stroke="#7dd3fc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <div class="s7-badge" id="s7-badge">−84%</div>
      </div>
    </div>
    <style>
      /*@FX_CSS*/
      #s7-a2 { font-size: 160px; }
      .s7-cardwrap { position: relative; margin-top: 20px; }
      .s7-card { position: relative; width: 820px; height: 380px; border-radius: 44px; padding: 34px 44px; box-sizing: border-box; text-align: left; }
      .s7-card .row { display: flex; justify-content: space-between; align-items: center; }
      .s7-card .lbl { font-size: 38px; font-weight: 600; color: rgba(255,255,255,0.78); }
      .s7-card .bonus { font-size: 30px; font-weight: 700; color: #bfeaff; padding: 10px 24px; border-radius: 999px;
        background: rgba(125,211,252,0.16); border: 1.5px solid rgba(125,211,252,0.6); }
      .s7-card .prices { position: relative; height: 160px; margin-top: 6px; }
      .s7-card .old, .s7-card .new { position: absolute; left: 0; top: 0; font-size: 150px; font-weight: 800; letter-spacing: -0.04em;
        font-variant-numeric: tabular-nums; line-height: 1; }
      .s7-card .old { transform-origin: 0% 50%; }
      .s7-card .old i { position: absolute; left: -6px; right: -6px; top: 50%; height: 10px; margin-top: -5px; border-radius: 6px;
        background: #ff5a6a; transform-origin: 0 50%; box-shadow: 0 0 16px rgba(255,90,106,0.7); }
      .s7-card .spark { position: absolute; left: 44px; bottom: 26px; width: 732px; height: 70px; overflow: visible; }
      .s7-badge { position: absolute; right: -30px; top: -50px; padding: 26px 34px; border-radius: 999px;
        font-size: 64px; font-weight: 900; letter-spacing: -0.03em; color: #06132f;
        background: linear-gradient(180deg, #e3f6ff 0%, #8fd8fd 50%, #3b9cf0 100%);
        box-shadow: 0 0 50px rgba(125,211,252,0.75), inset 0 3px 0 rgba(255,255,255,0.6); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      /*@FX_JS*/
      (() => {
        const D = 4.3;
        const root = document.querySelector('[data-composition-id="s7-discount"]');
        FX.split(root);
        const tl = gsap.timeline({ paused: true });
        const line = root.querySelector("#s7-line");
        gsap.set(line, { strokeDasharray: 760, strokeDashoffset: 760 });

        FX.blurIn(tl, FX.words(root, "#s7-a1"), 0.04, { stagger: 0.09 });
        tl.from("#s7-a2 .fx-w", { opacity: 0, scale: 0.7, filter: "blur(22px)", duration: 0.6, ease: "expo.out" }, 0.84);
        FX.blurOut(tl, "#s7-A", 1.6, { dur: 0.22 });

        FX.blurIn(tl, FX.words(root, "#s7-b1"), 1.7, { stagger: 0.06 });
        tl.from("#s7-card", { opacity: 0, y: 60, scale: 0.9, filter: "blur(16px)", duration: 0.6, ease: "expo.out" }, 1.82);
        tl.from("#s7-bonus", { opacity: 0, scale: 0.4, duration: 0.35, ease: "back.out(2.5)" }, 2.25);
        tl.set("#s7-new", { opacity: 0 }, 0);
        // massive discount: old price strikes + shrinks away, new price focuses in
        tl.fromTo("#s7-oldstrike", { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: "power3.out" }, 2.86);
        tl.to("#s7-old", { scale: 0.34, x: 520, y: -14, opacity: 0.55, color: "#c8cfdc", duration: 0.45, ease: "power3.inOut" }, 3.02);
        tl.fromTo("#s7-new", { opacity: 0, filter: "blur(20px)", scale: 1.25 }, { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.5, ease: "expo.out" }, 3.1);
        tl.to(line, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 2.95);
        tl.from("#s7-badge", { opacity: 0, scale: 2.4, rotation: 18, filter: "blur(16px)", duration: 0.42, ease: "expo.out" }, 3.27);
        tl.to("#s7-badge", { scale: 1.06, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 3.7);
        tl.to("#s7-cardwrap", { y: -10, duration: 1.2, ease: "sine.inOut" }, 2.6);
        FX.blurOut(tl, "#s7-B", 4.04, { dur: 0.24 });
        tl.to({}, { duration: D }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines["s7-discount"] = tl;
      })();
    </script>
  </div>
</template>
