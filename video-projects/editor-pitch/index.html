    <meta charset="UTF-8" />

    <style>
      /* Fonts matched to @barsolmedia reference */
      @font-face { font-family: "Comfortaa"; src: url("assets/fonts/comfortaa-700.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Montserrat Alternates"; src: url("assets/fonts/montserrat-alt-900.woff2") format("woff2"); font-weight: 900; }
      @font-face { font-family: "Allura"; src: url("assets/fonts/allura-400.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Anton"; src: url("assets/fonts/anton-400.woff2") format("woff2"); font-weight: 400; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      /* Palette: red + white only (user direction) */
      :root { --red: #d8162b; --white: #ffffff; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .vw { position: absolute; inset: 0; transform-origin: 50% 40%; }
      #vwrap { z-index: 1; }
      #mwrap { z-index: 4; }
      .vw video { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
      .grp { position: absolute; inset: 0; }
      .grp.behind { z-index: 3; }
      .grp.front { z-index: 5; }
      /* curved text: every letter sits on the spiral with its own angle */
      .w { position: absolute; inset: 0; line-height: 1; }
      .cp { position: absolute; white-space: pre; }
      .c { display: inline-block; }
      .r-b { font-family: "Comfortaa", sans-serif; font-weight: 700; color: var(--white);
        text-shadow: 0 0 6px rgba(255,255,255,0.9), 0 0 22px rgba(255,255,255,0.75), 0 0 48px rgba(255,255,255,0.45), 0 4px 14px rgba(0,0,0,0.6); }
      .r-e { font-family: "Montserrat Alternates", sans-serif; font-weight: 900; color: var(--red);
        text-shadow: 0 0 8px rgba(255,60,80,0.95), 0 0 26px rgba(255,30,55,0.8), 0 0 54px rgba(255,20,45,0.55), 0 4px 12px rgba(0,0,0,0.6); }
      .r-s { font-family: "Allura", cursive; font-weight: 400; color: var(--white);
        text-shadow: 0 0 6px rgba(255,255,255,0.9), 0 0 20px rgba(255,255,255,0.7), 0 0 42px rgba(255,255,255,0.4), 0 3px 10px rgba(0,0,0,0.7); }
      .r-p { font-family: "Anton", sans-serif; font-weight: 400; color: var(--red);
        text-shadow: 7px 5px 0 rgba(255,255,255,0.95), 0 0 28px rgba(255,30,55,0.85), 0 0 60px rgba(255,20,45,0.55), 0 14px 30px rgba(0,0,0,0.7); }
      .r-p.white { color: var(--white); text-shadow: 7px 5px 0 var(--red), 0 0 28px rgba(255,255,255,0.8), 0 0 60px rgba(255,255,255,0.45), 0 14px 30px rgba(0,0,0,0.7); }
      .r-p .c { transform: skewX(-8deg); }
      /* ---------- explainer motion graphics ---------- */
      .mg { position: absolute; z-index: 7; }
      .card { left: 90px; width: 900px; top: 1515px; height: 310px; border-radius: 40px;
        background: rgba(12,12,14,0.8); border: 2px solid rgba(255,255,255,0.14);
        box-shadow: 0 22px 60px rgba(0,0,0,0.55), 0 0 46px rgba(216,22,43,0.3); overflow: hidden; }
      .lbl { position: absolute; font-family: "Comfortaa", sans-serif; font-weight: 700; color: rgba(255,255,255,0.75); font-size: 30px; letter-spacing: 0.14em; }
      .big { position: absolute; font-family: "Anton", sans-serif; color: #fff; line-height: 1;
        text-shadow: 0 0 22px rgba(255,255,255,0.5); }
      .redtxt { color: var(--red); text-shadow: 0 0 22px rgba(255,30,55,0.7); }
      #hookq { left: 0; width: 1080px; top: 760px; text-align: center; font-family: "Anton", sans-serif; font-size: 230px; color: #fff; z-index: 8; }
      #sil { z-index: 6; }
      /* editor timeline panel, sits BEHIND the speaker */
      #edpanel { z-index: 2; left: 560px; top: 210px; width: 470px; height: 330px; border-radius: 26px;
        background: rgba(14,14,16,0.86); border: 2px solid rgba(255,255,255,0.18); box-shadow: 0 0 40px rgba(216,22,43,0.35);
        transform: perspective(900px) rotateY(-16deg); overflow: hidden; }
      .trk { position: absolute; left: 24px; right: 24px; height: 44px; }
      .clp { position: absolute; top: 0; height: 44px; border-radius: 9px; }
      .clp.r { background: var(--red); box-shadow: 0 0 14px rgba(255,30,55,0.6); }
      .clp.w { background: #fff; }
      .clp.g { background: rgba(255,255,255,0.28); }
      #edhead { position: absolute; top: 56px; bottom: 14px; left: 60px; width: 5px; background: var(--red); box-shadow: 0 0 14px var(--red); }
      .bar { position: absolute; bottom: 70px; width: 14px; border-radius: 7px; transform-origin: 50% 100%; }
      .chip { position: absolute; top: 34px; padding: 10px 22px; border-radius: 30px; font-family: "Comfortaa", sans-serif; font-weight: 700; font-size: 26px; }
      .beat { position: absolute; top: 150px; width: 84px; height: 84px; border-radius: 18px; background: rgba(255,255,255,0.14); border: 2px solid rgba(255,255,255,0.2); }
      #notif { z-index: 7; left: 70px; width: 940px; top: 90px; height: 190px; border-radius: 40px;
        background: rgba(250,250,250,0.96); box-shadow: 0 20px 50px rgba(0,0,0,0.45), 0 0 40px rgba(255,255,255,0.35); }
    </style>

      function cardOut(sel, t) { tl.to(sel, { y: 120, opacity: 0, filter: "blur(10px)", duration: 0.1, ease: "power2.in" }, t - 0.1); }

      // A. hook: red silhouette + ??? -> white flash -> reveal
      tl.set("#sil", { filter: "brightness(0) saturate(100%) invert(14%) sepia(97%) saturate(7000%) hue-rotate(350deg) brightness(95%)" }, 0);
      tl.set("#sil", { filter: "brightness(0) invert(1) drop-shadow(0 0 40px #fff)" }, 0.13);
      tl.to("#sil", { opacity: 0, duration: 0.12, ease: "power2.in" }, 0.17);
      tl.fromTo("#hookq", { scale: 1.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.06, ease: "power4.out" }, 0);

      // B. editor timeline panel behind the speaker
      tl.fromTo("#edpanel", { x: 220, opacity: 0, filter: "blur(8px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power3.out" }, 1.05);
      tl.from("#edpanel .clp", { scaleX: 0, transformOrigin: "0% 50%", duration: 0.18, stagger: 0.025, ease: "power2.out" }, 1.12);
      tl.fromTo("#edhead", { x: 0 }, { x: 360, duration: 1.0, ease: "none" }, 1.12);
      tl.to("#edpanel", { opacity: 0, x: 120, duration: 0.1, ease: "power2.in" }, 2.04);

      // C. viral views counter
      cardIn("#cviral", 2.55);
      counter("#vcount", 0, 2400000, 2.62, 0.5, function (v) { return v >= 1e6 ? (v / 1e6).toFixed(1) + "M" : Math.round(v / 1000) + "K"; });
      tl.from("#cviral .vb", { scaleY: 0, transformOrigin: "50% 100%", duration: 0.2, stagger: 0.05, ease: "back.out(2)" }, 2.66);
      cardOut("#cviral", 3.23);

      // D. retention graph
      cardIn("#cret", 3.23);
      tl.fromTo("#rline", { strokeDasharray: 560, strokeDashoffset: 560 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 3.32);
      tl.from("#ravg", { opacity: 0, duration: 0.3 }, 3.4);
      counter("#rcount", 0, 92, 3.32, 0.6, function (v) { return Math.round(v) + "%"; });
      cardOut("#cret", 4.4);

      // E. fast cuts: blades slice, pieces split apart on CUTS
      cardIn("#ccuts", 4.5);
      tl.fromTo("#ccuts .blade", { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.06, stagger: 0.04, ease: "power4.out" }, 4.86);
      tl.to("#ccuts .cutp", { x: function (i) { return (i - 1.5) * 26; }, rotation: function (i) { return [-4, 3, -3, 4][i]; }, duration: 0.18, ease: "back.out(2)" }, 4.94);
      tl.to("#ccuts .blade", { opacity: 0, duration: 0.12 }, 5.02);
      cardOut("#ccuts", 5.25);

      // F. sound design waveform
      cardIn("#csound", 5.25);
      tl.fromTo("#wave .bar", { scaleY: 0.15 }, { scaleY: 1, duration: 0.14, stagger: { each: 0.012, yoyo: true, repeat: 3 }, ease: "sine.inOut" }, 5.3);
      cardOut("#csound", 6.15);

      // G. pacing beat grid
      cardIn("#cpace", 6.15);
      tl.to("#beats .beat", { backgroundColor: "#d8162b", boxShadow: "0 0 24px rgba(255,30,55,.9)", scale: 1.08, duration: 0.05, stagger: 0.085, ease: "none" }, 6.3);
      tl.fromTo("#pacehead", { x: 0 }, { x: 790, duration: 0.7, ease: "none" }, 6.3);
      cardOut("#cpace", 7.06);

      // H. notification
      tl.fromTo("#notif", { y: -260, opacity: 0, scale: 0.95 }, { y: 0, opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.7)" }, 7.08);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
