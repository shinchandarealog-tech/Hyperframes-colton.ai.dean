<template id="s7-graph-template">
  <div data-composition-id="s7-graph" data-width="1080" data-height="1920">
    <div class="sc">
      <div class="paper"></div>
      <div class="grid"></div>
      <div class="l1 sat"><span data-t="21.38">So</span> <span data-t="21.50">at</span> <span data-t="21.63">this</span> <span data-t="21.86">point</span> <span data-t="22.16">I</span> <span data-t="22.32">probably</span> <span data-t="22.80">owned</span></div>
      <svg class="chart" width="1080" height="1920" viewBox="0 0 1080 1920">
        <polyline class="ln" points="40,1560 230,1390 320,1450 520,1210 610,1280 800,980 880,1040 1160,520" fill="none" stroke="#1f4fd8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <circle class="ball" cx="40" cy="1560" r="17" fill="#1f4fd8"/>
      </svg>
      <div class="num hero sans" data-t="23.37">50+</div>
      <div class="w hero serif blue" data-t="24.27">watches.</div>
    </div>
    <style>
      [data-composition-id="s7-graph"] { position: absolute; inset: 0; overflow: hidden; background: #f2f2f4; font-family: var(--sans); color: var(--ink); }
      [data-composition-id="s7-graph"] .sc { position: absolute; inset: 0; }
      [data-composition-id="s7-graph"] .paper { position: absolute; inset: 0; opacity: 0.5; mix-blend-mode: multiply; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' seed='3'/><feColorMatrix type='matrix' values='0 0 0 0 0.55  0 0 0 0 0.55  0 0 0 0 0.6  0 0 0 0.35 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>"); }
      [data-composition-id="s7-graph"] .grid { position: absolute; inset: 0; opacity: 0.5;
        background-image: linear-gradient(rgba(11,11,13,0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(11,11,13,0.07) 1px, transparent 1px);
        background-size: 120px 120px; background-position: 0 40px; }
      [data-composition-id="s7-graph"] .chart { position: absolute; left: 0; top: 0; }
      [data-composition-id="s7-graph"] .ball { filter: drop-shadow(0 0 14px rgba(31,79,216,0.6)); }
      [data-composition-id="s7-graph"] .sat { font-weight: 500; font-size: 42px; color: #2a2a30; }
      [data-composition-id="s7-graph"] .sat span { display: inline-block; }
      [data-composition-id="s7-graph"] .l1 { position: absolute; left: 96px; top: 320px; }
      [data-composition-id="s7-graph"] .num { position: absolute; left: 80px; top: 470px; font-weight: 800; font-size: 330px; line-height: 0.9; letter-spacing: -0.055em; }
      [data-composition-id="s7-graph"] .w { position: absolute; left: 120px; top: 790px; font-family: var(--serif); font-style: italic; font-weight: 700; font-size: 140px; line-height: 1; }
      [data-composition-id="s7-graph"] .blue { color: var(--blue); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        const T0 = 21.35, r = '[data-composition-id="s7-graph"] ';
        const root = document.querySelector('[data-composition-id="s7-graph"]');
        const ln = root.querySelector(".ln"), ball = root.querySelector(".ball");
        const L = ln.getTotalLength();
        gsap.set(ln, { strokeDasharray: L, strokeDashoffset: L });
        const tl = gsap.timeline({ paused: true });
        tl.from(r + ".sc", { scale: 1.06, filter: "blur(8px)", duration: 0.35, ease: "expo.out" }, 0);
        const prog = { p: 0 };
        const draw = () => { const d = L * prog.p; ln.style.strokeDashoffset = L - d; const pt = ln.getPointAtLength(d); ball.setAttribute("cx", pt.x); ball.setAttribute("cy", pt.y); };
        tl.to(prog, { p: 1, duration: 2.3, ease: "power1.inOut", onUpdate: draw }, 0.05);
        tl.from(r + ".grid", { opacity: 0, duration: 0.6, ease: "power1.out" }, 0.05);
        root.querySelectorAll("[data-t]").forEach((el) => {
          const t = Math.max(0.05, +el.dataset.t - T0 - 0.04);
          if (el.classList.contains("hero")) tl.from(el, { opacity: 0, scale: 0.94, filter: "blur(6px)", duration: 0.4, ease: "expo.out" }, t);
          else tl.from(el, { opacity: 0, y: 14, duration: 0.25, ease: "power2.out" }, t);
        });
        tl.set({}, {}, 3.34);
        window.__timelines["s7-graph"] = tl;
      })();
    </script>
  </div>
</template>
