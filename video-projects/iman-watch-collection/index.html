<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <style>
      /* Palette + type from DESIGN.md (premium minimal / @arthurcbrooks reference) */
      :root {
        --ink: #0b0b0d;
        --paper: #f2f2f4;
        --white: #ffffff;
        --blue: #1f4fd8;
        --hair: #d9d9e0;
        --sans: "Inter", "Helvetica Neue", Arial, sans-serif;
        --serif: "Playfair Display", Georgia, serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); font-family: var(--sans); }

      /* A-roll: 1920x1080 source shown at 1920px tall, re-cropped per camera angle */
      #frame { position: absolute; inset: 0; overflow: hidden; transform-origin: 540px 820px; z-index: 0; }
      #cam { position: absolute; left: 0; top: 0; width: 3413px; height: 1920px; }
      #aroll { position: absolute; left: 0; top: 0; width: 3413px; height: 1920px; object-fit: cover; filter: contrast(1.06) saturate(0.94) brightness(0.97); }
      #vignette { position: absolute; inset: 0; z-index: 1; pointer-events: none;
        background: radial-gradient(ellipse 85% 70% at 50% 42%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.38) 100%); }

      /* Fine film grain over everything (static, deterministic SVG noise) */
      #grain { position: absolute; inset: -40px; z-index: 60; pointer-events: none; opacity: 0.075; mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' seed='7' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

      .scene { z-index: 10; }
      .overlay { z-index: 15; }
      .captions { z-index: 20; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="33.41" data-width="1080" data-height="1920">
      <div id="frame">
        <div id="cam">
          <video id="aroll" data-start="0" data-duration="32.41" data-track-index="0" src="assets/iman-edit.mp4" muted playsinline></video>
        </div>
      </div>
      <div id="vignette"></div>

      <audio id="voice" data-start="0" data-duration="32.41" data-track-index="9" src="assets/iman-edit.mp4" data-volume="1"></audio>

      <!-- Full-screen cutaways (track 1, back to back where they touch) -->
      <div id="s1" class="scene" data-composition-id="s1-watch-macro" data-composition-src="compositions/s1-watch-macro.html" data-start="1.85" data-duration="1.20" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="s2" class="scene" data-composition-id="s2-plane" data-composition-src="compositions/s2-plane.html" data-start="3.05" data-duration="2.05" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="s4" class="scene" data-composition-id="s4-polaroids" data-composition-src="compositions/s4-polaroids.html" data-start="10.60" data-duration="4.70" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="s5" class="scene" data-composition-id="s5-pause" data-composition-src="compositions/s5-pause.html" data-start="15.30" data-duration="1.55" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="s6" class="scene" data-composition-id="s6-timeline" data-composition-src="compositions/s6-timeline.html" data-start="19.55" data-duration="1.80" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="s7" class="scene" data-composition-id="s7-graph" data-composition-src="compositions/s7-graph.html" data-start="21.35" data-duration="3.34" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="s8" class="scene" data-composition-id="s8-wrist" data-composition-src="compositions/s8-wrist.html" data-start="24.69" data-duration="5.36" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="s9" class="scene" data-composition-id="s9-endcard" data-composition-src="compositions/s9-endcard.html" data-start="30.05" data-duration="3.36" data-track-index="1" data-width="1080" data-height="1920"></div>

      <!-- Timeline overlay on A-roll (beat 3) -->
      <div id="s3" class="overlay" data-composition-id="s3-timeline-overlay" data-composition-src="compositions/s3-timeline-overlay.html" data-start="9.55" data-duration="1.05" data-track-index="3" data-width="1080" data-height="1920"></div>

      <!-- Speech captions for A-roll + b-roll stretches -->
      <div id="cap" class="captions" data-track-kind="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="33.41" data-track-index="2" data-width="1080" data-height="1920"></div>

      <div id="grain"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const FRONT = -1166, SIDE = -1440; // crop offsets (source x * 1.7778) per camera angle
      // Camera-angle changes in the edited clip
      tl.set("#cam", { x: FRONT }, 0)
        .set("#cam", { x: SIDE }, 2.333)
        .set("#cam", { x: FRONT }, 12.433)
        .set("#cam", { x: SIDE }, 21.261)
        .set("#cam", { x: FRONT }, 24.691);
      // Slow push-in through each visible A-roll stretch
      [[0, 1.85], [5.10, 10.60], [16.85, 19.55]].forEach(([a, b]) => {
        tl.set("#frame", { scale: 1 }, a);
        tl.to("#frame", { scale: 1.05, duration: b - a, ease: "none" }, a);
      });
      // Soft settle when we come back to the face
      [5.10, 16.85].forEach((t) => tl.fromTo("#frame", { filter: "blur(6px)" }, { filter: "blur(0px)", duration: 0.3, ease: "expo.out", immediateRender: false }, t));
      tl.set({}, {}, 33.41);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
