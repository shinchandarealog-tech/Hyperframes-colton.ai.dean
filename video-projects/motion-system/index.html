<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- Motion System — landscape entry (1920×1080). Shares lib/ and clips/ with the other aspect. -->
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <link rel="stylesheet" href="lib/ms.css" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="ms-root"
      data-composition-id="ms-landscape"
      data-start="0"
      data-duration="18.67"
      data-width="1920"
      data-height="1080"
    >
      <div class="ms-speaker">
        <div class="ms-stage">
          <div class="ms-track">
            <video
              id="a-roll"
              class="clip"
              src="assets/sample-home-buying.mp4"
              playsinline
              data-start="0"
              data-duration="18.67"
              data-track-index="0"
              data-has-audio="true"
            ></video>
          </div>
        </div>
      </div>
      <div class="ms-overlay"></div>
    </div>

    <!-- generic system -->
    <script src="lib/ms-core.js"></script>
    <script src="lib/components/speaker-frame.js"></script>
    <script src="lib/components/headline.js"></script>
    <script src="lib/components/anchored-label.js"></script>
    <script src="lib/components/captions.js"></script>
    <!-- clip data (content) -->
    <script src="clips/home-buying/transcript.js"></script>
    <script src="clips/home-buying/footage-map.js"></script>
    <script src="clips/home-buying/beats.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["ms-landscape"] = MS.mount({ root: document.getElementById("root"), clip: "home-buying" }).tl;
    </script>
  </body>
</html>
