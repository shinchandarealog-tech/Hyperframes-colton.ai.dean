    <style>/* My Watch Story — tokens from the storyboard brief */
:root {
  --brand-bg: #000000;
  --brand-surface: rgba(12, 11, 12, 0.58);   /* card fill: dark see-through */
  --brand-border: rgba(255, 255, 255, 0.86); /* card outline: thin white */
  --brand-accent: #e3ad97;                    /* soft rose gold (5711R) */
  --brand-accent-glow: rgba(227, 173, 151, 0.55);
  --brand-text: #ffffff;
  --brand-text-dim: rgba(255, 255, 255, 0.45);
  --font-display: "Playfair Display", serif;  /* high-contrast serif + italic */
  --font-ui: "Inter", sans-serif;             /* clean sans semibold */
}

* { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: #000;
      }
      #root {
        position: relative; width: 1080px; height: 1920px; overflow: hidden;
        background: #000; color: #fff;
        font-family: "Inter", sans-serif;
        --rose: #e3ad97;
        --rose-glow: rgba(227, 173, 151, 0.55);
        --dim: rgba(255, 255, 255, 0.45);
        --card-fill: rgba(12, 11, 12, 0.58);
        --card-line: rgba(255, 255, 255, 0.86);
      }

      /* ---------- the 16:9 shot ---------- */
      #shot {
        position: absolute; left: 0; top: 656px; width: 1080px; height: 608px;
        overflow: hidden; background: #000;
      }
      #cam { position: absolute; inset: 0; transform-origin: 50% 30%; }
      #cam video, #cam img {
        position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
      }
      #grain {
        position: absolute; inset: -40px; opacity: 0; pointer-events: none;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 1.6 -0.3'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
        background-size: 240px 240px;
      }

      /* ---------- header ---------- */
      #header {
        position: absolute; left: 0; top: 250px; width: 1080px;
        display: flex; flex-direction: column; align-items: center;
      }
      #kicker {
        font-family: "Inter", sans-serif; font-weight: 600; font-size: 26px;
        letter-spacing: 0.34em; padding-left: 0.34em; line-height: 1;
      }
      #h1 {
        margin-top: 26px; font-family: "Playfair Display", serif; font-weight: 700;
        font-size: 100px; line-height: 1; letter-spacing: -0.01em;
      }
      #h2 {
        position: relative; margin-top: 6px; font-family: "Playfair Display", serif;
        font-style: italic; font-weight: 400; font-size: 92px; line-height: 1.05;
      }
      .w { display: inline-block; }
      #h2-under {
        position: absolute; left: 4px; right: 4px; bottom: -6px; height: 3px;
        background: var(--rose); border-radius: 2px; transform-origin: left center;
        box-shadow: 0 0 14px var(--rose-glow); transform: scaleX(0);
      }

      /* ---------- story timeline ---------- */
      #track { position: absolute; left: 170px; top: 556px; width: 740px; height: 60px; }
      #track-base, #track-fill {
        position: absolute; left: 0; top: 8px; width: 740px; height: 2px; border-radius: 1px;
        transform-origin: left center;
      }
      #track-base { background: rgba(255, 255, 255, 0.3); }
      #track-fill { background: var(--rose); box-shadow: 0 0 10px var(--rose-glow); transform: scaleX(0); }
      .dot {
        position: absolute; top: 0; width: 18px; height: 18px; margin-left: -9px;
        border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.8); background: #000;
      }
      .dot-halo {
        position: absolute; top: 0; width: 18px; height: 18px; margin-left: -9px;
        border-radius: 50%; border: 2px solid var(--rose); opacity: 0;
      }
      .dot-label {
        position: absolute; top: 32px; width: 200px; margin-left: -100px; text-align: center;
        font-weight: 600; font-size: 19px; letter-spacing: 0.2em; padding-left: 0.2em;
        line-height: 1; color: #fff; opacity: 0.45;
      }

      /* ---------- captions ---------- */
      #captions {
        position: absolute; left: 130px; top: 1294px; width: 820px; height: 230px;
      }
      .cap {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        text-align: center; font-weight: 600; font-size: 60px; line-height: 1.16;
        letter-spacing: -0.01em; opacity: 0;
      }
      .cap em {
        font-family: "Playfair Display", serif; font-style: italic; font-weight: 400;
        font-size: 68px; letter-spacing: 0;
      }

      /* ---------- overlays (canvas coordinates) ---------- */
      #ov { position: absolute; inset: 0; pointer-events: none; }
      #ov svg.full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
      .card {
        position: absolute; border: 1.5px solid var(--card-line); border-radius: 18px;
        background: var(--card-fill); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        overflow: hidden; opacity: 0;
      }
      .caps {
        font-weight: 600; font-size: 18px; letter-spacing: 0.22em; line-height: 1; color: rgba(255,255,255,0.78);
      }
      .serif { font-family: "Playfair Display", serif; }
      .watch-card { display: flex; align-items: center; gap: 20px; padding: 20px 26px 20px 22px; }
      .watch-card svg { width: 70px; height: 96px; flex: none; overflow: visible; }
      .watch-card .name { font-family: "Playfair Display", serif; font-size: 54px; line-height: 1; margin-top: 10px; }
      .watch-card .age { font-size: 22px; font-weight: 500; line-height: 1; margin-top: 10px; color: rgba(255,255,255,0.86); }
      .glint {
        position: absolute; top: -20%; left: 0; width: 90px; height: 140%;
        background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(244,214,200,0.0) 20%, rgba(244,214,200,0.55) 50%, rgba(244,214,200,0) 80%);
        transform: translateX(-140px) skewX(-14deg);
      }
      .tag-label {
        position: absolute; font-weight: 600; font-size: 24px; letter-spacing: 0.24em; line-height: 1;
        opacity: 0;
