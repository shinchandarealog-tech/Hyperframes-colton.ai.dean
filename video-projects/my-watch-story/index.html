    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root {
        position: relative; width: 1080px; height: 1920px; overflow: hidden;
        background: #000; color: #fff;
        font-family: "Inter", sans-serif;
        font-variant-numeric: lining-nums; font-feature-settings: "lnum" 1;
        --rose: #e3ad97;
        --rose-glow: rgba(227, 173, 151, 0.55);
        --card-fill: rgba(12, 11, 12, 0.58);
        --card-line: rgba(255, 255, 255, 0.86);
      }

      /* ---------- the 16:9 shot ---------- */
      #shot { position: absolute; left: 0; top: 656px; width: 1080px; height: 608px; overflow: hidden; background: #000; }
      #cam { position: absolute; inset: 0; transform-origin: 50% 30%; }
      #cam video, #cam img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #grain {
        position: absolute; inset: -40px; opacity: 0; pointer-events: none; mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 1.6 -0.3'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
        background-size: 240px 240px;
      }
      /* real-3D layer over the shot */
      #gl { position: absolute; left: 0; top: 656px; width: 1080px; height: 608px; z-index: 5; pointer-events: none; }

      /* ---------- header ---------- */
      #header { position: absolute; left: 0; top: 250px; width: 1080px; display: flex; flex-direction: column; align-items: center; perspective: 900px; }
      #kicker { font-weight: 600; font-size: 26px; letter-spacing: 0.34em; padding-left: 0.34em; line-height: 1; }
      #h1 { margin-top: 26px; font-family: "Playfair Display", serif; font-weight: 700; font-size: 100px; line-height: 1; letter-spacing: -0.01em; }
      #h2 { position: relative; margin-top: 6px; font-family: "Playfair Display", serif; font-style: italic; font-weight: 400; font-size: 92px; line-height: 1.05; }
      .w { display: inline-block; }
      #h1 .w, #h2 .w { text-shadow: 0 2px 0 rgba(227,173,151,0.35), 0 4px 0 rgba(227,173,151,0.18), 0 10px 22px rgba(0,0,0,0.6); }
      #h2-under {
        position: absolute; left: 4px; right: 4px; bottom: -6px; height: 3px; background: var(--rose);
        border-radius: 2px; transform-origin: left center; box-shadow: 0 0 14px var(--rose-glow); transform: scaleX(0);
      }

      /* ---------- story timeline (perspective) ---------- */
      #track-wrap { position: absolute; left: 0; top: 540px; width: 1080px; height: 100px; perspective: 700px; }
      #track { position: absolute; left: 170px; top: 16px; width: 740px; height: 60px; transform-style: preserve-3d; }
      #track-base, #track-fill { position: absolute; left: 0; top: 8px; width: 740px; height: 2px; border-radius: 1px; transform-origin: left center; }
      #track-base { background: rgba(255, 255, 255, 0.3); }
      #track-fill { background: var(--rose); box-shadow: 0 0 10px var(--rose-glow); transform: scaleX(0); }
      .dot {
        position: absolute; top: -1px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.8); background: #000;
      }
      .dot-lit {
        position: absolute; inset: -2px; border-radius: 50%; opacity: 0;
        background: radial-gradient(circle at 35% 30%, #fff3ec 0%, #f0c4b2 22%, #e3ad97 48%, #9c6a58 82%, #5e3a2e 100%);
        box-shadow: 0 0 16px rgba(227,173,151,0.85), 0 3px 6px rgba(0,0,0,0.6);
      }
      .dot-halo { position: absolute; top: -1px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; border: 2px solid var(--rose); opacity: 0; }
      .dot-label {
        position: absolute; top: 32px; width: 200px; margin-left: -100px; text-align: center; font-weight: 600; font-size: 20px;
        letter-spacing: 0.2em; padding-left: 0.2em; line-height: 1; color: #fff; opacity: 0.45;
      }

      /* ---------- captions ---------- */
      #captions { position: absolute; left: 130px; top: 1294px; width: 820px; height: 230px; perspective: 900px; }
      .cap {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
        font-weight: 600; font-size: 60px; line-height: 1.16; letter-spacing: -0.01em; opacity: 0; transform-origin: 50% 80%;
      }
      .cap em { font-family: "Playfair Display", serif; font-style: italic; font-weight: 400; font-size: 68px; letter-spacing: 0; }

      /* ---------- overlays (canvas coordinates) ---------- */
      #ov { position: absolute; inset: 0; pointer-events: none; perspective: 1100px; }
      #ov svg.full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
      .card {
        position: absolute; border: 1.5px solid var(--card-line); border-radius: 18px; background: var(--card-fill);
        backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); overflow: hidden; opacity: 0;
        box-shadow: 0 18px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.18);
      }
      .caps { font-weight: 600; font-size: 18px; letter-spacing: 0.22em; line-height: 1; color: rgba(255,255,255,0.78); }
      .serif { font-family: "Playfair Display", serif; }
      .watch-card { display: flex; align-items: center; gap: 20px; padding: 20px 26px 20px 22px; }
      .slot { width: 70px; height: 96px; flex: none; }
      .watch-card .name { font-family: "Playfair Display", serif; font-size: 54px; line-height: 1; margin-top: 10px; }
      .watch-card .age { font-size: 22px; font-weight: 500; line-height: 1; margin-top: 10px; color: rgba(255,255,255,0.86); }
      .glint {
        position: absolute; top: -20%; left: 0; width: 90px; height: 140%;
        background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(244,214,200,0) 20%, rgba(244,214,200,0.55) 50%, rgba(244,214,200,0) 80%);
        transform: translateX(-140px) skewX(-14deg);
      }
      .tag-label { position: absolute; font-weight: 600; font-size: 24px; letter-spacing: 0.24em; line-height: 1; opacity: 0; }
      .cell { width: 34px; height: 34px; border: 1.2px solid rgba(255,255,255,0.4); border-radius: 6px; position: relative; }
    </style>
  </head>

          <svg viewBox="0 1.738 24 20.524" width="70" height="60" style="display:block; margin:0 auto;" aria-label="Argos">
            <path fill="#fff" d="M0 1.738v20.524h24V1.738zm5.93 5.546c.178 0 .434 0 .638.026.23 0 .307.077.333.281.051.792.23 4.217.256 4.907 0 .18-.103.23-.23.23H6.21c-.179 0-.256-.102-.256-.23 0-.255-.026-.92-.026-.92H3.987c-.204.358-.434.767-.537.946-.076.153-.178.179-.306.179h-.818c-.18 0-.23-.128-.153-.281C3.272 10.428 4.677 8.255 5.29 7.54c.178-.23.383-.23.638-.256zM5.831 8.48a.095.095 0 0 0-.03.032c-.46.562-1.048 1.483-1.38 2.122h1.507S5.88 9.15 5.853 8.51c0 0 0-.043-.021-.032zm14.666.237c.614 0 1.125.28 1.355.664.102.154.076.255-.077.332a3.512 3.512 0 0 1-.434.205c-.128.025-.23.025-.333-.102-.434-.512-1.047-.333-1.073-.051-.026.255.256.357.639.46.588.178 1.252.485 1.048 1.277-.205.818-.997 1.227-1.917 1.227-.588 0-1.253-.178-1.508-.792-.051-.128-.026-.23.077-.28.153-.103.307-.18.46-.231.128-.026.23 0 .306.102.18.256.384.384.716.384.307 0 .639-.129.613-.41-.025-.255-.408-.357-.613-.409-.383-.102-1.176-.28-1.176-.92 0-.792.741-1.38 1.917-1.456zm-3.834.076c1.227 0 1.79.818 1.534 1.994-.23 1.176-1.15 1.993-2.377 1.993-1.227 0-1.789-.817-1.533-1.993.255-1.176 1.15-1.994 2.376-1.994zm-4.421.026c.562 0 .869.332.945.46 0 .025.026.025.026 0 .025-.077.051-.128.051-.153.026-.128.128-.23.307-.23h.51c.154 0 .282.102.231.306a96.306 96.306 0 0 1-.741 3.067c-.384 1.482-1.15 2.224-2.3 2.224-.46 0-1.227-.128-1.56-.664-.076-.103-.102-.205.077-.333.154-.102.332-.153.486-.205.153-.05.204-.05.357.052a.906.906 0 0 0 .563.179c.409 0 .946-.23 1.201-1.1.026-.05 0-.05-.025-.025-.18.23-.563.383-.997.383-.537-.025-.869-.204-1.074-.536-.23-.358-.204-.997-.025-1.56.28-.894.971-1.865 1.968-1.865zm-3.86.026h.614c.127 0 .179.101.153.204-.025.102-.051.179-.051.204 0 .026.025.026.025.026.46-.41 1.049-.409 1.688-.409.102 0 .153.102.076.179-.23.23-.358.409-.511.639-.102.153-.18.204-.358.204-.409.026-.613.102-.767.205-.153.102-.307.434-.383.818a48.306 48.306 0 0 1-.332 1.61.224.224 0 0 1-.23.179h-.742c-.102 0-.178-.077-.153-.18.128-.715.64-3.117.716-3.475.026-.154.128-.204.256-.204zm8.205.792c-.69 0-.971.562-1.15 1.15-.154.588-.23 1.15.46 1.15.69 0 .97-.562 1.15-1.15.179-.588.23-1.15-.46-1.15zm-4.217.025c-.512-.025-.87.384-1.1 1.15-.127.41-.153 1.023.384 1.1.537.025.895-.358 1.099-1.1.128-.485.256-1.124-.383-1.15zM2.338 13.958a.32.32 0 0 1 .09.023c3.68 1.508 6.058 2.07 9.406 2.07 3.348 0 5.725-.562 9.43-2.07.256-.102.41.153.155.306-1.457.92-4.805 2.812-9.585 2.812-4.78 0-8.153-1.892-9.56-2.812-.223-.134-.133-.346.064-.329z"/>
          </svg>
          <div class="serif" style="font-style:italic; font-size:34px; line-height:1; margin-top:10px;">London</div>

        <!-- B05 saving-up card -->

    <script>
      (function () {
        const FPS = 60;
        const DUR = 35.8;
        const tl = gsap.timeline({ paused: true });
        const $ = (s) => document.querySelector(s);
        const $$ = (s) => Array.from(document.querySelectorAll(s));
        const snap = (t) => Math.round(t * FPS) / FPS;
        const F = (n) => n / FPS;
        const at = (t) => snap(t);
        const P3 = { transformPerspective: 900 };

        /* ===== generated DOM ===== */
        const cal = $("#cal");
        for (let i = 0; i < 14; i++) {
          const c = document.createElement("div");
          c.className = "cell";
          c.innerHTML = '<svg class="x" viewBox="0 0 34 34" style="position:absolute;inset:0;opacity:0"><path d="M10 10 L24 24 M24 10 L10 24" stroke="#e3ad97" stroke-width="3" stroke-linecap="round"/></svg>';
          cal.appendChild(c);
        }
        const TICK0 = 16.80, TICK_STEP = 0.10;
        const ticks = $("#ticks");
        for (let i = 0; i < 14; i++) {
          const au = document.createElement("audio");
          au.id = "sfx-tick" + i;
          au.src = "assets/tick.wav";
          au.setAttribute("data-start", (TICK0 + i * TICK_STEP).toFixed(3));
          au.setAttribute("data-duration", "0.08");
          au.setAttribute("data-track-index", String(10 + i));
          au.setAttribute("data-volume", "0.42");
          ticks.appendChild(au);
        }
        const CAPS = [
          [0.03, 0.94, "I don’t go <em>anywhere</em>"],
          [0.94, 2.43, "without a <em>watch</em>."],
          [2.43, 3.38, "Even if I’m going <em>abroad</em>"],
          [3.38, 4.98, "literally for a few <em>days</em>,"],
          [4.98, 6.72, "I’m bringing a <em>watch roll</em> with me."],
          [6.72, 7.50, "<em>Watches</em> are something"],
          [7.50, 8.90, "I’ve been <em>infatuated</em> with"],
          [8.90, 10.85, "from the time I was <em>eight</em> years old,"],
          [10.85, 12.77, "when I bought my first <em>Timex</em>."],
          [12.82, 13.65, "From <em>£15</em>,"],
          [13.65, 14.55, "I <em>remember</em> I got it"],
          [14.55, 16.60, "from <em>Argos</em> here in London."],
          [16.65, 18.35, "Saved up for a couple of <em>weeks</em> for it."],
          [18.37, 19.39, "And my watch collecting <em>journey</em>"],
          [19.39, 20.70, "really started when I was <em>18</em>"],
          [20.70, 22.10, "and I bought my first <em>Rolex</em>."],
          [22.13, 22.90, "So, at this <em>point</em>,"],
          [22.90, 24.93, "I’ve <em>probably</em> owned"],
          [24.93, 26.20, "<em>50 plus</em> watches."],
          [26.74, 27.72, "On the <em>wrist</em> at the moment"],
          [27.72, 29.20, "is my <em>favorite</em> piece ever,"],
          [29.20, 30.40, "the <em>Patek Philippe</em>"],
          [30.40, 32.20, "Nautilus <em>5711R</em>."],
          [32.95, 33.95, "If I had to have <em>one watch</em>"],
          [33.95, 34.62, "for the rest of my <em>life</em>,"],
          [34.62, DUR, "it would be <em>this</em>."],
        ];
        const capWrap = $("#captions");
        const capEls = CAPS.map((c, i) => {
          const el = document.createElement("div");
          el.className = "cap"; el.id = "cap" + i;
          el.innerHTML = "<span>" + c[2] + "</span>";
          capWrap.appendChild(el);
          return el;
        });

        /* ===== camera ===== */
        const cam = $("#cam");
        tl.fromTo(cam, { scale: 1 }, { scale: 1.08, duration: 2.333, ease: "sine.inOut" }, 0);
        tl.set(cam, { scale: 1 }, at(2.333));
        // B08 125% punch, top-anchored so the burned-in lower third (source y >= 900, 28.0–32.55 s) stays out of frame
        tl.set(cam, { transformOrigin: "0% 0%" }, at(27.0));
        tl.to(cam, { scale: 1.25, duration: F(12), ease: "power2.out" }, at(27.2));
        tl.to(cam, { scale: 1, duration: F(18), ease: "power2.inOut" }, at(32.6));
        tl.set(cam, { transformOrigin: "50% 68%", scale: 1.35 }, at(34.9));

        const grain = $("#grain");
        tl.to(grain, { opacity: 0.22, duration: F(12), ease: "power1.out" }, at(6.75));
        tl.fromTo(grain, { x: 0, y: 0 }, { x: 37 * 24, y: 23 * 24, duration: 6.0, ease: "steps(144)" }, at(6.75));
        tl.set(grain, { opacity: 0 }, at(12.767));

        /* ===== header: words flip up in 3D ===== */
        tl.from("#kicker .w", { opacity: 0, rotationX: -85, y: 10, transformOrigin: "50% 100%", duration: F(12), ease: "power2.out", stagger: 0.09 }, at(0.12));
        tl.from("#h1 .w", { opacity: 0, rotationX: -88, z: -120, y: 20, transformOrigin: "50% 100%", duration: F(14), ease: "power3.out", stagger: 0.12 }, at(0.55));
        tl.from("#h2 .w", { opacity: 0, rotationX: -88, z: -120, y: 20, transformOrigin: "50% 100%", duration: F(14), ease: "expo.out", stagger: 0.12 }, at(1.0));
        // slow 3D drift so the header never sits flat
        tl.fromTo("#header", { rotationX: 6, rotationY: -4, transformPerspective: 1400 }, { rotationX: -3, rotationY: 4, duration: DUR, ease: "sine.inOut" }, 0);

        /* ===== story timeline: stands up from flat ===== */
        tl.from("#track", { rotationX: 78, y: 18, opacity: 0, duration: F(24), ease: "power3.out" }, at(0.8));
        tl.from("#track-base", { scaleX: 0, duration: 0.9, ease: "power2.out" }, at(0.85));
        [0, 1, 2, 3].forEach((i) => {
          const t = 0.85 + [0, 0.16, 0.36, 0.62][i];
          tl.from("#dot" + i, { opacity: 0, scale: 0.4, rotationY: 90, duration: F(12), ease: "power2.out" }, at(t));
          tl.from("#lab" + i, { opacity: 0, y: 8, rotationX: -70, duration: F(12), ease: "power2.out" }, at(t + 0.05));
        });
        const FILL = [0, 1 / 3, 2 / 3, 1];
        function lightDot(i, t) {
          if (i > 0) tl.to("#track-fill", { scaleX: FILL[i], duration: 0.33, ease: "power2.inOut" }, at(t - 0.3));
          tl.to("#lit" + i, { opacity: 1, duration: F(10), ease: "power2.out" }, at(t));
          tl.fromTo("#dot" + i, { rotationY: 0 }, { rotationY: 360, duration: F(24), ease: "power3.out", immediateRender: false }, at(t));
          tl.to("#dot" + i, { borderColor: "#e3ad97", duration: F(10) }, at(t));
          tl.to("#lab" + i, { opacity: 1, duration: F(10), ease: "power2.out" }, at(t));
          tl.fromTo("#halo" + i, { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 2.6, duration: 0.6, ease: "power2.out", immediateRender: false }, at(t));
        }
        lightDot(0, 9.95);
        lightDot(1, 20.32);
        lightDot(2, 24.96);
        lightDot(3, 33.42);
        tl.to("#h2-under", { scaleX: 1, duration: F(14), ease: "power2.out" }, at(33.52));

        /* ===== captions: flip up in 3D ===== */
        CAPS.forEach((c, i) => {
          const el = capEls[i];
          tl.fromTo(el, { opacity: 0, y: 18, rotationX: -40, scale: 0.92, transformPerspective: 1600 },
            { opacity: 1, y: 0, rotationX: 0, scale: 1, duration: F(11), ease: "power2.out" }, at(c[0]));
          if (i === 22) tl.to(el, { opacity: 0, y: -8, rotationX: 40, duration: F(15), ease: "power1.in" }, at(32.2));
          else if (i < CAPS.length - 1) tl.set(el, { opacity: 0 }, at(c[1]));
        });

        /* ===== B02 labels (plane, trail and ring are 3D) ===== */
        tl.fromTo("#lbl-abroad", { opacity: 0, x: -16, rotationY: -60, ...P3 }, { opacity: 1, x: 0, rotationY: 0, duration: F(12), ease: "power3.out" }, at(3.2));
        tl.to("#lbl-abroad", { opacity: 0, duration: F(14), ease: "power1.inOut" }, at(5.2));
        // the one bounce: WATCH ROLL label pops with overshoot
        tl.fromTo("#lbl-roll", { opacity: 0, scale: 0.6, rotationX: -70, transformOrigin: "50% 100%", ...P3 },
          { opacity: 1, scale: 1, rotationX: 0, duration: F(16), ease: "back.out(2.6)" }, at(5.66));
        tl.to("#lbl-roll", { opacity: 0, duration: F(14), ease: "power1.inOut" }, at(6.62));

        /* ===== cards swing in on a 3D hinge ===== */
        function cardIn(sel, t, fromLeft) {
          tl.fromTo(sel, { opacity: 0, x: fromLeft ? -70 : 70, rotationY: fromLeft ? -78 : 78, z: -60, transformOrigin: fromLeft ? "0% 50%" : "100% 50%", ...P3 },
            { opacity: 1, x: 0, rotationY: 0, z: 0, duration: F(14), ease: "power3.out" }, at(t));
        }
        cardIn("#card-timex", 11.82, true);
        tl.set("#card-timex", { opacity: 0 }, at(12.767));

        /* ===== B04 Argos label ===== */
        tl.fromTo("#pin-text", { opacity: 0, y: 12, rotationX: -70, ...P3 }, { opacity: 1, y: 0, rotationX: 0, duration: F(12), ease: "power3.out" }, at(14.86));
        tl.to("#pin-text", { opacity: 0, duration: F(10), ease: "power1.in" }, at(16.32));

        /* ===== B05 saving-up card, cells flip like calendar pages ===== */
        cardIn("#card-save", 16.5, true);
        $$("#cal .cell").forEach((c, i) => {
          const t = TICK0 + i * TICK_STEP;
          tl.fromTo(c, { rotationX: 0 }, { rotationX: 360, duration: F(9), ease: "power2.out", immediateRender: false }, at(t - F(3)));
          tl.to(c, { borderColor: "rgba(227,173,151,0.9)", duration: F(4) }, at(t));
        });
        $$("#cal .x").forEach((x, i) => {
          tl.fromTo(x, { opacity: 0, scale: 1.8, transformOrigin: "50% 50%" },
            { opacity: 1, scale: 1, duration: F(5), ease: "power2.out" }, at(TICK0 + i * TICK_STEP));
        });
        tl.to("#card-save", { opacity: 0, x: -30, rotationY: -40, duration: F(14), ease: "power2.in" }, at(19.7));

        /* ===== B06 Rolex card ===== */
        cardIn("#card-rolex", 21.27, false);
        tl.fromTo("#rolex-glint", { x: -140 }, { x: 460, duration: 0.5, ease: "power1.inOut" }, at(21.55));
        tl.set("#card-rolex", { opacity: 0 }, at(22.133));

        /* ===== B08 the Patek ===== */
        tl.to("#fav-line", { attr: { "stroke-dashoffset": 0 }, duration: F(16), ease: "power2.out" }, at(27.86));
        tl.fromTo("#fav-text", { opacity: 0, x: -14, rotationY: -50, ...P3 }, { opacity: 1, x: 0, rotationY: 0, duration: F(12), ease: "power3.out" }, at(27.92));
        cardIn("#card-patek", 29.38, true);
        tl.fromTo("#pk-photo", { rotationY: -180, ...P3 }, { rotationY: 0, duration: F(20), ease: "power3.out" }, at(29.42));
        tl.fromTo("#pk-1", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: F(12), ease: "power2.out" }, at(29.42));
        tl.fromTo("#pk-2", { opacity: 0, y: 16, rotationX: -70, ...P3 }, { opacity: 1, y: 0, rotationX: 0, duration: F(12), ease: "expo.out" }, at(30.42));
        tl.fromTo("#pk-3", { opacity: 0, y: 12, rotationX: -70, ...P3 }, { opacity: 1, y: 0, rotationX: 0, duration: F(12), ease: "power3.out" }, at(30.98));
        tl.to(["#card-patek", "#fav-text", "#fav-line"], { opacity: 0, duration: F(18), ease: "power1.in" }, at(32.2));

        /* ===== B09 ===== */
        tl.fromTo("#one-label", { opacity: 0, y: 10, rotationX: -70, ...P3 }, { opacity: 1, y: 0, rotationX: 0, duration: F(12), ease: "power3.out" }, at(33.5));
        tl.set("#glint-g", { attr: { transform: "translate(548 1040) scale(0.2) rotate(-20)" } }, at(34.9));
        tl.to("#glint-g", { opacity: 1, duration: F(5), ease: "power2.out" }, at(34.92));
        tl.to("#glint-g", { attr: { transform: "translate(548 1040) scale(1) rotate(0)" }, duration: F(14), ease: "power2.out" }, at(34.92));
        tl.to("#glint-g", { opacity: 0, attr: { transform: "translate(548 1040) scale(0.6) rotate(15)" }, duration: F(14), ease: "power2.in" }, at(35.16));

        tl.to({}, { duration: DUR }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
    <script src="assets/scene3d.js"></script>
  </body>
