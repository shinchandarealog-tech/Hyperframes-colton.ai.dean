<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Generated by scripts/build.py from scripts/template.html — edit those, not this file. -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Anton"; src: url("assets/fonts/anton.woff2") format("woff2"); font-weight: 400; }
      /* Palette from the DAV winter-uniform posters + NS Brothers shop sign */
      :root {
        --navy: #12205a;
        --navy-deep: #0a1236;
        --red: #e3262b;
        --yellow: #ffd60a;
        --sky: #a9d2f5;
        --white: #ffffff;
        --font-display: "Anton", sans-serif;
        --font-body: "Poppins", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--navy-deep); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--navy-deep); font-family: var(--font-body); }

      .scene { position: absolute; inset: 0; overflow: hidden; }
      .kb, .crop { position: absolute; inset: 0; }
      .crop.tour { transform: scale(1.42); transform-origin: 50% 51%; }
      .scene video { width: 100%; height: 100%; object-fit: cover; display: block; }
      .shade { position: absolute; inset: 0;
        background: radial-gradient(ellipse 120% 70% at 50% 45%, rgba(0,0,0,0) 55%, rgba(5,10,35,0.55) 100%); }

      .tag { position: absolute; top: 230px; left: 60px; padding: 14px 30px; background: var(--red);
        color: var(--white); font-family: var(--font-display); font-size: 58px; letter-spacing: 2px;
        border-left: 14px solid var(--yellow); box-shadow: 0 12px 40px rgba(0,0,0,0.35); }

      /* Poster scenes */
      .poster { position: absolute; inset: 0; background: var(--navy-deep); }
      .poster-bg { position: absolute; inset: -80px; width: calc(100% + 160px); height: calc(100% + 160px);
        object-fit: cover; filter: blur(40px) brightness(0.45) saturate(1.2); }
      .poster-content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
        padding: 170px 60px 0; gap: 36px; }
      .pill { padding: 12px 34px; border-radius: 999px; font-family: var(--font-display); font-size: 44px; letter-spacing: 3px; }
      .pill.school { background: var(--yellow); color: var(--red); }
      .card { background: var(--white); padding: 14px; border-radius: 22px; box-shadow: 0 30px 80px rgba(0,0,0,0.5); }
      .card img { display: block; max-width: 900px; max-height: 960px; border-radius: 12px; }
      #pc-nurkids img, #pc-smart img { height: 820px; }
      #pc-seniors img { height: 800px; }
      #pc-davjacket img { width: 900px; }
      .poster-label { display: flex; flex-direction: column; align-items: center; gap: 6px; }
      .poster-label .cls { background: var(--red); color: var(--white); font-family: var(--font-display);
        font-size: 66px; padding: 6px 34px; letter-spacing: 2px; }
      .poster-label .sub { color: var(--yellow); font-family: var(--font-display); font-size: 48px; letter-spacing: 4px; }

      /* Opener title */
      .title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
        padding-top: 200px; gap: 18px;
        background: linear-gradient(180deg, rgba(5,10,35,0.65) 0%, rgba(5,10,35,0) 38%); }
      .t-ns { font-family: var(--font-display); font-size: 150px; color: var(--yellow); letter-spacing: 3px;
        text-shadow: 0 8px 0 var(--red), 0 18px 50px rgba(0,0,0,0.6); line-height: 1; }
      .t-sd { font-family: var(--font-body); font-weight: 800; font-size: 44px; color: var(--white); letter-spacing: 8px;
        text-shadow: 0 4px 20px rgba(0,0,0,0.7); }
      .t-dav { margin-top: 20px; background: var(--red); color: var(--white); font-family: var(--font-display);
        font-size: 68px; padding: 10px 40px; letter-spacing: 2px; border-bottom: 10px solid var(--yellow); }

      /* Graphic scenes */
      .graphic { position: absolute; inset: 0; background: radial-gradient(ellipse 90% 60% at 50% 45%, #1d3184 0%, var(--navy-deep) 75%); }
      .onestop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 0 60px 200px; }
      .os-line { font-family: var(--font-display); font-size: 220px; line-height: 1; color: var(--white); letter-spacing: 4px; }
      .os-line.yellow { color: var(--yellow); text-shadow: 0 10px 0 var(--red); }
      .os-sub { margin-top: 40px; font-weight: 700; font-size: 44px; color: var(--sky); }

      .addr-content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
        padding: 230px 70px 0; }
      .visit { margin-top: 20px; font-weight: 800; font-size: 50px; letter-spacing: 14px; color: var(--sky); }
      .brand { font-family: var(--font-display); font-size: 120px; color: var(--white); letter-spacing: 3px; line-height: 1.1; }
      .city { font-family: var(--font-display); font-size: 260px; line-height: 1; color: var(--yellow); text-shadow: 0 10px 0 var(--red); }
      .addr-lines { margin-top: 60px; display: flex; flex-direction: column; gap: 22px; align-self: stretch; padding: 0 40px; }
      .addr-line { display: flex; align-items: center; gap: 24px; font-weight: 700; font-size: 52px; color: var(--white); }
      .dot { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 6px rgba(227,38,43,0.3); }

      .ph-content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
        padding: 330px 60px 0; }
      .ph-brand { font-family: var(--font-display); font-size: 230px; line-height: 0.95; color: var(--white); letter-spacing: 4px; }
      #ph-ns { color: var(--yellow); text-shadow: 0 10px 0 var(--red); }
      .ph-call { margin-top: 70px; font-weight: 800; font-size: 44px; letter-spacing: 12px; color: var(--sky); }
      .ph-num { margin-top: 26px; background: var(--white); color: var(--navy); font-weight: 800; font-size: 76px;
        padding: 12px 46px; border-radius: 999px; font-variant-numeric: tabular-nums; }
      .ph-sd { margin-top: 70px; background: var(--red); color: var(--yellow); font-family: var(--font-display);
        font-size: 92px; padding: 8px 56px; letter-spacing: 6px; }
      .ph-addr { margin-top: 24px; font-weight: 600; font-size: 40px; color: var(--sky); }

      /* Captions + item labels */
      .caption { position: absolute; left: 0; right: 0; bottom: 330px; display: flex; justify-content: center; padding: 0 70px; z-index: 200; }
      .cap-box { display: inline-block; max-width: 940px; text-align: center; background: rgba(10,18,54,0.88);
        color: var(--white); font-weight: 800; font-size: 58px; line-height: 1.22; padding: 18px 34px; border-radius: 20px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.4); }
      .cap-box .hl { color: var(--yellow); }
      .item { position: absolute; left: 0; right: 0; bottom: 360px; display: flex; justify-content: center; z-index: 210; }
      .item-box { font-family: var(--font-display); font-size: 130px; color: var(--yellow); background: var(--red);
        padding: 6px 46px; letter-spacing: 3px; transform: rotate(-3deg); box-shadow: 0 16px 50px rgba(0,0,0,0.45);
        border-bottom: 12px solid var(--yellow); }

      #flash { position: absolute; inset: 0; background: var(--white); opacity: 0; z-index: 300; pointer-events: none; }
      #fade { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 310; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="1080" data-height="1920">
      {{SCENES}}
      {{TITLE}}
      {{CAPTIONS}}
      {{ITEMS}}
      <div id="flash"></div>
      <div id="fade"></div>
      <audio id="vo" src="assets/voiceover.mp3" data-start="0" data-duration="58" data-track-index="30" data-volume="1"></audio>
      <audio id="music" src="assets/music.mp3" data-start="0" data-duration="{{DURATION}}" data-track-index="31" data-volume="0.12"></audio>
      {{AUDIO}}
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      {{TIMELINE}}
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
