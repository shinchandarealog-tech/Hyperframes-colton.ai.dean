<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Generated by scripts/build.py from scripts/template.html — edit those, not this file. -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Apple-UI look: navy brand ground, frosted glass, iOS blue/green accents */
      :root {
        --navy: #12205a;
        --navy-deep: #0a1236;
        --sky: #a9d2f5;
        --ios-blue: #0a84ff;
        --ios-green: #30d158;
        --white: #ffffff;
        --label-2: rgba(255,255,255,0.72);
        --glass: rgba(28,32,48,0.42);
        --glass-border: rgba(255,255,255,0.22);
        --font-ui: "Inter", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--navy-deep); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--navy-deep);
        font-family: var(--font-ui); -webkit-font-smoothing: antialiased; }

      .glass { background: var(--glass); backdrop-filter: blur(30px) saturate(1.7); -webkit-backdrop-filter: blur(30px) saturate(1.7);
        border: 1.5px solid var(--glass-border); box-shadow: 0 20px 60px rgba(0,0,0,0.28); }
      /* Lighter glass without backdrop blur, for the many small pills (keeps capture cost down) */
      .glass-lite { background: rgba(22,28,52,0.58); border: 1.5px solid rgba(255,255,255,0.2); box-shadow: 0 16px 44px rgba(0,0,0,0.25); }

      .scene { position: absolute; inset: 0; overflow: hidden; }
      .kb, .crop { position: absolute; inset: 0; }
      .crop.tour { transform: scale(1.42); transform-origin: 50% 51%; }
      .scene video { width: 100%; height: 100%; object-fit: cover; display: block; }
      .photo { position: absolute; inset: 0; background: var(--navy-deep); }
      .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%; display: block; }
      .shade { position: absolute; inset: 0; box-shadow: inset 0 -420px 260px -160px rgba(5,8,25,0.55), inset 0 260px 200px -160px rgba(5,8,25,0.35); }

      /* Glass tag, top-left */
      .tag { position: absolute; top: 220px; left: 56px; display: flex; align-items: center; gap: 16px; padding: 16px 32px 16px 24px;
        border-radius: 999px; color: var(--white); font-weight: 600; font-size: 42px; letter-spacing: -0.5px; }
      .tag .tdot { width: 18px; height: 18px; border-radius: 50%; background: var(--ios-blue); box-shadow: 0 0 0 6px rgba(10,132,255,0.25); }

      /* Poster scenes: widget-style card */
      .poster { position: absolute; inset: 0; background: var(--navy-deep); }
      .poster-bg { position: absolute; inset: -80px; width: calc(100% + 160px); height: calc(100% + 160px);
        object-fit: cover; filter: blur(40px) brightness(0.42) saturate(1.2); }
      .poster-content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
        padding: 160px 60px 0; gap: 34px; }
      .pill { padding: 12px 30px; border-radius: 999px; font-weight: 600; font-size: 32px; letter-spacing: 3px; color: var(--white); }
      .card { background: var(--white); padding: 12px; border-radius: 48px; box-shadow: 0 40px 90px rgba(0,0,0,0.45); }
      .card img { display: block; max-width: 900px; max-height: 960px; border-radius: 38px; }
      #pc-seniors img, #pc-juniors img, #pc-nurkids img { height: 800px; }
      #pc-uniformset img { height: 640px; }
      #pc-sweaters img { width: 900px; }
      .poster-label { display: flex; flex-direction: column; align-items: center; gap: 6px; }
      .poster-label .cls { color: var(--white); font-weight: 800; font-size: 72px; letter-spacing: -2px; }
      .poster-label .sub { color: var(--sky); font-weight: 600; font-size: 34px; letter-spacing: 4px; }

      /* iOS notification (opener) */
      .notif { position: absolute; top: 270px; left: 40px; right: 40px; display: flex; gap: 28px; align-items: center;
        padding: 30px 34px; border-radius: 52px; z-index: 215; }
      .app-icon { flex: none; width: 112px; height: 112px; border-radius: 26px; background: #fff;
        display: flex; align-items: center; justify-content: center; color: var(--white); font-weight: 800; font-size: 46px; letter-spacing: -1px;
        border: 1.5px solid rgba(255,255,255,0.25); }
      .nf-text { flex: 1; display: flex; flex-direction: column; gap: 6px; }
      .nf-top { display: flex; justify-content: space-between; align-items: baseline; }
      .nf-app { font-weight: 700; font-size: 40px; color: var(--white); }
      .nf-time { font-weight: 500; font-size: 32px; color: var(--label-2); }
      .nf-body { font-weight: 500; font-size: 38px; line-height: 1.25; color: var(--white); }
      .hero { position: absolute; left: 0; right: 0; top: 430px; text-align: center; z-index: 214; color: var(--white);
        font-weight: 800; font-size: 120px; letter-spacing: -4px; line-height: 1; text-shadow: 0 10px 40px rgba(0,0,0,0.45); }
      .hero span { color: var(--sky); }

      /* Captions: frosted glass pill */
      .caption { position: absolute; left: 0; right: 0; bottom: 320px; display: flex; justify-content: center; padding: 0 60px; z-index: 200; }
      .cap-box { display: inline-block; max-width: 960px; text-align: center; color: var(--white); font-weight: 600; font-size: 52px;
        line-height: 1.3; letter-spacing: -0.5px; padding: 22px 40px; border-radius: 40px; }
      .cap-box .hl { color: var(--sky); font-weight: 700; }

      /* Item widget */
      .item { position: absolute; left: 0; right: 0; bottom: 320px; display: flex; justify-content: center; z-index: 210; }
      .item-box { display: flex; align-items: center; gap: 28px; padding: 26px 44px 26px 28px; border-radius: 44px; }
      .item-icon { width: 92px; height: 92px; border-radius: 24px; background: var(--ios-blue); display: flex; align-items: center; justify-content: center; }
      .item-txt { display: flex; flex-direction: column; gap: 4px; }
      .item-title { font-weight: 800; font-size: 60px; letter-spacing: -1.5px; color: var(--white); }
      .item-sub { font-weight: 500; font-size: 34px; color: var(--label-2); }

      /* Reminders-style checklist */
      .checklist { position: absolute; left: 90px; right: 90px; bottom: 250px; padding: 34px 44px 22px; border-radius: 52px; z-index: 205; }
      .cl-head { font-weight: 800; font-size: 46px; letter-spacing: -1px; color: var(--white); margin-bottom: 10px; }
      .cl-row { display: flex; align-items: center; gap: 28px; padding: 14px 0; border-top: 1.5px solid rgba(255,255,255,0.12); }
      .cl-row:first-of-type { border-top: none; }
      .cl-circle { position: relative; width: 52px; height: 52px; flex: none; border-radius: 50%; border: 3px solid rgba(255,255,255,0.55); }
      .cl-fill { position: absolute; inset: -3px; border-radius: 50%; background: var(--ios-blue); display: flex; align-items: center; justify-content: center; }
      .cl-label { font-weight: 600; font-size: 46px; color: var(--white); letter-spacing: -0.5px; }
      #chips-recap { top: 50%; bottom: auto; transform: translateY(-50%); }
      #chips-recap .cl-head { font-size: 84px; letter-spacing: -3px; margin-bottom: 16px; }
      #chips-recap .cl-label { font-size: 54px; }
      .dim { position: absolute; inset: 0; background: rgba(6,10,30,0.4); }

      /* Keynote-style text card (no footage) */
      .crop.blurred { filter: blur(26px) brightness(0.5) saturate(1.3); }
      .textcard { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 0 60px 120px; }
      .tc-kicker { font-weight: 700; font-size: 40px; letter-spacing: 12px; color: var(--sky); }
      .tc-head, .keynote { font-weight: 800; letter-spacing: -6px; line-height: 1; text-align: center;
        background: linear-gradient(180deg, #ffffff 30%, #a9d2f5 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .tc-head { font-size: 170px; padding-bottom: 12px; }
      .tc-sub { font-weight: 500; font-size: 42px; color: var(--label-2); }

      /* Graphic grounds */
      .graphic { position: absolute; inset: 0; background: linear-gradient(170deg, #17286e 0%, #0a1236 55%, #070c26 100%); }

      /* Apple Maps-style address */
      .maps { position: absolute; inset: 0; background: #1b2133; }
      .maps svg.streets { position: absolute; inset: 0; }
      .pin-wrap { position: absolute; left: 540px; top: 640px; width: 0; height: 0; }
      .pulse { position: absolute; left: -110px; top: -110px; width: 220px; height: 220px; border-radius: 50%; background: rgba(10,132,255,0.28); }
      #pin { position: absolute; left: -70px; top: -190px; }
      .map-label { position: absolute; left: 0; right: 0; top: 700px; text-align: center; font-weight: 700; font-size: 40px; color: var(--white);
        text-shadow: 0 2px 10px rgba(0,0,0,0.6); }
      .sheet { position: absolute; left: 30px; right: 30px; bottom: 60px; padding: 26px 50px 50px; border-radius: 56px;
        background: rgba(30,34,50,0.78); backdrop-filter: blur(30px) saturate(1.6); -webkit-backdrop-filter: blur(30px) saturate(1.6);
        border: 1.5px solid rgba(255,255,255,0.14); }
      .grabber { width: 90px; height: 10px; border-radius: 5px; background: rgba(255,255,255,0.35); margin: 0 auto 30px; }
      .sh-title { font-weight: 800; font-size: 76px; letter-spacing: -2.5px; color: var(--white); }
      .sh-sub { font-weight: 500; font-size: 38px; color: var(--label-2); margin-top: 4px; }
      .addr-lines { margin-top: 30px; display: flex; flex-direction: column; gap: 18px; }
      .addr-line { display: flex; align-items: center; gap: 22px; font-weight: 600; font-size: 46px; color: var(--white); }
      .dot { flex: none; width: 16px; height: 16px; border-radius: 50%; background: var(--ios-blue); }
      .directions { margin-top: 40px; height: 120px; border-radius: 30px; background: var(--ios-blue); color: var(--white);
        display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 46px; }

      /* iPhone call screen */
      .call { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 200px 60px 0; }
      .call-info { font-weight: 600; font-size: 36px; letter-spacing: 6px; color: var(--sky); text-transform: uppercase; }
      .avatar { margin-top: 70px; width: 260px; height: 260px; border-radius: 50%; background: #fff;
        display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 110px; color: var(--white); }
      .call-name { margin-top: 40px; font-weight: 700; font-size: 92px; letter-spacing: -3px; color: var(--white); }
      .call-sub { font-weight: 500; font-size: 40px; color: var(--label-2); margin-top: 6px; }
      .num-list { margin-top: 70px; align-self: stretch; padding: 10px 44px; border-radius: 48px; }
      .num-row { display: flex; justify-content: space-between; align-items: center; padding: 28px 0; }
      .num-row + .num-row { border-top: 1.5px solid rgba(255,255,255,0.14); }
      .num-k { font-weight: 500; font-size: 36px; color: var(--label-2); }
      .num-v { font-weight: 700; font-size: 62px; letter-spacing: -1px; color: var(--white); font-variant-numeric: tabular-nums; }
      .call-btns { margin-top: 90px; display: flex; gap: 120px; }
      .cbtn { position: relative; width: 180px; height: 180px; }
      .cbtn .ring { position: absolute; inset: 0; border-radius: 50%; background: rgba(48,209,88,0.35); }
      .cbtn .face { position: absolute; inset: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
      .cbtn.msg .face { background: rgba(255,255,255,0.18); }
      .cbtn.dial .face { background: var(--ios-green); }
      .cbtn-label { margin-top: 18px; text-align: center; font-weight: 500; font-size: 34px; color: var(--white); }

      /* Keynote outro */
      .outro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 60px 160px; }
      .keynote { font-size: 190px; padding-bottom: 14px; }
      .br-words { margin-top: 50px; display: flex; gap: 30px; font-weight: 700; font-size: 78px; letter-spacing: -2px; color: var(--white); }
      .br-words .bw:nth-child(2) { color: var(--sky); }
      .br-meta { margin-top: 70px; font-weight: 500; font-size: 38px; color: var(--label-2); }

      /* Persistent brand logo, top-right */
      #logo { position: absolute; top: 56px; right: 48px; width: 170px; height: 170px; border-radius: 50%; z-index: 250;
        box-shadow: 0 10px 30px rgba(0,0,0,0.35), 0 0 0 4px rgba(255,255,255,0.85); }
      .app-icon img, .avatar img { width: 100%; height: 100%; border-radius: inherit; display: block; }
      #flash { position: absolute; inset: 0; background: var(--white); opacity: 0; z-index: 300; pointer-events: none; }
      #fade { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 310; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="1080" data-height="1920">
      {{SCENES}}
      {{TITLE}}
      {{CAPTIONS}}
      {{ITEMS}}
      <img id="logo" class="clip" src="assets/logo.png" alt="" data-start="0" data-duration="{{DURATION}}" data-track-index="26">
      <div id="flash"></div>
      <div id="fade"></div>
      <audio id="vo" src="assets/voiceover.mp3" data-start="0" data-duration="{{VO_DURATION}}" data-track-index="30" data-volume="1"></audio>
      <audio id="music" src="assets/music.mp3" data-start="0" data-duration="{{DURATION}}" data-track-index="31" data-volume="0.12"></audio>
      {{AUDIO}}
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      {{TIMELINE}}
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
