<!doctype html>
<html><head><meta charset="utf-8"><style>
  @font-face { font-family: Inter; font-weight: 600; src: url(../overlay/fonts/inter-latin-600-normal.woff2); }
  @font-face { font-family: Inter; font-weight: 800; src: url(../overlay/fonts/inter-latin-800-normal.woff2); }
  html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; }
  body.bg { background: #e9e9e7; }
  body.top { background: transparent; }
  .pill { position: absolute; transform: translateX(-50%); padding: 12px 26px; border-radius: 999px; font: 600 28px/1 Inter, sans-serif;
          letter-spacing: .01em; white-space: nowrap; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
  .raw { background: #fff; color: #1a1a1a; }
  .fin { background: #111; color: #fff; }
  .cta { position: absolute; left: 50%; transform: translateX(-50%); bottom: 54px; padding: 26px 44px; border-radius: 28px; background: #111;
         color: #fff; font: 800 44px/1.1 Inter, sans-serif; white-space: nowrap; letter-spacing: -0.01em; }
  .cta b { color: #F6E6A0; }
</style></head>
<body class="bg">
<div id="top" style="display:none">
  <div class="pill raw" style="left:230px; top:287px">Raw footage</div>
  <div class="pill fin" style="left:735px; top:58px">Final edit</div>
</div>
<div id="cta" class="cta">Want edits like this? DM me <b>EDIT</b></div>
<script>
  if (location.hash === '#top') { document.body.className = 'top'; document.getElementById('top').style.display = 'block'; document.getElementById('cta').style.display = 'none'; }
  else if (location.hash === '#bg') { }
  window.__ready = document.fonts.ready.then(() => true);
</script>
</body></html>
