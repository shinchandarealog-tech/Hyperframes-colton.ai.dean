<!doctype html>
<html lang="en" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Burgundy style sample</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face { font-family: "Fraunces"; font-style: normal; font-weight: 100 900; src: url("assets/fonts/Fraunces-VF.woff2") format("woff2"); }
@font-face { font-family: "Fraunces"; font-style: italic; font-weight: 100 900; src: url("assets/fonts/Fraunces-Italic-VF.woff2") format("woff2"); }
@font-face { font-family: "DM Sans"; font-style: normal; font-weight: 100 1000; src: url("assets/fonts/DMSans-Variable.woff2") format("woff2"); }

:root {
  --burgundy: #5E202B;
  --burgundy-deep: #44151E;
  --blush: #FDC5F4;
  --cream: #F3EAE3;
  --moss: #3D451E;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--burgundy); }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--burgundy); font-family: "DM Sans", sans-serif; }

/* Fraunces voices: display = soft + wonky black, accent = soft italic */
.f-display { font-family: "Fraunces", serif; font-weight: 800; font-variation-settings: "opsz" 144, "SOFT" 100, "WONK" 1; letter-spacing: -0.035em; }
.f-accent { font-family: "Fraunces", serif; font-style: italic; font-weight: 500; font-variation-settings: "opsz" 144, "SOFT" 100, "WONK" 1; letter-spacing: -0.02em; }

/* ---- texture on burgundy scenes ---- */
.grain { position: absolute; inset: 0; pointer-events: none; opacity: .16; mix-blend-mode: soft-light; }
.vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(30,6,12,.55) 100%); }

/* ---- scene 1: title card ---- */
#s1 { position: absolute; inset: 0; background: var(--burgundy); z-index: 5; }
#s1 .stack { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 96px 120px; }
#s1 .kick { font-size: 52px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--blush); margin-bottom: 26px; }
#s1 .big { font-size: 206px; line-height: .86; color: var(--cream); }
#s1 .big + .big { margin-left: 70px; }
#s1 .rule { width: 240px; height: 4px; background: var(--blush); margin: 54px 0 40px 6px; border-radius: 2px; transform-origin: 0 50%; }
#s1 .sub { font-size: 60px; font-weight: 500; color: var(--cream); opacity: .92; }
#s1 .danger { font-size: 168px; line-height: 1; color: var(--blush); margin-top: 4px; }
#s1 .stamp { position: absolute; right: 90px; top: 210px; width: 190px; height: 190px; }

/* ---- face-cam scenes ---- */
.face { position: absolute; inset: 0; overflow: hidden; }
.sub-cap, .lock, .tag { z-index: 20; }
.face video { width: 1080px; height: 1920px; object-fit: cover; display: block; }
.warm { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(94,32,43,.18), rgba(94,32,43,0) 30%, rgba(94,32,43,0) 70%, rgba(94,32,43,.22)); }

.sub-cap { z-index: 20 !important; position: absolute; left: 0; right: 0; top: 1205px; display: flex; justify-content: center; padding: 0 70px; z-index: 20; }
.sub-cap span { font-weight: 700; font-size: 52px; color: var(--cream); text-align: center;
  text-shadow: 0 3px 0 var(--burgundy-deep), 0 0 18px rgba(68,21,30,.75); }

.lock { position: absolute; left: 0; right: 0; top: 190px; display: flex; flex-direction: column; align-items: center; z-index: 20; }
.lock .s { font-weight: 800; font-size: 58px; letter-spacing: .02em; color: var(--cream); text-transform: lowercase;
  text-shadow: 0 3px 0 var(--burgundy-deep), 0 0 16px rgba(68,21,30,.7); }
.lock .c { font-size: 168px; line-height: .95; color: var(--blush); margin-top: -8px;
  text-shadow: 0 4px 0 var(--burgundy-deep), 0 0 24px rgba(68,21,30,.6); }

/* pink inner-thought tag (replaces the reference's acid-yellow line) */
.tag { position: absolute; top: 300px; z-index: 20; }
.tag-l { left: 70px; } .tag-r { right: 70px; }
.tag span { display: inline-block; background: var(--blush); color: var(--burgundy); font-size: 58px; padding: 10px 30px 16px; border-radius: 999px;
  transform: rotate(-3deg); box-shadow: 0 8px 0 var(--burgundy-deep); }

/* ---- scene 3: arched window insert ---- */
#s3 { position: absolute; inset: 0; background: var(--burgundy); z-index: 5; }
#s3 .head { position: absolute; left: 0; right: 0; top: 170px; text-align: center; }
#s3 .head .s { font-size: 60px; font-weight: 600; color: var(--cream); letter-spacing: .02em; }
#s3 .head .c { font-size: 190px; line-height: .9; color: var(--blush); }
#arch { position: absolute; left: 150px; top: 560px; width: 780px; height: 1120px; border-radius: 390px 390px 26px 26px;
  border: 14px solid var(--cream); overflow: hidden; box-shadow: 0 30px 60px rgba(30,6,12,.5); }
#arch video { width: 100%; height: 100%; object-fit: cover; object-position: 50% 52%; display: block; }
#s3 .sparkle { position: absolute; width: 90px; height: 90px; }

/* ---- scene 4: product reveal ---- */
#s4 .prod { position: absolute; left: 0; right: 0; top: 160px; text-align: center; z-index: 20; }
#s4 .prod .s { font-weight: 700; font-size: 58px; color: var(--cream); letter-spacing: .14em; text-transform: uppercase;
  text-shadow: 0 3px 0 var(--burgundy-deep), 0 0 16px rgba(68,21,30,.7); }
#s4 .prod .c { font-size: 128px; line-height: 1; color: var(--cream); white-space: nowrap;
  text-shadow: 0 4px 0 var(--burgundy-deep), 0 0 26px rgba(68,21,30,.7); }
#s4 .prod .c i { font-style: inherit; display: inline-block; }
#s4 .prod .c .pk { color: var(--blush); }
#s4 .band { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: var(--burgundy); display: flex; align-items: center; justify-content: center; gap: 28px; z-index: 20; }
#s4 .band span { font-size: 44px; font-weight: 600; color: var(--cream); letter-spacing: .2em; text-transform: uppercase; }
#s4 .band b { width: 14px; height: 14px; border-radius: 50%; background: var(--blush); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="10.19" data-width="1080" data-height="1920">

  <svg width="0" height="0" style="position:absolute">
    <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </svg>

  <!-- audio: the original voice for each moment -->
  <audio id="a1" data-start="0" data-duration="3.07" data-track-index="1" data-media-start="2.10" src="assets/clean.mp4" data-volume="1"></audio>
  <audio id="a2" data-start="3.07" data-duration="3.83" data-track-index="2" data-media-start="43.87" src="assets/clean.mp4" data-volume="1"></audio>
  <audio id="a3" data-start="6.90" data-duration="1.23" data-track-index="1" data-media-start="133.80" src="assets/clean.mp4" data-volume="1"></audio>
  <audio id="a4" data-start="8.13" data-duration="2.06" data-track-index="2" data-media-start="139.07" src="assets/clean.mp4" data-volume="1"></audio>

  <!-- S1: burgundy hook card -->
  <div id="s1" class="clip" data-start="0" data-duration="3.07" data-track-index="10">
    <div class="stack">
      <div class="kick">no bullshit</div>
      <div class="big f-display">people</div>
      <div class="big f-display">I know</div>
      <div class="rule"></div>
      <div class="sub">even when our life is in</div>
      <div class="danger f-accent">danger.</div>
    </div>
    <svg class="stamp" viewBox="0 0 200 200">
      <defs><path id="ring" d="M100,100 m-72,0 a72,72 0 1,1 144,0 a72,72 0 1,1 -144,0"/></defs>
      <circle cx="100" cy="100" r="94" fill="none" stroke="#FDC5F4" stroke-width="3"/>
      <text font-family="DM Sans" font-weight="700" font-size="22" letter-spacing="5" fill="#FDC5F4"><textPath href="#ring">STORYTIME · STORYTIME · STORYTIME · </textPath></text>
      <path d="M100 74 L106 94 L126 100 L106 106 L100 126 L94 106 L74 100 L94 94 Z" fill="#F3EAE3"/>
    </svg>
    <svg class="grain" width="1080" height="1920"><rect width="1080" height="1920" filter="url(#noise)"/></svg>
    <div class="vig"></div>
  </div>

  <!-- S2: face-cam with caption system -->
  <div class="face" style="z-index:2"><video id="v2" data-start="3.07" data-duration="3.83" data-track-index="20" data-media-start="43.87" src="assets/clean.mp4" muted playsinline></video></div>
  <div id="s2" class="clip warm" data-start="3.07" data-duration="3.83" data-track-index="11" style="z-index:3"></div>
  <div id="c2a" class="clip lock" data-start="3.07" data-duration="1.46" data-track-index="30">
    <div class="s">maa behen ki</div><div class="c f-accent">gaaliyan</div>
  </div>
  <div id="c2b" class="clip sub-cap" data-start="4.53" data-duration="0.60" data-track-index="31"><span>diye jaa rahi hai ki</span></div>
  <div id="c2c" class="clip tag tag-r" data-start="5.13" data-duration="0.97" data-track-index="32"><span class="f-accent">tu andha hai kya??</span></div>
  <div id="c2d" class="clip tag tag-l" data-start="6.10" data-duration="0.80" data-track-index="33"><span class="f-accent">tuje dikhta nahi hai??</span></div>

  <!-- S3: arched-window b-roll insert -->
  <div id="s3" class="clip" data-start="6.90" data-duration="1.23" data-track-index="12">
    <div class="head"><div class="s">a nice plate of</div><div class="c f-accent">momo</div></div>
    <svg class="sparkle" style="left:70px;top:1560px" viewBox="0 0 100 100"><path d="M50 4 L58 42 L96 50 L58 58 L50 96 L42 58 L4 50 L42 42 Z" fill="#FDC5F4"/></svg>
    <svg class="sparkle" style="left:930px;top:640px;width:60px;height:60px" viewBox="0 0 100 100"><path d="M50 4 L58 42 L96 50 L58 58 L50 96 L42 58 L4 50 L42 42 Z" fill="#F3EAE3"/></svg>
    <svg class="grain" width="1080" height="1920"><rect width="1080" height="1920" filter="url(#noise)"/></svg>
  </div>

  <div class="arch" id="arch" style="z-index:6"><video id="v3" data-start="6.90" data-duration="1.23" data-track-index="21" data-media-start="133.80" src="assets/clean.mp4" muted playsinline></video></div>

  <!-- S4: product reveal over face-cam -->
  <div class="face" style="z-index:2"><video id="v4" data-start="8.13" data-duration="2.06" data-track-index="22" data-media-start="139.07" src="assets/clean.mp4" muted playsinline></video></div>
  <div id="s4" class="clip" data-start="8.13" data-duration="2.06" data-track-index="13" style="position:absolute;inset:0;z-index:4">
    <div class="warm"></div>
    <div class="prod">
      <div class="s">The Licious</div>
      <div class="c f-accent"><i>M</i><i>o</i><i>t</i><i>h</i><i>e</i><i>r</i><i>&nbsp;</i><i>o</i><i>f</i><i>&nbsp;</i><i>a</i><i>l</i><i>l</i></div>
      <div class="c f-display"><i class="pk">M</i><i class="pk">o</i><i class="pk">m</i><i class="pk">o</i><i class="pk">s</i></div>
    </div>
    <div class="band"><span>no bs momos</span><b></b><span>order online</span></div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // S1 hook card: lines rise in on the spoken words
    tl.set("#s1 .stack > *", { opacity: 0 }, 0);
    tl.fromTo("#s1 .kick", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.05);
    tl.fromTo("#s1 .big:nth-child(2)", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 0.55);
    tl.fromTo("#s1 .big:nth-child(3)", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 0.8);
    tl.fromTo("#s1 .rule", { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.inOut" }, 1.4);
    tl.fromTo("#s1 .sub", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 1.53);
    tl.fromTo("#s1 .danger", { opacity: 0, scale: 1.25, transformOrigin: "0% 60%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" }, 2.33);
    tl.fromTo("#s1 .stamp", { rotation: 0 }, { rotation: 40, duration: 3.07, ease: "none" }, 0);

    // S2 captions
    tl.fromTo("#c2a .s", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, 3.09);
    tl.fromTo("#c2a .c", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "power2.out", immediateRender: false }, 3.18);
    tl.fromTo("#c2b span", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.15, ease: "power2.out", immediateRender: false }, 4.54);
    tl.fromTo("#c2c span", { opacity: 0, scale: 0.6, rotation: -10 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.3, ease: "back.out(2.5)", immediateRender: false }, 5.14);
    tl.fromTo("#c2d span", { opacity: 0, scale: 0.6, rotation: 4 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.3, ease: "back.out(2.5)", immediateRender: false }, 6.11);

    // S3 arch insert
    tl.set("#arch", { opacity: 0 }, 0);
    tl.set(["#s3 .head .s", "#s3 .head .c", "#arch"], { opacity: 0 }, 6.90);
    tl.set("#arch", { opacity: 0 }, 8.13);
    tl.fromTo("#arch", { opacity: 0, y: 80, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "expo.out" }, 6.91);
    tl.fromTo("#s3 .head .s", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 6.95);
    tl.fromTo("#s3 .head .c", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 7.15);
    tl.fromTo("#s3 .sparkle", { rotation: -30, scale: 0.4 }, { rotation: 15, scale: 1, duration: 1.2, ease: "power1.out" }, 6.9);

    // S4 product write-on + band
    tl.set(["#s4 .prod .s", "#s4 .prod .c i", "#s4 .band"], { opacity: 0 }, 8.13);
    tl.fromTo("#s4 .prod .s", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 8.15);
    tl.fromTo("#s4 .prod .c i", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.2, stagger: 0.045, ease: "power2.out" }, 8.35);
    tl.fromTo("#s4 .band", { opacity: 1, yPercent: 100 }, { yPercent: 0, duration: 0.35, ease: "expo.out" }, 9.1);

    tl.set({}, {}, 10.19);
    window.__timelines["main"] = tl;
  </script>
</div>
</body>
</html>
