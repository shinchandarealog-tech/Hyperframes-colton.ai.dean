<title>Udaan Reel Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
/* Layout: simple editing console. 9:16 preview left, one beat panel right, beat strip below. Single dark look. */
:root{
  --bg:#0c1120; --panel:#141b2e; --panel2:#1b2440; --line:#2a3555; --txt:#e9edf7; --mute:#97a3c2;
  --red:#D7192A; --redsoft:#2c1b29; --ok:#35c37a; --warn:#ffb347;
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --display:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 var(--ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;background:var(--bg);border-bottom:1px solid var(--line)}
header.bar h1{font:800 22px/1 var(--display);letter-spacing:.5px;margin:0 6px 0 0;text-transform:uppercase}
header.bar h1 b{color:var(--red)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#4a5a88}
.btn.primary{background:var(--red);border-color:var(--red);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.time{font-variant-numeric:tabular-nums;color:var(--mute)}
.status{margin-left:auto;color:var(--mute);font-size:13px}
.status.dirty{color:var(--warn)} .status.ok{color:var(--ok)}
main{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;padding-top:14px;align-items:start}
@media (max-width:860px){main{grid-template-columns:minmax(0,1fr)}}
.stagecol{display:flex;flex-direction:column;align-items:center;gap:8px;position:sticky;top:70px}
@media (max-width:860px){.stagecol{position:static}}
.stage{position:relative;background:#000;border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:100%;contain:strict}
.stage #root{position:absolute;left:0;top:0;transform-origin:0 0}
.timeline{grid-column:1/-1;position:relative;height:58px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
.timeline .bk{position:absolute;top:6px;bottom:6px;border-right:2px solid var(--bg);padding:3px 4px;font-size:11px;font-weight:600;overflow:hidden;white-space:nowrap;color:#fff}
.timeline .bk.sel{outline:2px solid #fff;outline-offset:-2px;z-index:2}
.timeline .ph{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none;z-index:3}
aside{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.bhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bhead h2{margin:0;font:800 26px/1.1 var(--display);text-transform:uppercase;letter-spacing:.4px}
.bhead .dur{color:var(--mute);font-variant-numeric:tabular-nums}
.vo{color:var(--mute);font-style:italic;margin:4px 0 10px}
.sec{border-top:1px solid var(--line);padding:12px 0 8px}
.sec h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mute);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;text-align:left;font-weight:600}
.card small{display:block;font-weight:400;font-size:11.5px;color:var(--mute);margin-top:2px}
.card.sel{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset;background:var(--redsoft)}
.clips{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;max-height:300px;overflow-y:auto;padding:2px}
.clipc{position:relative;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;cursor:pointer;background:#000;aspect-ratio:9/16}
.clipc img{display:block;width:100%;height:100%;object-fit:cover}
.clipc span{position:absolute;left:0;right:0;bottom:0;padding:14px 4px 3px;font-size:10.5px;line-height:1.2;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;text-align:left}
.clipc i{position:absolute;top:4px;left:4px;font-style:normal;font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:4px;background:rgba(0,0,0,.65);color:#fff}
.clipc i.real{background:var(--red)}
.clipc.sel{border-color:var(--red)}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{background:none;border:1px solid var(--line);border-radius:20px;padding:4px 12px;cursor:pointer;color:var(--mute)}
.tabs button.on{background:var(--panel2);color:var(--txt);border-color:#4a5a88}
.lbl{display:block;font-size:12px;color:var(--mute);margin:8px 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 130px;min-width:0}
select,input[type=number],input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input[type=text]{text-transform:uppercase}
input[type=range]{width:100%;accent-color:var(--red)}
details{border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
summary{cursor:pointer;color:var(--mute);font-weight:600;padding:4px 0}
.chk{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.foot{grid-column:1/-1;font-size:12.5px;color:var(--mute)}
.foot b{color:var(--txt)}
.linkbtn{background:none;border:none;color:var(--mute);text-decoration:underline;cursor:pointer;padding:0}
/*__ENGINE_CSS__*/
</style>

<header class="bar">
  <h1><b>Udaan</b> Reel</h1>
  <button class="btn" id="play" type="button">▶ Play</button>
  <button class="btn" id="prev" type="button" aria-label="Previous beat">◀</button>
  <button class="btn" id="next" type="button" aria-label="Next beat">▶▶</button>
  <span class="time" id="time">0.0s</span>
  <span class="status" id="status">Loading…</span>
  <button class="btn primary" id="save" type="button" disabled>Save</button>
</header>
<main>
  <div class="stagecol"><div class="stage" id="stage"><div id="root"></div></div></div>
  <aside id="insp"></aside>
  <div class="timeline" id="tlbar"><div class="ph" id="ph"></div></div>
  <div class="foot">Preview uses light copies of the footage; the final render uses full quality. After saving, tell Claude <b>"pull my edits"</b>. · <button class="linkbtn" id="undo" type="button">Undo last change</button> · <button class="linkbtn" id="copy" type="button">Copy edit</button></div>
</main>
<audio id="vo" preload="auto" src="assets/vo.mp3"></audio>

<script>
/*__DESIGNS_JS__*/
</script>
<script>
const DEFAULT_PROJECT = /*__PROJECT__*/null;
const SOURCES = /*__SOURCES__*/[];
const D = window.UdaanDesigns;
const $ = (s) => document.querySelector(s);
const rootEl = $("#root"), audio = $("#vo");
let P = JSON.parse(JSON.stringify(DEFAULT_PROJECT)), B, tl, sel = 0, playing = false, t = 0, clock = null, dirty = false, db = null, clipTab = "all";
let SLOTS = [], TIMED = [];
const POOL = {};             // one <video> per source, reused across beats
const undo = [];
const SCENE_COL = ["#555", "#7b3fa0", "#2b6cb0", "#c0392b", "#d35400", "#16a085", "#8e44ad", "#b7950b"];
const srcInfo = (src) => SOURCES.find((s) => s.src === src) || { label: src.split("/").pop(), kind: "ai", dur: 8 };
const thumbOf = (src) => "assets/thumbs/" + src.split("/").pop().replace(".mp4", ".jpg");

function sizeStage() {
  const narrow = innerWidth <= 860;
  const h = Math.max(360, Math.min(innerHeight - 170, narrow ? innerHeight * 0.62 : 860));
  const w = Math.min(h * 9 / 16, narrow ? document.body.clientWidth - 32 : 9999);
  const k = w / 1080, st = $("#stage");
  st.style.width = w + "px"; st.style.height = 1920 * k + "px";
  rootEl.style.transform = `scale(${k})`;
}
addEventListener("resize", sizeStage);

function poolVideo(key, src) {
  let v = POOL[key];
  if (!v) { v = document.createElement("video"); v.muted = true; v.playsInline = true; v.setAttribute("playsinline", ""); v.preload = "auto"; v.src = src; POOL[key] = v; }
  return v;
}

function rebuild() {
  B = D.withDur(P);
  for (const k in POOL) { const v = POOL[k]; v.pause(); if (v.parentElement) v.remove(); }
  rootEl.innerHTML = D.markup(P, "");
  SLOTS = [];
  rootEl.querySelectorAll("video").forEach((v) => {
    SLOTS.push({ box: v.parentElement, src: v.getAttribute("src"), ms: +v.dataset.mediaStart, s: +v.dataset.start, d: +v.dataset.duration, pos: v.style.objectPosition, filt: v.style.filter, id: v.id });
    v.remove();
  });
  TIMED = [...rootEl.querySelectorAll("[data-start]")].map((el) => ({ el, s: +el.dataset.start, d: +el.dataset.duration, on: null }));
  if (tl) tl.kill();
  tl = gsap.timeline({ paused: true });
  D.buildTimeline(tl, P);
  drawTimeline();
  render(t, true);
}

function render(time, force) {
  t = Math.max(0, Math.min(P.meta.duration - 0.001, time));
  tl.seek(t, false);
  for (const x of TIMED) { const on = t >= x.s && t < x.s + x.d; if (on !== x.on) { x.on = on; x.el.style.visibility = on ? "visible" : "hidden"; } }
  const used = new Set();
  for (const sl of SLOTS) {
    if (!(t >= sl.s && t < sl.s + sl.d)) continue;
    let key = sl.src; if (used.has(key)) key += "#2"; used.add(key);
    const v = poolVideo(key, sl.src);
    if (v.parentElement !== sl.box) { sl.box.appendChild(v); v.style.objectPosition = sl.pos; v.style.filter = sl.filt; }
    const target = sl.ms + (t - sl.s);
    if (playing) { if (v.paused) { v.currentTime = target; v.play().catch(() => {}); } else if (Math.abs(v.currentTime - target) > 0.3) v.currentTime = target; }
    else { if (!v.paused) v.pause(); if (force || Math.abs(v.currentTime - target) > 0.05) v.currentTime = target; }
  }
  for (const k in POOL) if (!used.has(k) && !POOL[k].paused) POOL[k].pause();
  // warm up the next clip ~0.8s before it cuts in
  for (const sl of SLOTS) if (sl.s > t && sl.s - t < 0.8 && !used.has(sl.src)) { const v = poolVideo(sl.src, sl.src); if (Math.abs(v.currentTime - sl.ms) > 0.1 && !v.seeking) v.currentTime = sl.ms; }
  $("#ph").style.left = (t / P.meta.duration) * 100 + "%";
  $("#time").textContent = t.toFixed(1) + "s";
  if (playing) { const cur = B.findIndex((b) => t >= b.start && t < b.start + b.dur); if (cur >= 0 && cur !== sel) { sel = cur; markSel(); drawInspector(); } }
}
function tick() {
  if (!playing) return;
  const now = clock.t0 + (performance.now() - clock.p0) / 1000;
  if (clock.stopAt && now >= clock.stopAt) { pause(); render(clock.stopAt - 0.02, true); return; }
  if (now >= P.meta.duration) { pause(); render(P.meta.duration - 0.01, true); return; }
  if (now < P.meta.voDuration) { if (audio.paused) { audio.currentTime = now; audio.play().catch(() => {}); } else if (Math.abs(audio.currentTime - now) > 0.15) audio.currentTime = now; }
  else if (!audio.paused) audio.pause();
  render(now);
  requestAnimationFrame(tick);
}
function play(stopAt) { if (playing) return; playing = true; clock = { t0: t >= P.meta.duration - 0.05 ? 0 : t, p0: performance.now(), stopAt }; $("#play").textContent = "❚❚ Pause"; requestAnimationFrame(tick); }
function pause() { playing = false; audio.pause(); for (const k in POOL) POOL[k].pause(); $("#play").textContent = "▶ Play"; }
function seekTo(time) { if (playing) { clock = { t0: time, p0: performance.now(), stopAt: clock.stopAt }; audio.currentTime = Math.min(time, P.meta.voDuration); } render(time, true); }
function playBeat(i) { select(i); pause(); render(B[i].start, true); play(B[i].start + B[i].dur); }

function drawTimeline() {
  const bar = $("#tlbar"); bar.querySelectorAll(".bk").forEach((e) => e.remove());
  const T = P.meta.duration;
  B.forEach((b, i) => {
    const e = document.createElement("div"); e.className = "bk" + (i === sel ? " sel" : "");
    e.style.left = (b.start / T) * 100 + "%"; e.style.width = (b.dur / T) * 100 + "%";
    e.style.background = SCENE_COL[b.scene] || "#444";
    e.textContent = i + 1; e.title = `Beat ${i + 1} · ${b.dur.toFixed(1)}s · ${b.vo}`;
    e.onclick = (ev) => { ev.stopPropagation(); pause(); select(i); seekTo(b.start + 0.05); };
    bar.appendChild(e);
  });
  bar.onclick = (ev) => { const r = bar.getBoundingClientRect(); seekTo(((ev.clientX - r.left) / r.width) * T); };
}
function markSel() { document.querySelectorAll("#tlbar .bk").forEach((e, i) => e.classList.toggle("sel", i === sel)); }
function select(i) { sel = Math.max(0, Math.min(B.length - 1, i)); markSel(); drawInspector(); }

function beat() { return P.beats.find((x) => x.id === B[sel].id); }
function change(fn, opts = {}) {
  undo.push(JSON.stringify(P)); if (undo.length > 60) undo.shift();
  fn(beat()); markDirty(); rebuild(); drawInspector();
  if (opts.replay) playBeat(sel); else render(Math.max(B[sel].start + 0.05, Math.min(t, B[sel].start + B[sel].dur - 0.05)), true);
}
function markDirty() { dirty = true; setStatus(db ? "Unsaved changes" : "Not saved (sign in to save)", "dirty"); }
function setStatus(s, cls) { const e = $("#status"); e.textContent = s; e.className = "status " + (cls || ""); }

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const opt = (v, label, cur) => `<option value="${esc(v)}"${v === cur ? " selected" : ""}>${esc(label)}</option>`;
const card = (kind, id, name, desc, cur) => `<button type="button" class="card${id === cur ? " sel" : ""}" data-kind="${kind}" data-id="${id}">${esc(name)}<small>${esc(desc)}</small></button>`;
const SHORT = { none: "No headline", slam: "Huge word + shake", stack: "Navy/red blocks", kinetic: "Words pop in", marker: "Red highlight", outline: "Outline → fill", tag: "Red ribbon", stamp: "Round badge" };
const SHORTA = { none: "Nothing extra", corners: "Frame brackets", speedlines: "Speed streaks", balltrail: "Cricket ball zip", slashes: "Diagonal bars", burst: "Impact rays", shine: "Light glint", pulse: "Red edge pulse" };

function clipGrid(cur) {
  const list = SOURCES.filter((s) => clipTab === "all" || s.kind === clipTab);
  return `<div class="tabs">${["all", "real", "ai"].map((k) => `<button type="button" data-tab="${k}" class="${clipTab === k ? "on" : ""}">${k === "all" ? "All" : k === "real" ? "Real footage" : "AI clips"}</button>`).join("")}</div>
  <div class="clips">${list.map((s) => `<button type="button" class="clipc${s.src === cur ? " sel" : ""}" data-src="${esc(s.src)}" title="${esc(s.label)} · ${s.dur}s"><img loading="lazy" src="${thumbOf(s.src)}" alt=""><i class="${s.kind}">${s.kind === "real" ? "REAL" : "AI"}</i><span>${esc(s.label)}</span></button>`).join("")}</div>`;
}

function drawInspector() {
  const b = B[sel], raw = beat(), sg = D.suggest(raw);
  const dIds = [...new Set([raw.design, ...sg.designs])].filter((x) => D.DESIGNS[x]).slice(0, 4);
  const aIds = [...new Set(["none", raw.accent, ...sg.accents])].filter((x) => D.ACCENTS[x]).slice(0, 5);
  const info = srcInfo(raw.src), maxIn = Math.max(0, info.dur - b.dur);
  const f = raw.fit || { x: 50, y: 50, zoom: 1 };
  const hasText = raw.design !== "none";
  $("#insp").innerHTML = `
    <div class="bhead"><h2>Beat ${sel + 1}</h2><span class="dur">${b.start.toFixed(1)}s → ${(b.start + b.dur).toFixed(1)}s · ${b.dur.toFixed(1)}s</span>
      <button class="btn" type="button" id="replay" style="margin-left:auto">▶ Play beat</button></div>
    <div class="vo">“${esc(b.vo)}”</div>

    <div class="sec"><h3>1 · Clip</h3>
      ${clipGrid(raw.src)}
      <label class="lbl" for="in">Start the clip from <b id="inv">${(+raw.in).toFixed(1)}s</b> (clip is ${info.dur}s)</label>
      <input type="range" id="in" min="0" max="${maxIn.toFixed(2)}" step="0.05" value="${Math.min(raw.in, maxIn)}">
    </div>

    <div class="sec"><h3>2 · Design</h3>
      <div class="cards">${dIds.map((id) => card("design", id, D.DESIGNS[id].name, SHORT[id] || "", raw.design)).join("")}</div>
      ${hasText ? `<label class="lbl" for="text">Text (use | for a new line)</label><input type="text" id="text" value="${esc((raw.text || []).join(" | "))}" placeholder="E.G. PROFESSIONAL | COACHING">` : ""}
    </div>

    <div class="sec"><h3>3 · Graphic</h3>
      <div class="cards">${aIds.map((id) => card("accent", id, D.ACCENTS[id].name, SHORTA[id] || "", raw.accent)).join("")}</div>
    </div>

    <details id="more"><summary>More options</summary>
      <div class="row"><div><label class="lbl" for="motion">Camera move</label><select id="motion">${Object.keys(D.MOTIONS).map((k) => opt(k, D.MOTIONS[k].name, raw.motion)).join("")}</select></div>
      <div><label class="lbl" for="trans">Transition in</label><select id="trans">${Object.keys(D.TRANSITIONS).map((k) => opt(k, D.TRANSITIONS[k].name, raw.trans)).join("")}</select></div></div>
      <div class="row"><div><label class="lbl" for="designAll">Any design</label><select id="designAll">${Object.keys(D.DESIGNS).map((k) => opt(k, D.DESIGNS[k].name, raw.design)).join("")}</select></div>
      <div><label class="lbl" for="accentAll">Any graphic</label><select id="accentAll">${Object.keys(D.ACCENTS).map((k) => opt(k, D.ACCENTS[k].name, raw.accent)).join("")}</select></div></div>
      <div class="row"><div><label class="lbl" for="fx">Frame left/right</label><input type="range" id="fx" min="0" max="100" value="${f.x}"></div>
      <div><label class="lbl" for="fy">Frame up/down</label><input type="range" id="fy" min="0" max="100" value="${f.y}"></div>
      <div><label class="lbl" for="fz">Zoom</label><input type="range" id="fz" min="1" max="2.5" step="0.05" value="${f.zoom}"></div></div>
      <div class="row"><div><label class="lbl" for="start">Cut in at (s)</label><input type="number" id="start" step="0.05" value="${raw.start}"${sel === 0 ? " disabled" : ""}></div>
      <div><label class="lbl" for="layout">Layout</label><select id="layout">${opt("full", "Full screen", raw.layout || "full")}${opt("split", "Split screen", raw.layout || "full")}</select></div></div>
      ${raw.layout === "split" ? `<div class="row"><div><label class="lbl" for="src2">Bottom clip</label><select id="src2">${SOURCES.map((s) => opt(s.src, s.label, raw.src2)).join("")}</select></div><div><label class="lbl" for="in2">Bottom starts from (s)</label><input type="number" id="in2" step="0.1" value="${raw.in2 || 0}"></div></div>` : ""}
      <div class="row" style="margin-top:10px"><label class="chk"><input type="checkbox" id="grade"${raw.grade ? " checked" : ""}> Brighter colour</label>
      <button class="btn" type="button" id="splitHere">✂ Split beat at playhead</button><button class="btn" type="button" id="merge">Merge with next</button></div>
    </details>`;

  const I = (id) => $("#" + id);
  const more = I("more"); if (window.__moreOpen) more.open = true; more.ontoggle = () => (window.__moreOpen = more.open);
  I("replay").onclick = () => playBeat(sel);
  document.querySelectorAll(".tabs button").forEach((x) => (x.onclick = () => { clipTab = x.dataset.tab; drawInspector(); }));
  document.querySelectorAll(".clipc").forEach((c) => (c.onclick = () => change((x) => {
    const src = c.dataset.src, d = srcInfo(src).dur; x.src = src; x.grade = src.includes("/real/");
    if (x.in > d - b.dur) x.in = 0; x.burned = false; x.fit = { x: 50, y: 50, zoom: 1 };
  }, { replay: true })));
  // live scrub of the clip start (cheap: just move the slot), commit on release
  I("in").oninput = (e) => {
    const v = +e.target.value; I("inv").textContent = v.toFixed(1) + "s";
    for (const sl of SLOTS) if (sl.id === "v-" + raw.id) sl.ms = v;
    pause(); render(B[sel].start + 0.05, true);
  };
  I("in").onchange = (e) => change((x) => (x.in = +(+e.target.value).toFixed(2)), { replay: true });
  document.querySelectorAll(".card").forEach((c) => (c.onclick = () => change((x) => {
    x[c.dataset.kind] = c.dataset.id;
    if (c.dataset.kind === "design" && c.dataset.id !== "none" && !(x.text || []).length) x.text = ["UDAAN"];
  }, { replay: true })));
  if (I("text")) I("text").onchange = (e) => change((x) => (x.text = e.target.value.split("|").map((s) => s.trim().toUpperCase()).filter(Boolean)), { replay: true });
  I("designAll").onchange = (e) => change((x) => (x.design = e.target.value), { replay: true });
  I("accentAll").onchange = (e) => change((x) => (x.accent = e.target.value), { replay: true });
  I("motion").onchange = (e) => change((x) => (x.motion = e.target.value), { replay: true });
  I("trans").onchange = (e) => change((x) => (x.trans = e.target.value), { replay: true });
  const fitCh = () => change((x) => (x.fit = { x: +I("fx").value, y: +I("fy").value, zoom: +I("fz").value }));
  ["fx", "fy", "fz"].forEach((k) => (I(k).onchange = fitCh));
  I("grade").onchange = (e) => change((x) => (x.grade = e.target.checked));
  I("layout").onchange = (e) => change((x) => { if (e.target.value === "split") { x.layout = "split"; x.src2 = x.src2 || SOURCES.find((s) => s.kind === "real").src; x.in2 = x.in2 || 0; x.delay2 = x.delay2 == null ? 0.5 : x.delay2; } else delete x.layout; }, { replay: true });
  if (I("src2")) { I("src2").onchange = (e) => change((x) => (x.src2 = e.target.value), { replay: true }); I("in2").onchange = (e) => change((x) => (x.in2 = +e.target.value), { replay: true }); }
  I("start").onchange = (e) => {
    const prev = B[sel - 1], next = B[sel + 1];
    const lo = prev ? prev.start + 0.2 : 0, hi = next ? next.start - 0.2 : P.meta.duration - 0.2;
    change((x) => (x.start = +Math.max(lo, Math.min(hi, +e.target.value)).toFixed(3)), { replay: true });
  };
  I("splitHere").onclick = () => {
    if (!(t > b.start + 0.2 && t < b.start + b.dur - 0.2)) { setStatus("Move the playhead inside this beat first", "dirty"); return; }
    undo.push(JSON.stringify(P));
    const src = beat(), nb = JSON.parse(JSON.stringify(src));
    let n = 1; while (P.beats.some((x) => x.id === src.id + String.fromCharCode(96 + n))) n++;
    nb.id = src.id + String.fromCharCode(96 + n); nb.start = +t.toFixed(3); nb.in = +(src.in + (t - src.start)).toFixed(3);
    nb.trans = "flash"; nb.motion = "punch"; nb.text = []; nb.design = "none"; delete nb.patch;
    if (src.patch) { const pf = src.start + (src.patch.from || 0); if (pf >= t) { nb.patch = Object.assign({}, src.patch, { from: +(pf - t).toFixed(3) }); delete src.patch; } else nb.patch = Object.assign({}, src.patch, { from: 0 }); }
    P.beats.push(nb); P.beats.sort((a, c) => a.start - c.start);
    markDirty(); rebuild(); select(B.findIndex((x) => x.id === nb.id));
  };
  I("merge").onclick = () => {
    if (sel >= B.length - 1) return;
    const nid = B[sel + 1].id;
    change((x) => { const nx = P.beats.find((y) => y.id === nid); if (nx.patch && !x.patch) x.patch = Object.assign({}, nx.patch, { from: +((nx.start - x.start) + (nx.patch.from || 0)).toFixed(3) }); P.beats = P.beats.filter((y) => y.id !== nid); });
  };
}

$("#play").onclick = () => (playing ? pause() : play());
$("#prev").onclick = () => { pause(); select(sel - 1); seekTo(B[sel].start + 0.05); };
$("#next").onclick = () => { pause(); select(sel + 1); seekTo(B[sel].start + 0.05); };
$("#undo").onclick = () => { if (!undo.length) { setStatus("Nothing to undo"); return; } P = JSON.parse(undo.pop()); markDirty(); rebuild(); select(Math.min(sel, B.length - 1)); };
$("#copy").onclick = () => navigator.clipboard.writeText(JSON.stringify(P)).then(() => setStatus("Edit copied. Paste it to Claude", "ok")).catch(() => setStatus("Copy blocked here. Use Save", "dirty"));
$("#save").onclick = async () => {
  if (!db) return;
  $("#save").disabled = true; setStatus("Saving…");
  try { await db.doc("edits/current").set({ meta: P.meta, beats: P.beats, savedAt: new Date().toISOString() }); dirty = false; setStatus("Saved ✓ tell Claude \"pull my edits\"", "ok"); }
  catch (e) { setStatus("Save failed: " + ((e && (e.code || e.message)) || e), "dirty"); }
  $("#save").disabled = false;
};
addEventListener("keydown", (e) => {
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.code === "Space") { e.preventDefault(); playing ? pause() : play(); }
  else if (e.key === "ArrowLeft") $("#prev").click();
  else if (e.key === "ArrowRight") $("#next").click();
});

sizeStage(); rebuild(); select(0); setStatus("Claude's cut");
(async () => {
  try {
    if (!window.claude || !window.claude.use) { setStatus("Preview only", "dirty"); return; }
    db = await window.claude.use("db");
    if (!db) { setStatus("Preview only. Sign in to save", "dirty"); return; }
    $("#save").disabled = false;
    const snap = await Promise.race([db.doc("edits/current").get(), new Promise((r) => setTimeout(() => r("timeout"), 10000))]);
    if (snap === "timeout") { setStatus("Couldn't load saved edit", "dirty"); return; }
    if (snap.exists && !dirty) {
      const d = snap.data();
      if (d && Array.isArray(d.beats) && d.beats.length) { P = { meta: d.meta || P.meta, beats: JSON.parse(JSON.stringify(d.beats)) }; rebuild(); select(0); setStatus("Your saved edit", "ok"); }
    }
  } catch (e) { setStatus("Saved edit unavailable", "dirty"); }
})();
</script>
