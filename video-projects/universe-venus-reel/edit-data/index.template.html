<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>The Universe by Venus — d4niel.hee style edit</title>
  <!--FONTS-->
  <style>
    html, body { margin: 0; padding: 0; background: #000; }
    #main { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
    #main video.plate { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
    #plate { z-index: 0; }
    #person { z-index: 2; }
    .layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    #back { z-index: 1; }
    #front { z-index: 3; }
    .beat-layer { position: absolute; inset: 0; opacity: 0; }

    /* captions: d4niel.hee reference (white Exo 2 lead-in, heavy pink slanted Orbitron line) */
    .grp { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; transform: translateY(-50%); }
    .k { font-family: "Exo 2", sans-serif; font-weight: 400; font-size: 58px; line-height: 1.2; color: #fff; letter-spacing: .01em; white-space: nowrap;
      text-shadow: 0 2px 4px rgba(0,0,0,.75), 0 0 16px rgba(0,0,0,.6), 0 0 34px rgba(0,0,0,.35); }
    .k span, .e span { display: inline-block; margin: 0 .14em; }
    .k { padding: 2px 34px 6px; border-radius: 40px; background: radial-gradient(ellipse at center, rgba(10,4,8,.42) 0%, rgba(10,4,8,.28) 55%, rgba(10,4,8,0) 78%); }
    .e { font-family: "Orbitron", sans-serif; font-weight: 900; text-transform: uppercase; color: #E8196F; white-space: nowrap; line-height: 1; position: relative;
      transform: skewX(-12deg); text-shadow: 0 2px 0 rgba(70,0,25,.35), 0 0 18px rgba(232,25,111,.7), 0 0 46px rgba(232,25,111,.35); }
    .sweep { position: absolute; left: -4%; width: 108%; top: 48%; height: 6px; background: #fff; border-radius: 3px; box-shadow: 0 0 14px #fff, 0 0 30px rgba(255,180,210,.9); transform-origin: 0 50%; }
    .tail { align-self: flex-end; margin-right: 150px; font-size: 46px; }
    /* text behind the subject */
    .big { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; transform: translateY(-50%); }
    .big .ln { font-family: "Orbitron", sans-serif; font-weight: 900; text-transform: uppercase; line-height: .92; white-space: nowrap;
      color: #E8196F; transform: skewX(-10deg); text-shadow: 0 6px 24px rgba(60,0,20,.35); }
    /* liquid glass */
    .glass { position: absolute; border-radius: 44px; color: #fff; font-family: "Inter", sans-serif; overflow: hidden;
      background: linear-gradient(145deg, rgba(255,255,255,.26), rgba(255,255,255,.07) 45%, rgba(255,255,255,.13)), rgba(22,14,20,.5);
      text-shadow: 0 1px 8px rgba(0,0,0,.35);
      -webkit-backdrop-filter: blur(26px) saturate(185%); backdrop-filter: blur(26px) saturate(185%);
      border: 2px solid rgba(255,255,255,.42);
      box-shadow: inset 0 2px 1px rgba(255,255,255,.75), inset 0 -2px 2px rgba(255,255,255,.18), inset 0 0 40px rgba(255,255,255,.10), 0 28px 60px rgba(0,0,0,.32), 0 4px 14px rgba(0,0,0,.18); }
    .glass .sheen { position: absolute; top: -40%; bottom: -40%; width: 42%; left: -60%; transform: rotate(18deg);
      background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.38), rgba(255,255,255,0)); }
    .glass .in { position: relative; padding: 34px 40px; }
    .g-row { display: flex; align-items: center; gap: 28px; }
    .g-ico { width: 96px; height: 96px; border-radius: 26px; flex: none; display: grid; place-items: center;
      background: linear-gradient(160deg, #FF4D95, #D0105C); box-shadow: inset 0 2px 1px rgba(255,255,255,.55), 0 10px 24px rgba(208,16,92,.45); }
    .g-ico svg { width: 54px; height: 54px; }
    .g-t1 { font-size: 54px; font-weight: 700; letter-spacing: -.02em; line-height: 1.05; text-shadow: 0 1px 10px rgba(0,0,0,.25); }
    .g-t2 { font-size: 32px; font-weight: 500; line-height: 1.25; color: rgba(255,255,255,.85); margin-top: 6px; }
    .g-lbl { font-size: 28px; line-height: 1.2; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.8); }
    .g-ck { display: flex; align-items: center; gap: 24px; font-size: 42px; line-height: 1.2; font-weight: 600; margin-top: 20px; letter-spacing: -.01em; }
    .g-ck .bx { width: 52px; height: 52px; border-radius: 50%; border: 3px solid rgba(255,255,255,.7); position: relative; flex: none; box-sizing: border-box; }
    .g-ck .fill { position: absolute; inset: -3px; border-radius: 50%; background: #E8196F; box-shadow: 0 0 18px rgba(232,25,111,.7); }
    .g-ck svg { position: absolute; inset: 9px; width: 28px; height: 28px; }
    .g-pill { border-radius: 999px; }
    .g-pill .in { padding: 24px 48px; font-size: 46px; line-height: 1.2; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; display: flex; align-items: center; gap: 18px; }
    .g-pill .dot { width: 22px; height: 22px; border-radius: 50%; background: #E8196F; box-shadow: 0 0 14px #E8196F; }
    .g-note .app { display: flex; align-items: center; gap: 16px; font-size: 28px; line-height: 1.2; font-weight: 600; color: rgba(255,255,255,.88); text-transform: uppercase; letter-spacing: .04em; }
    .g-note .app .mini { width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(160deg, #2A2118, #0E0B08); display: grid; place-items: center; box-shadow: inset 0 1px 1px rgba(255,255,255,.3); }
    .g-note .app .when { margin-left: auto; font-weight: 500; text-transform: none; letter-spacing: 0; color: rgba(255,255,255,.7); }
    .g-note .tt { font-size: 44px; line-height: 1.2; font-weight: 700; margin-top: 14px; letter-spacing: -.01em; }
    .g-note .bd { font-size: 38px; line-height: 1.25; font-weight: 500; color: rgba(255,255,255,.9); margin-top: 4px; }
  </style>
</head>
<body>
  <div id="main" data-composition-id="main" data-start="0" data-duration="56.2" data-width="1080" data-height="1920">
    <video id="plate" class="plate" src="assets/clean.mp4" data-start="0" data-duration="56.2" data-track-index="0" muted playsinline></video>
    <audio id="voice" src="assets/clean.mp4" data-start="0" data-duration="56.2" data-track-index="1" data-volume="1"></audio>
    <div id="back" class="layer"></div>
    <video id="person" class="plate" src="assets/person-22-29.webm" data-start="22" data-duration="7.27" data-track-index="2" muted playsinline></video>
    <div id="front" class="layer"></div>
<!--SFX-->
  </div>
  <script src="assets/gsap.min.js"></script>
  <!--LAYOUT-->
  <script src="overlay.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = window.buildUniverseOverlay(document.getElementById("back"), document.getElementById("front"), 56.2);
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
